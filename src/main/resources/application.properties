# 전체 로그 레벨 설정 (기본은 INFO)
logging.level.root=INFO

# 내가 만든 패키지의 로그 레벨을 DEBUG로 설정 (가장 상세히 보임)
# 패키지 경로를 본인의 프로젝트 구조에 맞게 수정하세요.
logging.level.com.goodee.beedan=DEBUG

# 로그 출력 형식 커스텀 (선택 사항)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


