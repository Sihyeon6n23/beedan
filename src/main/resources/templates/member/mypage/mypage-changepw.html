<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('마이페이지', '비밀번호 변경', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | 비밀번호 변경</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{member/mypage/mypage-sidebar :: sidebar}">
    </div>
</th:block>

<th:block th:fragment="content">
    <main class="flex-grow p-12 bg-background">
        <div class="max-w-5xl mx-auto">
            <div class="max-w-2xl">
                <span class="text-primary font-black tracking-widest text-xs uppercase mb-2 block">chage password</span>
                <h1
                        class="font-headline text-3xl md:text-5xl font-extrabold tracking-tighter text-on-surface mb-4 uppercase leading-none">
                    비밀번호 변경
                </h1>
                <p class="font-body text-secondary max-w-sm text-lg opacity-80">
                    고유한 비밀번호를 사용하여 기업 계정을 안전하게 보호하세요. 보안을 위해 90일마다 비밀번호를 갱신하는 것이 좋습니다.
                </p>
            </div>


            <div class="grid grid-cols-12 gap-12">

                <div class="col-span-12 lg:col-span-8">
                    <div class="bg-surface-container-lowest p-10 border-l-[6px] border-primary shadow-chat-shell">
                        <form th:action="@{/profile/password}" method="POST" class="space-y-8">
                            <div class="space-y-3">
                                <label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-secondary" for="current_password">현재 비밀번호</label>
                                <div class="relative">
                                    <input type="password" id="current_password" name="currentPassword"
                                           class="bd-input bg-surface-container-low focus:ring-1 focus:ring-primary transition-all"
                                           placeholder="현재 사용 중인 비밀번호를 입력하세요" required />
                                </div>
                            </div>

                            <div class="space-y-3">
                                <label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-secondary" for="new_password">새 비밀번호</label>
                                <input type="password" id="new_password" name="newPassword"
                                       class="bd-input bg-surface-container-low focus:ring-1 focus:ring-primary transition-all"
                                       placeholder="새로운 비밀번호를 입력하세요" required />
                            </div>

                            <div class="space-y-3">
                                <label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-secondary" for="confirm_password">새 비밀번호 확인</label>
                                <input type="password" id="confirm_password" name="confirmPassword"
                                       class="bd-input bg-surface-container-low focus:ring-1 focus:ring-primary transition-all"
                                       placeholder="비밀번호를 다시 한번 입력하세요" required />
                            </div>

                            <div class="pt-4">
                                <button type="submit" class="btn-primary w-full md:w-auto px-12 py-4 text-xs">
                                    비밀번호 변경
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="col-span-12 lg:col-span-4 space-y-8">

                    <div class="bg-primary-container p-8 shadow-sm">
                        <h3 class="font-headline text-lg font-black uppercase tracking-tight text-on-primary-container mb-4">비밀번호 설정 기준</h3>
                        <ul class="space-y-4 text-sm font-medium text-on-primary-container">
                            <li class="flex items-start gap-3">
                                <span class="material-symbols-outlined text-sm mt-0.5">check_circle</span>
                                <span>최소 12자 이상의 길이</span>
                            </li>
                            <li class="flex items-start gap-3">
                                <span class="material-symbols-outlined text-sm mt-0.5">check_circle</span>
                                <span>대문자와 소문자 조합 필수</span>
                            </li>
                            <li class="flex items-start gap-3">
                                <span class="material-symbols-outlined text-sm mt-0.5">check_circle</span>
                                <span>최소 하나 이상의 숫자(0-9) 포함</span>
                            </li>
                        </ul>
                    </div>

                    <div class="bg-surface-container-low p-8 relative overflow-hidden border border-outline-variant/30">
                        <div class="relative z-10">
                            <h3 class="font-headline text-lg font-black uppercase tracking-tight text-on-surface mb-4">보안 유의사항</h3>
                            <p class="text-sm text-secondary leading-relaxed">
                                비밀번호를 변경한 후에는 계정의 무결성을 보호하기 위해 현재 접속 중인 다른 모든 기기에서 자동으로 로그아웃됩니다.
                            </p>
                        </div>
                        <span class="material-symbols-outlined absolute -right-4 -bottom-4 text-9xl text-surface-container-highest opacity-20 select-none">shield</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</th:block>

</html>
