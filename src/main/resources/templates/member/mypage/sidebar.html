<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="sidebar" class="hidden md:block w-64 border-r border-outline-variant py-4 pr-4 bg-stone-50">
    <div class="px-10 pt-32 mb-12">
        <h3 class="font-headline text-lg font-extrabold tracking-tighter text-stone-900">Mypage</h3>
        <p class="text-[10px] font-semibold text-primary uppercase tracking-widest">mypage</p>
    </div>

    <nav class="flex flex-col gap-1 mt-6">

        <div class="flex flex-col">
            <button class="py-3 px-4 text-sm font-bold text-on-background flex items-center justify-between group">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined !text-lg">domain</span>
                    <span>개인정보 관리</span>
                </div>
                <span class="material-symbols-outlined text-xs transition-transform group-focus:rotate-180">expand_more</span>
            </button>
            <div class="flex flex-col bg-stone-100/50">
                <a href="/member/profile" class="py-2 pl-11 pr-4 text-[13px] text-secondary hover:text-primary transition-colors">기본 정보 수정</a>
                <a href="/member/password" class="py-2 pl-11 pr-4 text-[13px] text-secondary hover:text-primary transition-colors">비밀번호 변경</a>
                <a href="/member/sns" class="py-2 pl-11 pr-4 text-[13px] text-secondary hover:text-primary transition-colors border-l-2 border-primary bg-white font-semibold">SNS 연동 관리</a>
            </div>
        </div>

        <a href="/inquiry/list" class="py-3 px-4 text-sm font-medium text-secondary opacity-70 hover:opacity-100 transition-all flex items-center gap-3">
            <span class="material-symbols-outlined !text-lg">description</span>
            나의 문의
        </a>

        <div class="flex flex-col">
            <button class="py-3 px-4 text-sm font-medium text-secondary opacity-70 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined !text-lg">inventory_2</span>
                    <span>상품 관리</span>
                </div>
                <span class="material-symbols-outlined text-xs">expand_more</span>
            </button>
            <div class="flex flex-col">
                <a href="/product/request" class="py-2 pl-11 pr-4 text-[13px] text-secondary hover:text-primary">상품 요청 내역</a>
                <a href="/product/wishlist" class="py-2 pl-11 pr-4 text-[13px] text-secondary hover:text-primary">My 위시리스트</a>
            </div>
        </div>

        <div class="flex flex-col">
            <button class="py-3 px-4 text-sm font-medium text-secondary opacity-70 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined !text-lg">payments</span>
                    <span>거래 관리</span>
                </div>
                <span class="material-symbols-outlined text-xs">expand_more</span>
            </button>
            <div class="flex flex-col">
                <a href="/estimate/list" class="py-2 pl-11 pr-4 text-[13px] text-secondary hover:text-primary">내 견적 관리</a>
                <a href="/order/list" class="py-2 pl-11 pr-4 text-[13px] text-secondary hover:text-primary">내 주문 조회</a>
            </div>
        </div>
    </nav>
</th:block>
</html>
