<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('ACCOUNT', 'Profile Settings', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | 정보 수정</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{member/mypage/mypage-sidebar :: sidebar('member', 'modify')}"></div>
</th:block>

<th:block th:fragment="content">
    <script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script th:if="${kakaoAppKey != null and !kakaoAppKey.isEmpty()}" type="text/javascript"
            th:src="${'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + kakaoAppKey + '&libraries=services&autoload=false'}"></script>

    <main class="mypage-edit-profile-page bg-background">
        <div class="max-w-5xl mx-auto">
            <section class="pt-10 mb-12 flex flex-col md:flex-row justify-between items-end gap-8">
                <div class="max-w-2xl">
                    <span class="text-primary font-black tracking-widest text-xs uppercase mb-2 block">ACCOUNT OVERVIEW</span>
                    <h1 class="font-headline text-3xl md:text-5xl font-extrabold tracking-tighter text-on-surface mb-4 uppercase leading-none">
                        Profile Summary
                    </h1>
                    <p class="font-body text-secondary max-w-sm text-lg opacity-80">
                        회원님의 비즈니스 프로필과 계정 요약 정보를 관리하십시오.
                    </p>
                </div>
            </section>

            <div class="mypage-edit-profile-page__layout grid grid-cols-12 gap-12">
                <div class="col-span-12 lg:col-span-8">
                    <div class="bg-surface-container-lowest p-10 border-l-[6px] border-primary shadow-chat-shell">
                        <div class="mypage-edit-profile-page__notice mb-8">
                            <p>
                                연락처 및 배송지 정보를 최신 상태로 유지해 주세요. <br>
                                휴대폰 번호 변경 시 **본인 인증** 절차가 반드시 필요합니다.
                            </p>
                        </div>

                        <form th:action="@{/mypage/modify}" th:object="${member}" method="POST" class="space-y-8">
                            <input type="hidden" name="ci" th:value="${member?.memCi}" />
                            <input type="hidden" id="imp_uid" name="impUid" />
                            <input type="hidden" id="phoneCheckedInput" name="phoneChecked" value="false" />

                            <div class="space-y-3">
                                <label class="block text-xs font-bold uppercase tracking-[0.2em] text-secondary">이메일 주소</label>
                                <input type="email"
                                       th:field="*{memEml}"
                                       name="email"
                                       class="bd-input bg-surface-container-low focus:ring-1 focus:ring-primary transition-all"
                                       placeholder="example@beedan.com"
                                       required />
                            </div>

                            <div class="space-y-3">
                                <label class="block text-xs font-bold uppercase tracking-[0.2em] text-secondary">휴대폰 번호</label>
                                <div class="flex gap-3">
                                    <input type="text"
                                           th:value="*{memMbPhn}"
                                           name="phone"
                                           class="bd-input bg-surface-container-low focus:ring-1 focus:ring-primary transition-all flex-1"
                                           readonly />
                                    <button type="button"
                                            id="certify_phone"
                                            class="btn-secondary whitespace-nowrap px-6 py-2 text-xs border border-outline">
                                        본인 인증
                                    </button>
                                </div>
                                <p id="phoneAvailable" class="hidden text-[11px] text-primary font-bold">* 인증이 완료되었습니다.</p>
                                <p class="text-[11px] text-secondary/70 italic">* 번호 변경 시 인증 버튼을 눌러주세요.</p>
                            </div>

                            <div class="space-y-3 pt-4">
                                <label class="block text-xs font-bold uppercase tracking-[0.2em] text-secondary">회사 주소 (배송지)</label>

                                <div class="flex gap-3">
                                    <input type="text"
                                           th:value="*{memPosCd}"
                                           id="postcode"
                                           name="postCode"
                                           class="bd-input bg-surface-container-low flex-1"
                                           placeholder="우편번호" readonly>
                                    <button type="button"
                                            id="searchPostCode"
                                            class="btn-secondary whitespace-nowrap px-6 py-2 text-xs border border-outline">
                                        주소 검색
                                    </button>
                                </div>

                                <input type="text"
                                       th:value="*{memBizAdr}"
                                       id="baseAddress"
                                       name="address"
                                       class="bd-input bg-surface-container-low"
                                       placeholder="기본 주소" readonly>

                                <div class="space-y-2">
                                    <label class="block text-[10px] font-bold text-secondary/60 uppercase">상세 주소</label>
                                    <input type="text"
                                           th:value="*{memBizDtAdr}"
                                           id="detailAddress"
                                           name="addressDetail"
                                           class="bd-input bg-surface-container-low focus:ring-1 focus:ring-primary transition-all"
                                           placeholder="상세 주소를 입력하세요">
                                </div>
                            </div>

                            <div class="pt-4 flex gap-4">
                                <button type="submit" class="btn-primary w-full md:w-auto px-12 py-4 text-xs">
                                    정보 저장하기
                                </button>
                                <a th:href="@{/mypage/detail}" class="btn-ghost w-full md:w-auto px-8 py-4 text-xs text-center border border-outline-variant">
                                    취소
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="col-span-12 lg:col-span-4">
                    <div class="mypage-edit-profile-page__sidebar-stack">
                        <div class="bg-primary-container p-8 shadow-sm">
                            <h3 class="font-headline text-lg font-black uppercase tracking-tight text-on-primary-container mb-4">개인정보 보호</h3>
                            <ul class="space-y-4 text-sm font-medium text-on-primary-container">
                                <li class="flex items-start gap-3">
                                    <span class="material-symbols-outlined text-sm mt-0.5">verified_user</span>
                                    <span>인증 정보는 암호화되어 안전하게 보관됩니다.</span>
                                </li>
                                <li class="flex items-start gap-3">
                                    <span class="material-symbols-outlined text-sm mt-0.5">location_on</span>
                                    <span>정확한 주소는 원활한 배송 서비스를 위해 필요합니다.</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script th:if="${kakaoAppKey != null and !kakaoAppKey.isEmpty()}"
            type="text/javascript"
            th:src="${'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + kakaoAppKey + '&libraries=services&autoload=false'}"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // [중요] kakao 객체 존재 여부 체크
            if (typeof kakao === 'undefined' || typeof kakao.maps === 'undefined') {
                console.error("카카오 맵 SDK가 로드되지 않았습니다. API 키를 확인하세요.");
                return; // SDK가 없으면 아래 코드를 실행하지 않음 (에러 방지)
            }

            var map, geocoder;

            // 2. 카카오 맵 초기화
            kakao.maps.load(function() {
                var mapContainer = document.getElementById('map');
                if (!mapContainer) return;

                var mapOption = {
                    center: new kakao.maps.LatLng(37.566826, 126.978656),
                    level: 3
                };

                map = new kakao.maps.Map(mapContainer, mapOption);
                geocoder = new kakao.maps.services.Geocoder();

                // 초기 주소가 있다면 지도 표시
                const initialAddr = document.getElementById('baseAddress')?.value;
                if (initialAddr) updateMap(initialAddr);
            });

            // 3. 우편번호 서비스 (oncomplete 내부에서 updateMap 호출)
            const searchPostCodeBtn = document.getElementById("searchPostCode");
            if (searchPostCodeBtn) {
                searchPostCodeBtn.addEventListener('click', function() {
                    new daum.Postcode({
                        oncomplete: function(data) {
                            let addr = (data.userSelectedType === 'R') ? data.roadAddress : data.jibunAddress;

                            document.getElementById('postcode').value = data.zonecode;
                            document.getElementById("baseAddress").value = addr;
                            document.getElementById("detailAddress").focus();
                        }
                    }).open();
                });
            }
        });
    </script>
</th:block>

</html>
