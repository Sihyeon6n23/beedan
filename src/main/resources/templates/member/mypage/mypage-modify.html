<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('ACCOUNT', 'Profile Settings', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | 정보 수정</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{member/mypage/mypage-sidebar :: sidebar('member', 'modify')}"></div>
</th:block>

<th:block th:fragment="content">
    <main class="mypage-edit-profile-page bg-background">
        <div class="max-w-5xl mx-auto">

            <section class="mypage-edit-profile-page__intro">
                <span class="mypage-edit-profile-page__kicker">ACCOUNT EDIT</span>
                <h1 class="mypage-edit-profile-page__title">프로필 수정</h1>
                <div class="mypage-edit-profile-page__rule">
                    <span></span>
                </div>
            </section>

            <div class="mypage-edit-profile-page__layout grid grid-cols-12 gap-12 pb-20">

                <div class="col-span-12 lg:col-span-8">
                    <div class="bg-surface-container-lowest p-10 border-l-[6px] border-primary shadow-chat-shell">

                        <div class="mypage-edit-profile-page__notice mb-8">
                            <p>
                                연락처 및 배송지 정보를 최신 상태로 유지해 주세요. <br>
                                휴대폰 번호 변경 시 <span class="font-bold text-on-surface">본인 인증</span> 절차가 반드시 필요합니다.
                            </p>
                        </div>

                        <form th:action="@{/mypage/modify}" id="modifyForm" th:object="${member}" method="POST" class="space-y-8">
                            <input type="hidden" th:field="*{memCi}" />
                            <input type="hidden" id="imp_uid" name="impUid" />
                            <input type="hidden" id="phoneCheckedInput" name="phoneChecked" value="false" />

                            <div class="space-y-3">
                                <label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-secondary">이메일 주소</label>
                                <div class="flex gap-3">
                                    <input type="email"
                                           th:field="*{memEml}"
                                           class="bd-input bg-surface-container-low focus:ring-1 focus:ring-primary transition-all"
                                           placeholder="example@beedan.com"
                                           required />
                                    <button type="button"
                                            id="duplicate_email"
                                            class="btn-secondary whitespace-nowrap px-6 py-2 text-xs border border-outline-variant hover:bg-surface-container-highest transition-colors">
                                        중복 확인
                                    </button>
                                </div>
                                <p id="emailAvailable" class="hidden text-[11px] text-primary font-bold">* 사용가능한 이메일입니다.</p>
                                <p class="text-[11px] text-secondary/70 italic">* 이메일 변경시 중복확인을 눌러주세요.</p>
                            </div>

                            <div class="space-y-3">
                                <label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-secondary">휴대폰 번호</label>
                                <div class="flex gap-3">
                                    <input type="text"
                                           th:value="*{memMbPhn}"
                                           name="phone"
                                           class="bd-input bg-surface-container-low focus:ring-1 focus:ring-primary transition-all flex-1"
                                           readonly />
                                    <button type="button"
                                            id="certify_phone"
                                            class="btn-secondary whitespace-nowrap px-6 py-2 text-xs border border-outline-variant hover:bg-surface-container-highest transition-colors">
                                        본인 인증
                                    </button>
                                </div>
                                <p id="phoneAvailable" class="hidden text-[11px] text-primary font-bold">* 인증이 완료되었습니다.</p>
                                <p class="text-[11px] text-secondary/70 italic">* 번호 변경 시 인증 버튼을 눌러주세요.</p>
                            </div>

                            <div class="space-y-3 pt-4 border-t border-outline-variant/30">
                                <label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-secondary mt-4">회사 주소 (배송지)</label>

                                <div class="flex gap-3">
                                    <input type="text"
                                           th:value="*{memPosCd}"
                                           id="postcode"
                                           name="postCode"
                                           class="bd-input bg-surface-container-low flex-1"
                                           placeholder="우편번호" readonly>
                                    <button type="button"
                                            id="searchPostCode"
                                            class="btn-secondary whitespace-nowrap px-6 py-2 text-xs border border-outline-variant hover:bg-surface-container-highest transition-colors">
                                        주소 검색
                                    </button>
                                </div>

                                <input type="text"
                                       th:value="*{memBizAdr}"
                                       id="baseAddress"
                                       name="address"
                                       class="bd-input bg-surface-container-low mt-2"
                                       placeholder="기본 주소" readonly>

                                <div class="space-y-2 mt-2">
                                    <label class="block text-[10px] font-bold text-secondary/60 uppercase">상세 주소</label>
                                    <input type="text"
                                           th:value="*{memBizDtAdr}"
                                           id="detailAddress"
                                           name="addressDetail"
                                           class="bd-input bg-surface-container-low focus:ring-1 focus:ring-primary transition-all"
                                           placeholder="상세 주소를 입력하세요">
                                </div>
                            </div>

                            <div class="pt-8 flex flex-col sm:flex-row gap-4">
                                <button type="button" id="save" class="btn-primary w-full sm:w-auto px-12 py-4 text-xs">
                                    정보 저장하기
                                </button>
                                <a th:href="@{/mypage/detail}" class="btn-ghost w-full sm:w-auto px-8 py-4 text-xs text-center border border-outline-variant hover:bg-surface-container-high transition-colors">
                                    취소
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="col-span-12 lg:col-span-4">
                    <div class="mypage-edit-profile-page__sidebar-stack space-y-6">
                        <div class="bg-primary-container p-8 shadow-sm">
                            <h3 class="font-headline text-lg font-black uppercase tracking-tight text-on-primary-container mb-4">개인정보 보호</h3>
                            <ul class="space-y-4 text-sm font-medium text-on-primary-container">
                                <li class="flex items-start gap-3">
                                    <span class="material-symbols-outlined text-sm mt-0.5">verified_user</span>
                                    <span>인증 정보는 암호화되어 안전하게 보관됩니다.</span>
                                </li>
                                <li class="flex items-start gap-3">
                                    <span class="material-symbols-outlined text-sm mt-0.5">location_on</span>
                                    <span>정확한 주소는 원활한 배송 서비스를 위해 필요합니다.</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/modal/guidemodal :: guideModal}"></div>

    <script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
    <script th:src="@{/js/auth/phone-certification.js}"></script>

    <script th:if="${kakaoAppKey != null and !kakaoAppKey.isEmpty()}"
            type="text/javascript"
            th:src="${'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + kakaoAppKey + '&libraries=services&autoload=false'}"></script>

    <script inline="javascript">
        document.addEventListener("DOMContentLoaded", function() {
            // [1] 본인 인증 로직
            const certifyPhoneBtn = document.getElementById("certify_phone");
            const phoneAvailable = document.getElementById("phoneAvailable");
            const phoneCheckedInput = document.getElementById("phoneCheckedInput");

            if (certifyPhoneBtn) {
                certifyPhoneBtn.addEventListener('click', async () => {
                    const response = await PortOne.requestIdentityVerification({
                        storeId: "store-6e274706-e18d-4cc0-95b4-f9da97355da2",
                        identityVerificationId: `identity-verification-${crypto.randomUUID()}`,
                        channelKey: "channel-key-fe0517f7-44f1-4916-b471-2a71918fe5e3"
                    });

                    // 오류 수정: return이 발생하면 아래 코드가 실행되지 않으므로 분기 처리
                    if (response.code != null) {
                        alert(response.message);
                        return;
                    }

                    // 성공 시 로직
                    document.getElementById("imp_uid").value = response.identityVerificationId;
                    phoneAvailable.classList.remove("hidden");
                    certifyPhoneBtn.disabled = true;
                    certifyPhoneBtn.classList.add("opacity-50", "cursor-not-allowed");
                    phoneCheckedInput.value = "true";
                });
            }

            // [2] 주소 검색 로직 (다음 우편번호 API)
            const searchPostCodeBtn = document.getElementById("searchPostCode");
            if (searchPostCodeBtn) {
                searchPostCodeBtn.addEventListener('click', function() {
                    new daum.Postcode({
                        oncomplete: function(data) {
                            let addr = (data.userSelectedType === 'R') ? data.roadAddress : data.jibunAddress;
                            document.getElementById('postcode').value = data.zonecode;
                            document.getElementById("baseAddress").value = addr;
                            document.getElementById("detailAddress").focus();
                        }
                    }).open();
                });
            }

            // [3] 이메일 중복 확인 로직 (최적화 버전)
            const duplicateEmailBtn = document.getElementById("duplicate_email");
            // Thymeleaf th:field는 보통 id와 name을 필드명(memEml)으로 변경하므로 둘 다 대응
            const emailInput = document.getElementById("memEml");
            const emailAvailableMsg = document.getElementById("emailAvailable");

            if (duplicateEmailBtn && emailInput) {
                duplicateEmailBtn.addEventListener('click', async () => {
                    const emailValue = emailInput.value.trim();

                    // 1. 프론트엔드 검증
                    if (!emailValue) {
                        showGuideModal("이메일 주소를 입력해주세요.", () => { emailInput.focus(); }, "WARNING", "warning");
                        return;
                    }

                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(emailValue)) {
                        showGuideModal("유효한 이메일 형식이 아닙니다.", () => { emailInput.focus(); }, "WARNING", "error");
                        return;
                    }

                    try {
                        // 2. CSRF 토큰 동적 추출 (Spring Security 대응)
                        const csrfToken = document.querySelector('input[name="_csrf"]')?.value;

                        // 3. 서버로 POST 요청 (URLSearchParams 사용하여 일반 폼 데이터 형식으로 전송)
                        const params = new URLSearchParams();
                        params.append('email', emailValue);

                        const response = await axios.post('/api/auth/emailChecked', {
                            email: emailValue
                        }, {
                            headers: {
                                'X-CSRF-TOKEN': csrfToken,
                                'Content-Type': 'application/json' // JSON 형식 명시 (axios 기본값이기도 함)
                            }
                        });

                        // 4. 결과 처리
                        // 서버 응답이 정확히 true/false로 오는지 확인 필요 (response.data)
                        console.log(response.data)
                        if (response.data === true) {
                            emailAvailableMsg.classList.remove("hidden");
                            emailInput.readOnly = true;
                            showGuideModal("사용 가능한 이메일입니다.", null, "SUCCESS", "check_circle");
                        } else {
                            emailAvailableMsg.classList.add("hidden");
                            showGuideModal("이미 사용 중이거나 유효하지 않은 이메일입니다.", () => {
                                emailInput.focus();
                            }, "UNAVAILABLE", "cancel");
                        }
                    } catch (error) {
                        console.error("Email check error:", error);
                        const status = error.response?.status;
                        let errorMsg = "중복 확인 중 서버 오류가 발생했습니다.";

                        if (status === 403) errorMsg = "접근 권한이 없습니다. (CSRF 토큰 오류)";
                        else if (status === 404) errorMsg = "요청 경로를 찾을 수 없습니다.";

                        showGuideModal(errorMsg, null, "ERROR", "error");
                    }
                });

                // 5. 입력값 변경 시 상태 초기화
                emailInput.addEventListener('input', () => {
                    emailAvailableMsg.classList.add("hidden");
                });
            }


        });

        const originalEmail = document.getElementById('memEml').value;
        const saveButton = document.getElementById('save');
        const emailInput = document.getElementById("memEml");
        const myForm = document.getElementById('modifyForm');

        // 클릭 이벤트 리스너 등록
        saveButton.addEventListener('click', () => {
            // emailInput이 readonly가 아닌 상태(즉, 중복 확인 전)라면
            if (!emailInput.readOnly && originalEmail !== emailInput.value) {
                // 커스텀 모달 함수 실행
                showGuideModal(
                    "이메일 중복확인을 완료해주세요.",
                    () => {
                        emailInput.focus();
                    },
                    "WARNING",
                    "warning"
                );
            } else {
                showGuideModal(
                    "정보 저장이 완료되었습니다.",
                    () => {
                        // 사용자가 모달의 확인 버튼을 누르면 그때 폼을 전송합니다.
                        myForm.submit();
                    },
                    "SUCCESS", // 타이틀 (상황에 맞게 수정)
                    "check_circle"  // 아이콘 타입 (보통 성공은 초록색 체크 아이콘)
                );
            }
        });

    </script>
</th:block>

</html>
