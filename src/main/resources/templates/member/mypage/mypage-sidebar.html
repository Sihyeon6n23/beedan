<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="sidebar(activeMain, activeSub)">
    <div class="sidebar-scope">
        <a th:href="@{/admin/member/list}"
           class="sidebar-menu__link"
           th:classappend="${activeMain == 'member'} ? ' sidebar-menu__link--current' : ''">
            <span class="material-symbols-outlined sidebar-menu__icon">group</span>
            <span>개인정보 관리</span>
        </a>

        <div class="sidebar-menu__group">
            <div class="sidebar-menu__link"
                 th:classappend="${activeMain == 'stock'} ? ' sidebar-menu__link--current' : ''">
                <span class="material-symbols-outlined sidebar-menu__icon">inventory_2</span>
                <span>상품 요청</span>
            </div>

            <div class="sidebar-menu__child-wrap">
                <a th:href="@{/admin/stock/list}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'stock-my'} ? ' sidebar-menu__child-link--current' : ''">
                    내 상품
                </a>
                <a th:href="@{/admin/newstock}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'stock-require'} ? ' sidebar-menu__child-link--current' : ''">
                    상품 요청
                </a>
            </div>
        </div>

        <div class="sidebar-menu__group">
            <div class="sidebar-menu__link"
                 th:classappend="${activeMain == 'quote'} ? ' sidebar-menu__link--current' : ''">
                <span class="material-symbols-outlined sidebar-menu__icon">request_quote</span>
                <span>내 상품</span>
            </div>

            <div class="sidebar-menu__child-wrap">
                <a th:href="@{/admin/quote/list}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'quote-list'} ? ' sidebar-menu__child-link--current' : ''">
                    견적 목록
                </a>
                <a th:href="@{/admin/quote/write}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'quote-write'} ? ' sidebar-menu__child-link--current' : ''">
                    새 견적 작성
                </a>
            </div>
        </div>

        <div class="sidebar-menu__group">
            <div class="sidebar-menu__link"
                 th:classappend="${activeMain == 'inquiry'} ? ' sidebar-menu__link--current' : ''">
                <span class="material-symbols-outlined sidebar-menu__icon">support_agent</span>
                <span>내 견적관리</span>
            </div>

            <div class="sidebar-menu__child-wrap">
                <a th:href="@{/admin/inquiry/list}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'inquiry-list'} ? ' sidebar-menu__child-link--current' : ''">
                    문의 목록
                </a>
                <a th:href="@{/admin/chat/list}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'chat-list'} ? ' sidebar-menu__child-link--current' : ''">
                    채팅 관리
                </a>
            </div>
        </div>

        <div class="sidebar-menu__group">
            <div class="sidebar-menu__link"
                 th:classappend="${activeMain == 'inquiry'} ? ' sidebar-menu__link--current' : ''">
                <span class="material-symbols-outlined sidebar-menu__icon">support_agent</span>
                <span>내 주문조회</span>
            </div>

            <div class="sidebar-menu__child-wrap">
                <a th:href="@{/admin/inquiry/list}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'inquiry-list'} ? ' sidebar-menu__child-link--current' : ''">
                    문의 목록
                </a>
                <a th:href="@{/admin/chat/list}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'chat-list'} ? ' sidebar-menu__child-link--current' : ''">
                    채팅 관리
                </a>
            </div>
        </div>
    </div>
</th:block>
</html>
