<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="sidebar(activeMain, activeSub)">
    <div class="sidebar-scope">
        <div class="sidebar-menu__group"
             th:classappend="${activeMain == 'member'} ? ' sidebar-menu__group--open' : ''">
            <button type="button"
                    class="sidebar-menu__link sidebar-menu__toggle"
                    th:classappend="${activeMain == 'member'} ? ' sidebar-menu__link--current' : ''"
                    th:attr="aria-expanded=${activeMain == 'member'} ? 'true' : 'false'">
                <span class="material-symbols-outlined sidebar-menu__icon">person</span>
                <span>개인정보 관리</span>
                <span class="material-symbols-outlined sidebar-menu__chevron">expand_more</span>
            </button>

            <div class="sidebar-menu__child-wrap">
                <a th:href="@{/mypage/detail}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'detail'} ? ' sidebar-menu__child-link--current' : ''">
                    상세보기
                </a>
                <a th:href="@{/mypage/modify}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'modify'} ? ' sidebar-menu__child-link--current' : ''">
                    정보 변경
                </a>
                <a th:href="@{/mypage/changepw}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'changepw'} ? ' sidebar-menu__child-link--current' : ''">
                    비밀번호 변경
                </a>
                <a th:href="@{/mypage/sns}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'sns'} ? ' sidebar-menu__child-link--current' : ''">
                    SNS 로그인 연동
                </a>
                <a th:href="@{/mypage/detail}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'withdrawal'} ? ' sidebar-menu__child-link--current' : ''">
                    회원 탈퇴
                </a>
            </div>
        </div>

        <a th:href="@{/inquiry/list}"
           class="sidebar-menu__link"
           th:classappend="${activeMain == 'inquiry'} ? ' sidebar-menu__link--current' : ''">
            <span class="material-symbols-outlined sidebar-menu__icon">support_agent</span>
            <span>문의 관리</span>
        </a>

        <div class="sidebar-menu__group"
             th:classappend="${activeMain == 'stock'} ? ' sidebar-menu__group--open' : ''">
            <button type="button"
                    class="sidebar-menu__link sidebar-menu__toggle"
                    th:classappend="${activeMain == 'stock'} ? ' sidebar-menu__link--current' : ''"
                    th:attr="aria-expanded=${activeMain == 'stock'} ? 'true' : 'false'">
                <span class="material-symbols-outlined sidebar-menu__icon">inventory_2</span>
                <span>상품 요청</span>
                <span class="material-symbols-outlined sidebar-menu__chevron">expand_more</span>
            </button>

            <div class="sidebar-menu__child-wrap">
                <a th:href="@{/admin/stock/list}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'stock-my'} ? ' sidebar-menu__child-link--current' : ''">
                    내 상품
                </a>
                <a th:href="@{/admin/newstock}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'stock-require'} ? ' sidebar-menu__child-link--current' : ''">
                    상품 요청
                </a>
            </div>
        </div>

        <div class="sidebar-menu__group"
             th:classappend="${activeMain == 'quote'} ? ' sidebar-menu__group--open' : ''">
            <button type="button"
                    class="sidebar-menu__link sidebar-menu__toggle"
                    th:classappend="${activeMain == 'quote'} ? ' sidebar-menu__link--current' : ''"
                    th:attr="aria-expanded=${activeMain == 'quote'} ? 'true' : 'false'">
                <span class="material-symbols-outlined sidebar-menu__icon">request_quote</span>
                <span>내 상품</span>
                <span class="material-symbols-outlined sidebar-menu__chevron">expand_more</span>
            </button>

            <div class="sidebar-menu__child-wrap">
                <a th:href="@{/quote/negotiation/list}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'negotiation-list'} ? ' sidebar-menu__child-link--current' : ''">
                    협상 목록
                </a>
                <a th:href="@{/quote/list}"
                   class="sidebar-menu__child-link"
                   th:classappend="${activeSub == 'quote-list'} ? ' sidebar-menu__child-link--current' : ''">
                    견적 목록
                </a>
            </div>
        </div>

    </div>
</th:block>
</html>
