<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<div layout:fragment="content">

  <section class="container-fluid bg-light min-vh-100" style="padding-top: 100px; padding-bottom: 100px;">
    <div class="row px-md-5">

      <aside class="col-md-3 col-lg-2 d-none d-md-block border-end py-4">
        <div class="px-3 mb-5">
          <h3 class="font-headline fw-black h5 mb-1">Registration</h3>
          <p class="text-primary small fw-bold text-uppercase tracking-widest" style="font-size: 0.65rem;">Step 2 of 4</p>
        </div>
        <div class="list-group list-group-flush">
          <a href="#" class="list-group-item list-group-item-action sidebar-link opacity-50 py-3 border-0">
            Company Profile
          </a>
          <a href="#" class="list-group-item list-group-item-action sidebar-link active py-3">
            Documents
          </a>
          <a href="#" class="list-group-item list-group-item-action sidebar-link py-3 border-0">
            Team
          </a>
          <a href="#" class="list-group-item list-group-item-action sidebar-link py-3 border-0">
            Settings
          </a>
        </div>
      </aside>

      <main class="col-md-9 col-lg-10 px-md-5">
        <div class="row justify-content-center">
          <div class="col-12 col-xl-8">

            <header class="mb-5 text-center text-md-start">
              <p class="text-uppercase text-primary small fw-bold tracking-widest mb-2">Member Onboarding</p>
              <h1 class="font-headline display-4 fw-black tracking-tighter lh-1 text-uppercase">
                Business<br>Registration
              </h1>
            </header>

            <div class="card border-0 sharp-shadow p-4 p-md-5 bg-white">
              <form th:action="@{/business/register}" method="POST">

                <section id="account-info" class="mb-5">
                  <div class="d-flex align-items-center gap-3 mb-4">
                    <span class="step-number">01</span>
                    <h2 class="h6 text-uppercase fw-black tracking-widest mb-0">Account Info</h2>
                  </div>

                  <div class="mb-4">
                    <label class="form-label small fw-bold text-muted text-uppercase">User ID *</label>
                    <div class="input-group">
                      <input type="text" name="username" class="form-control" placeholder="Preferred Username" required>
                      <button class="btn btn-dark fw-bold px-4" type="button" style="font-size: 0.75rem;">CHECK</button>
                    </div>
                  </div>

                  <div class="mb-4">
                    <label class="form-label small fw-bold text-muted text-uppercase">Corporate Email *</label>
                    <input type="email" name="email" class="form-control" placeholder="name@company.jp" required>
                  </div>

                  <div class="row g-4">
                    <div class="col-md-6">
                      <label class="form-label small fw-bold text-muted text-uppercase">Password *</label>
                      <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label small fw-bold text-muted text-uppercase">Confirm *</label>
                      <input type="password" name="confirm" class="form-control" required>
                    </div>
                  </div>
                </section>

                <hr class="my-5 opacity-25">

                <section id="business-verification" class="mb-5">
                  <div class="d-flex align-items-center gap-3 mb-4">
                    <span class="step-number">02</span>
                    <h2 class="h6 text-uppercase fw-black tracking-widest mb-0">Business Verification</h2>
                  </div>

                  <div class="mb-4">
                    <label class="form-label small fw-bold text-muted text-uppercase">Registration Number *</label>
                    <div class="input-group mb-2">
                      <input type="text" name="bizRegNum" class="form-control" placeholder="13-digit Corporate Number" required>
                      <button class="btn btn-beedan-primary px-4" type="button">VERIFY BUSINESS</button>
                    </div>
                    <div class="d-flex align-items-center gap-1 text-primary small fw-bold">
                      <span class="material-symbols-outlined fs-6">verified</span>
                      <span style="font-size: 0.7rem;">Verification Successful: Tokyo Tax Office Record Found</span>
                    </div>
                  </div>

                  <div class="mb-4">
                    <label class="form-label small fw-bold text-muted text-uppercase">Company Name</label>
                    <input type="text" class="form-control fw-bold text-muted" value="GINZA ARCHITECTURAL ATELIER CO., LTD." readonly style="background-color: #f3f3f3;">
                  </div>

                  <div class="row g-4">
                    <div class="col-md-6">
                      <label class="form-label small fw-bold text-muted text-uppercase">CEO Name</label>
                      <input type="text" name="ceoName" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label small fw-bold text-muted text-uppercase">Establishment Date</label>
                      <input type="month" name="estDate" class="form-control" required>
                    </div>
                  </div>
                </section>

                <div class="pt-5 border-top">
                  <button type="submit" class="btn btn-beedan-primary w-100 py-3 fs-6 fw-black mb-3">Join Now</button>
                  <button type="button" class="btn btn-link w-100 text-muted small text-decoration-none fw-bold text-uppercase tracking-widest">Cancel Registration</button>
                </div>
              </form>
            </div>

            <p class="mt-4 text-center text-muted small text-uppercase tracking-widest" style="font-size: 0.65rem;">
              Having trouble? <a href="#" class="text-primary fw-bold text-decoration-none border-bottom border-primary">Contact Curator Support</a>
            </p>

          </div>
        </div>
      </main>
    </div>
  </section>
</div>
</html>
