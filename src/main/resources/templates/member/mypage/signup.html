<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::sidebar}, ~{::content})}">

<title th:fragment="title">BEEDAN | MyPage</title>

<div th:fragment="sidebar">
  <div th:replace="~{member/mypage/sidebar :: sidebar}"></div>
</div>

<th:block th:fragment="content">
  <section class="bg-surface-container-low min-h-screen pt-8 pb-24 px-6 md:px-12 w-full">

    <div class="w-full max-w-4xl">

      <header class="mb-12 text-left">
        <p class="text-primary text-xs font-bold tracking-[0.2em] uppercase mb-3">Member Onboarding</p>
        <h1 class="font-headline text-5xl md:text-6xl font-black tracking-tighter leading-none uppercase">
          Business<br/>Registration
        </h1>
      </header>

      <div class="bg-white p-8 md:p-12 shadow-[0_20px_40px_rgba(0,0,0,0.05)] border-none w-full">
        <form th:action="@{/business/register}" method="POST" class="space-y-12">

          <section id="account-info">
            <div class="flex items-center gap-4 mb-8">
              <span class="text-2xl font-black text-outline-variant italic">01</span>
              <h2 class="text-sm font-black uppercase tracking-widest">Account Info</h2>
            </div>
            <div class="space-y-6">
              <div>
                <label class="block text-[10px] font-bold text-secondary uppercase mb-2">User ID *</label>
                <div class="flex">
                  <input type="text" name="username" class="bd-input flex-grow" placeholder="Preferred Username" required>
                  <button class="bg-on-background text-white px-6 text-xs font-bold uppercase" type="button">CHECK</button>
                </div>
              </div>
              <div>
                <label class="block text-[10px] font-bold text-secondary uppercase mb-2">Corporate Email *</label>
                <input type="email" name="email" class="bd-input" placeholder="name@company.jp" required>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label class="block text-[10px] font-bold text-secondary uppercase mb-2">Password *</label>
                  <input type="password" name="password" class="bd-input" required>
                </div>
                <div>
                  <label class="block text-[10px] font-bold text-secondary uppercase mb-2">Confirm *</label>
                  <input type="password" name="confirm" class="bd-input" required>
                </div>
              </div>
            </div>
          </section>

          <hr class="border-outline-variant opacity-30">

          <section id="business-verification">
            <div class="flex items-center gap-4 mb-8">
              <span class="text-2xl font-black text-outline-variant italic">02</span>
              <h2 class="text-sm font-black uppercase tracking-widest">Business Verification</h2>
            </div>
            <div class="space-y-6">
              <div>
                <label class="block text-[10px] font-bold text-secondary uppercase mb-2">Registration Number *</label>
                <div class="flex mb-2">
                  <input type="text" name="bizRegNum" class="bd-input flex-grow" placeholder="13-digit Number" required>
                  <button class="btn-primary px-6" type="button">VERIFY</button>
                </div>
                <p class="flex items-center gap-1 text-primary text-[10px] font-bold">
                  <span class="material-symbols-outlined !text-sm">verified</span> Successful: Tokyo Tax Office Record Found
                </p>
              </div>
              <div>
                <label class="block text-[10px] font-bold text-secondary uppercase mb-2">Company Name</label>
                <input type="text" class="bd-input bg-surface-container-low text-secondary font-bold" value="GINZA ARCHITECTURAL ATELIER CO., LTD." readonly>
              </div>
            </div>
          </section>

          <div class="pt-8 flex flex-col gap-4">
            <button type="submit" class="btn-primary w-full py-5 text-base">Join Now</button>
            <button type="button" class="text-[10px] font-bold text-secondary uppercase tracking-widest hover:text-on-background transition-colors">Cancel Registration</button>
          </div>
        </form>
      </div>

      <p class="mt-8 text-left text-[10px] text-secondary uppercase tracking-[0.2em]">
        Having trouble? <a href="#" class="text-primary font-bold border-b border-primary">Contact Curator Support</a>
      </p>

    </div>
  </section>
</th:block>
</html>
