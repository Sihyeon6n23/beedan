<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEEDAN | 비밀번호 재설정</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Manrope:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#705d00',
                        'primary-container': '#ffd700',
                        'on-primary-container': '#705e00',
                        background: '#f9f9f9',
                        'on-background': '#1a1c1c',
                        'on-surface': '#1a1c1c',
                        'surface-container-lowest': '#ffffff',
                        'surface-container-low': '#f3f3f3',
                        'surface-container-highest': '#e2e2e2',
                        secondary: '#5f5e5e',
                        error: '#ba1a1a',
                        'outline-variant': '#d0c6ab',
                    },
                    fontFamily: {
                        headline: ['Manrope', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'chat-shell': '0 10px 30px -10px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .bd-input {
                @apply w-full px-5 py-4 text-sm font-medium border border-outline-variant bg-surface-container-low
                focus:bg-white focus:ring-1 focus:ring-primary focus:border-primary outline-none
                transition-all duration-200 placeholder:text-outline-variant;
            }
            .btn-primary {
                @apply bg-primary-container text-on-primary-container font-black uppercase tracking-widest
                hover:bg-primary hover:text-white active:scale-[0.98] transition-all
                disabled:bg-outline-variant;
            }
        }
    </style>
</head>
<body class="bg-background font-body text-on-background flex items-center justify-center min-h-screen p-6">

<div class="w-full max-w-xl">
    <header class="mb-8">
        <span class="text-[10px] font-black uppercase tracking-[0.2em] text-primary">Security Recovery</span>
        <h1 class="font-headline text-4xl font-black tracking-tighter mt-2">비밀번호 재설정</h1>
        <div class="mt-4 w-full h-[2px] bg-surface-container-highest">
            <span class="block w-24 h-full bg-primary-container"></span>
        </div>
    </header>

    <div class="bg-surface-container-lowest p-10 border-l-[6px] border-primary shadow-chat-shell">
        <div class="mb-8 pb-4 border-l-4 border-primary-container bg-gradient-to-r from-primary-container/10 to-transparent p-4">
            <p class="text-sm text-secondary leading-relaxed">
                계정 보호를 위해 새로운 비밀번호를 설정해 주세요.<br>
                다른 사이트에서 사용하지 않는 고유한 비밀번호가 안전합니다.
            </p>
        </div>

        <form th:action="@{/auth/passwd/change}" th:object="${passwordResetDto}" method="POST" class="space-y-8">
            <input type="hidden" name="token_id" th:value="${tokenId}" />

            <div class="space-y-3">
                <label class="block text-xs font-bold uppercase tracking-[0.2em] text-secondary" for="new_password">New Password</label>
                <input type="password" id="new_password" th:field="*{password}" class="bd-input" placeholder="새로운 비밀번호를 입력하세요" required />
                <p id="password-error" class="text-xs text-error font-medium mt-1 hidden">비밀번호 형식이 올바르지 않습니다.</p>
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-xs text-error font-medium mt-1">
                    서버 검증 에러 메시지
                </p>
            </div>

            <div class="space-y-3">
                <label class="block text-xs font-bold uppercase tracking-[0.2em] text-secondary" for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" th:field="*{confirmPassword}" class="bd-input" placeholder="비밀번호를 다시 한 번 입력하세요" required />
                <p id="confirm-error" class="text-xs text-error font-medium mt-1 hidden">비밀번호가 일치하지 않습니다.</p>
                <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-xs text-error font-medium mt-1">
                    서버 검증 에러 메시지
                </p>
            </div>

            <div class="pt-4 flex flex-col md:flex-row gap-4 items-center justify-between">
                <button type="submit" class="btn-primary w-full md:w-auto px-12 py-4 text-xs">
                    비밀번호 업데이트
                </button>
                <button type="button" onclick="window.close()" class="text-[10px] text-secondary hover:text-primary font-bold uppercase tracking-widest transition-colors">
                    취소 및 창 닫기
                </button>
            </div>
        </form>
    </div>

    <div class="mt-8 bg-primary-container/20 p-6 border border-outline-variant/30">
        <h3 class="font-headline text-sm font-black uppercase tracking-tight text-on-primary-container mb-3 flex items-center gap-2">
            <span class="material-symbols-outlined text-lg">shield_lock</span>
            비밀번호 설정 기준
        </h3>
        <ul class="grid grid-cols-1 md:grid-cols-3 gap-4 text-[11px] font-bold text-on-primary-container/80">
            <li class="flex items-center gap-2">
                <span class="material-symbols-outlined text-xs">check_circle</span>
                최소 9자 이상
            </li>
            <li class="flex items-center gap-2">
                <span class="material-symbols-outlined text-xs">check_circle</span>
                영문자, 특수기호 필수
            </li>
            <li class="flex items-center gap-2">
                <span class="material-symbols-outlined text-xs">check_circle</span>
                숫자 포함 필수
            </li>
        </ul>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        const passwordInput = document.getElementById('new_password');
        const confirmInput = document.getElementById('confirm_password');

        const passwordError = document.getElementById('password-error');
        const confirmError = document.getElementById('confirm-error');

        const passwordRegex = /^(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{9,}$/;

        form.addEventListener('submit', function(e) {
            let isValid = true;

            // 1. 비밀번호 정규식 검사
            if (!passwordRegex.test(passwordInput.value)) {
                passwordError.textContent = "최소 9자 이상, 영문 및 숫자를 포함해야 합니다.";
                passwordError.classList.remove('hidden');
                passwordInput.classList.add('ring-2', 'ring-error'); // 입력창 강조
                isValid = false;
            } else {
                passwordError.classList.add('hidden');
                passwordInput.classList.remove('ring-2', 'ring-error');
            }

            // 2. 비밀번호 일치 검사
            if (passwordInput.value !== confirmInput.value) {
                confirmError.textContent = "비밀번호가 일치하지 않습니다.";
                confirmError.classList.remove('hidden');
                confirmInput.classList.add('ring-2', 'ring-error');
                isValid = false;
            } else {
                confirmError.classList.add('hidden');
                confirmInput.classList.remove('ring-2', 'ring-error');
            }

            // 검증 실패 시 폼 전송 중단
            if (!isValid) {
                e.preventDefault();
                // 첫 번째 에러 요소로 포커스 이동
                const firstError = document.querySelector('.ring-error');
                if (firstError) firstError.focus();
            }
        });

        // 입력 시 실시간으로 에러 표시를 지워주는 센스
        [passwordInput, confirmInput].forEach(input => {
            input.addEventListener('input', () => {
                input.classList.remove('ring-2', 'ring-error');
                if(input.id === 'new_password') passwordError.classList.add('hidden');
                if(input.id === 'confirm_password') confirmError.classList.add('hidden');
            });
        });
    });
</script>

</body>
</html>
