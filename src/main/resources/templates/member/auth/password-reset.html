<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEEDAN | 비밀번호 재설정</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .bd-input:focus { border-color: #3b82f6; outline: none; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

<div class="w-full max-w-md bg-white shadow-2xl border-t-4 border-blue-600">
    <div class="p-8">
        <header class="mb-8">
            <span class="text-[10px] font-bold uppercase tracking-[0.3em] text-blue-600 block mb-1">Security Verification</span>
            <h1 class="text-2xl font-black text-slate-900 italic uppercase tracking-tighter">비밀번호 재설정</h1>
            <p class="text-xs text-slate-500 mt-2">안전을 위해 새로운 비밀번호를 입력해 주세요.</p>
        </header>

        <form th:action="@{/auth/passwd/change}" th:object="${passwordResetDto}" method="POST" class="space-y-5">
            <input type="hidden" name="token_id" th:value="${tokenId}" />

            <div class="space-y-1.5">
                <label for="new_password" class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">New Password</label>
                <input type="password"
                       id="new_password"
                       th:field="*{password}"
                       class="w-full bg-slate-100 border-none p-3 text-sm bd-input transition-all"
                       placeholder="새 비밀번호 입력"
                       required>
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-[10px] text-red-500 font-medium">에러 메시지</p>
            </div>

            <div class="space-y-1.5">
                <label for="confirm_password" class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">Confirm Password</label>
                <input type="password"
                       id="confirm_password"
                       th:field="*{confirmPassword}"
                       class="w-full bg-slate-100 border-none p-3 text-sm bd-input transition-all"
                       placeholder="비밀번호 다시 입력"
                       required>
                <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-[10px] text-red-500 font-medium">에러 메시지</p>
            </div>

            <div class="bg-blue-50 p-3 rounded text-[11px] text-blue-700 leading-relaxed">
                <strong>보안 규칙:</strong> 12자 이상, 영문 대소문자 및 숫자를 포함해야 합니다.
            </div>

            <button type="submit"
                    class="w-full bg-slate-900 text-white text-[11px] font-bold uppercase tracking-widest py-4 hover:bg-blue-600 transition-colors shadow-lg active:scale-[0.98]">
                비밀번호 업데이트
            </button>
        </form>
    </div>

    <footer class="bg-slate-50 p-4 border-t border-slate-100 text-center">
        <button onclick="window.close()" class="text-[10px] text-slate-400 hover:text-slate-600 uppercase tracking-tighter">
            창 닫기
        </button>
    </footer>
</div>

</body>
</html>
