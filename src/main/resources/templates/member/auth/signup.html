<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(
          ~{::title},
          null,
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | Registration</title>

<th:block th:fragment="content">

  <script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" th:href="@{/css/file/upload.css}">


  <header class="mb-12">
    <p class="text-primary uppercase font-black text-[10px] tracking-[0.2em] mb-2">Member Onboarding</p>
    <h1 class="font-headline font-black text-5xl md:text-6xl tracking-tighter uppercase leading-none">Business
      Registration</h1>
  </header>

  <form th:action="@{/auth/signup}" th:object="${memberForm}" method="POST" enctype="multipart/form-data"
        class="bg-white p-8 md:p-12 shadow-[0_20px_40px_rgba(0,0,0,0.05)] space-y-12">

    <input type="hidden" th:field="*{impUid}" id="imp_uid" required>

    <section class="space-y-6">
      <div class="flex items-center gap-4 mb-8">
        <span class="w-10 h-10 bg-primary text-white flex items-center justify-center font-bold text-xs leading-none">01</span>
        <h2 class="font-headline font-bold text-xl tracking-widest uppercase text-on-background">본인 인증</h2>
        <button type="button" id="certify_phone"
                class="btn-secondary px-6 whitespace-nowrap flex-shrink-0 h-10 ml-auto">
          휴대전화 인증
        </button>
      </div>
      <input type="hidden" th:field="*{phoneCheckedInput}">
      <p th:if="${#fields.hasErrors('impUid')}" th:errors="*{impUid}" class="text-error text-[11px] font-bold mt-1"></p>
      <p id="phoneAvailable" class="text-[10px] text-stone-400" th:hidden="!${memberForm.phoneCheckedInput}" >본인인증을 완료했습니다.</p>
    </section>

    <section class="space-y-6">
      <div class="flex items-center gap-4 mb-8">
        <span class="w-10 h-10 bg-primary text-white flex items-center justify-center font-bold text-xs leading-none">02</span>
        <h2 class="font-headline font-bold text-xl tracking-widest uppercase text-on-background">계정 정보 입력</h2>
      </div>

      <div class="grid grid-cols-1 gap-6">
        <div class="space-y-2">
          <label class="block text-secondary font-bold text-[10px] uppercase tracking-wider">로그인 아이디 <span class="text-error">*</span></label>
          <div class="flex gap-2">
            <input type="text"
                   th:field="*{userLoginId}"
                   class="bd-input flex-grow"
                   placeholder="Preferred Username"
                   th:readonly="${memberForm.idCheckedInput}"
                   th:classappend="${memberForm.idCheckedInput} ? 'bg-surface-container-low text-stone-500 cursor-not-allowed' : ''">
            <input th:value="${idCheckedInput}" type="hidden" th:field="*{idCheckedInput}" value="false">
            <button type="button" id="idCheckedBtn" class="btn-secondary px-2 whitespace-nowrap"
                    th:disabled="${memberForm.idCheckedInput}">중복 확인</button>
          </div>
          <p th:if="${#fields.hasErrors('userLoginId')}" th:errors="*{userLoginId}" class="text-error text-[11px] font-bold mt-1"></p>
          <p id="available" class="text-[10px] text-stone-400" th:hidden="!${memberForm.idCheckedInput}" >이용 가능한 계정입니다.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="block text-secondary font-bold text-[10px] uppercase tracking-wider">비밀번호 <span class="text-error">*</span></label>
            <input type="password" th:field="*{password}" class="bd-input">
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-error text-[11px] font-bold mt-1"></p>
          </div>
          <div class="space-y-2">
            <label class="block text-secondary font-bold text-[10px] uppercase tracking-wider">비밀번호 확인 <span class="text-error">*</span></label>
            <input type="password" th:field="*{confirmPassword}" class="bd-input">
            <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-error text-[11px] font-bold mt-1"></p>
          </div>
        </div>

        <div class="space-y-2">
          <label class="block text-secondary font-bold text-[10px] uppercase tracking-wider">이메일 <span class="text-error">*</span></label>
          <input type="email" th:field="*{email}" class="bd-input" placeholder="name@company.jp">
          <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-error text-[11px] font-bold mt-1"></p>
        </div>
      </div>
    </section>

    <section class="space-y-6 pt-8 border-t border-outline-variant">
      <div class="flex items-center gap-4 mb-8">
        <span class="w-10 h-10 bg-primary text-white flex items-center justify-center font-bold text-xs leading-none">03</span>
        <h2 class="font-headline font-bold text-xl tracking-widest uppercase text-on-background">사업자 정보 입력</h2>
      </div>

      <div class="space-y-6">
        <input type="hidden" th:field="*{bizCheckedInput}">
        <div class="space-y-2">
          <label class="block text-secondary font-bold text-[10px] uppercase tracking-wider">사업자 등록 번호 <span class="text-error">*</span></label>
          <div class="flex gap-2">
            <input type="text" th:field="*{businessRegNum}"
                   id="b_no" class="bd-input flex-grow" placeholder="- 제외 10자리를 입력하세요"
                   th:readonly="${memberForm.bizCheckedInput}"
                   th:classappend="${memberForm.bizCheckedInput} ? 'bg-surface-container-low text-stone-500 cursor-not-allowed' : ''">
          </div>
          <p th:if="${#fields.hasErrors('businessRegNum')}" th:errors="*{businessRegNum}" class="text-error text-[11px] font-bold mt-1"></p>
        </div>

        <div class="space-y-2">
          <label class="block text-secondary font-bold text-[10px] uppercase tracking-wider">상호<span class="text-error">*</span></label>
          <input type="text" th:field="*{companyName}"
                 id="b_nm" class="bd-input" placeholder="사업자등록증 상호명"
                 th:readonly="${memberForm.bizCheckedInput}"
                 th:classappend="${memberForm.bizCheckedInput} ? 'bg-surface-container-low text-stone-500 cursor-not-allowed' : ''">
          <p th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}" class="text-error text-[11px] font-bold mt-1"></p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="block text-secondary font-bold text-[10px] uppercase tracking-wider">대표자명<span class="text-error">*</span></label>
            <input type="text" th:field="*{ceoName}"
                   id="p_nm" class="bd-input"
                   th:readonly="${memberForm.bizCheckedInput}"
                   th:classappend="${memberForm.bizCheckedInput} ? 'bg-surface-container-low text-stone-500 cursor-not-allowed' : ''">
            <p th:if="${#fields.hasErrors('ceoName')}" th:errors="*{ceoName}" class="text-error text-[11px] font-bold mt-1"></p>
          </div>
          <div class="space-y-2">
            <label class="block text-secondary font-bold text-[10px] uppercase tracking-wider">개업연월일 <span class="text-error">*</span></label>
            <input type="date" th:field="*{establishmentDate}"
                   name="establishmentDate" id="start_dt" class="bd-input"
                   th:readonly="${memberForm.bizCheckedInput}"
                   th:classappend="${memberForm.bizCheckedInput} ? 'bg-surface-container-low text-stone-500 cursor-not-allowed' : ''">
          </div>
        </div>

        <div class="space-y-2 flex justify-between">
          <div id="validation-status" class="flex items-center gap-2 text-[10px]">
            <span id="status-icon" class="material-symbols-outlined !text-sm"></span>
            <span id="status-text"></span>
          </div>
          <div>
            <button type="button" id="bizValidationBtn" class="btn-primary py-3 px-6 !text-xs whitespace-nowrap">인증</button>
          </div>
        </div>

        <div class="space-y-2">
          <div class="flex justify-between items-end">
            <label class="block text-secondary font-bold text-[10px] uppercase tracking-wider">
              사업자등록증 첨부 <span class="text-error">*</span>
            </label>
            <span class="text-[9px] text-slate-400 font-medium">
            <span class="material-symbols-outlined !text-[10px] align-middle">info</span>
            허용 확장자: JPG, PNG, PDF (최대 5MB)
        </span>
          </div>

          <div class="mt-1">
            <div th:replace="~{fragments/file/fileUpload :: upload(maxCount=1, existingFiles=null, isMultiple=false)}"></div>
          </div>

          <p class="text-[10px] text-slate-500 leading-relaxed mt-1">
            * 글자가 명확하게 보이도록 스캔하거나 촬영하여 업로드해 주세요.
          </p>
          <p th:if="${#fields.hasErrors('newFiles')}" th:errors="*{newFiles}" class="text-error text-[11px] font-bold mt-1"></p>
        </div>

        <div class="space-y-2">
          <label class="block text-secondary font-bold text-[10px] uppercase tracking-wider">대표자 전화번호 <span class="text-error">*</span></label>
          <input type="tel" th:field="*{ceoPhone}" class="bd-input" placeholder="000-0000-0000">
          <p th:if="${#fields.hasErrors('ceoPhone')}" th:errors="*{ceoPhone}" class="text-error text-[11px] font-bold mt-1"></p>
        </div>
        <div class="space-y-2">
          <label class="block text-secondary font-bold text-[10px] uppercase tracking-wider">회사 전화번호 <span class="text-error">*</span></label>
          <input type="tel" th:field="*{cmpPhone}" class="bd-input" placeholder="000-0000-0000">
          <p th:if="${#fields.hasErrors('cmpPhone')}" th:errors="*{cmpPhone}" class="text-error text-[11px] font-bold mt-1"></p>
        </div>

        <div class="space-y-2">
          <label class="block text-secondary font-bold text-[10px] uppercase tracking-wider">회사 주소 <span class="text-error">*</span></label>
          <div class="flex gap-2">
            <input type="text" id="postcode" th:field="*{postCode}" class="bd-input flex-grow" placeholder="우편번호" readonly>
            <button type="button" id="searchPostCode" class="btn-secondary px-4 whitespace-nowrap">우편번호 찾기</button>
          </div>
        </div>
        <div class="space-y-2">
          <input type="text" id="baseAddress" th:field="*{companyAddress}" class="bd-input" placeholder="회사주소" readonly>
          <input type="text" id="detailAddress" th:field="*{companyAddressDetail}" class="bd-input" placeholder="상세주소">
        </div>
      </div>
    </section>

    <footer class="pt-8 border-t border-outline-variant flex flex-col gap-4">
      <button type="submit" class="btn-primary w-full py-5 text-base">가입 요청</button>
    </footer>
  </form>

  <p class="mt-8 text-center md:text-left text-[10px] text-stone-400 uppercase tracking-widest">
    Having trouble? <a th:href="@{/support}" class="text-primary font-bold underline underline-offset-4">Contact Curator
    Support</a>
  </p>

  <script th:src="@{/js/postcode/postcode.js}"></script>
  <script th:src="@{/js/auth/biz-number-validation.js}"></script>
  <script th:src="@{/js/auth/phone-certification.js}"></script>
  <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>


  <script>
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    const lockInputFields = (elements) => {
      elements.forEach(el => {
        // 읽기 전용으로 변경
        el.readOnly = true;

        // 기존 배경색 클래스가 있다면 제거 (예: bg-white)
        el.classList.remove("bg-white");

        // 요청하신 클래스들 추가
        el.classList.add(
                "bg-surface-container-low",
                "text-stone-500",
                "cursor-not-allowed"
        );
      });
    };

    axios.defaults.headers.common[csrfHeader] = csrfToken;
    // 포트원 본인인증API 연결
    let certifyPhoneBtn = document.getElementById("certify_phone");
    let phoneAvailable = document.getElementById("phoneAvailable");
    let phoneCheckedInput = document.getElementById("phoneCheckedInput")
    let certify_phone = document.getElementById("certify_phone")
    certifyPhoneBtn.addEventListener('click',async () => {
      const response = await PortOne.requestIdentityVerification({
        storeId: "store-6e274706-e18d-4cc0-95b4-f9da97355da2",
        identityVerificationId: `identity-verification-${crypto.randomUUID()}`,
        channelKey: "channel-key-fe0517f7-44f1-4916-b471-2a71918fe5e3"
      });

      if (response.code !== undefined) {
        return alert(response.message);
      }

      document.getElementById("imp_uid").value = response.identityVerificationId;
      phoneAvailable.removeAttribute("hidden");
      certify_phone.disabled = true;
      phoneCheckedInput.value = true;

    })

    // 우편번호 찾기 API연결
    let searchPostCodeBtn = document.getElementById("searchPostCode");
    searchPostCodeBtn.addEventListener('click', () => {
      execDaumPostcode();
    })

    // 사업자등록번호 검증 API 연결
    let bizValidationBtn = document.getElementById("bizValidationBtn");
    bizValidationBtn.addEventListener('click', async () => {
      let bNoEl = document.getElementById("b_no");
      let bNmEl = document.getElementById("b_nm");
      let pNmEl = document.getElementById("p_nm");
      let sDtEl = document.getElementById("start_dt");

      const bizDto = {
        b_no: bNoEl.value,
        b_nm: bNmEl.value,
        p_nm: pNmEl.value,
        start_dt: sDtEl.value.replace(/-/g, "")
      }

      let emptyField;
      const filedNames = {b_no: "사업자번호", b_nm: "상호명", p_nm: "대표자명", start_dt: "개업연원일"};
      for (const [key, value] of Object.entries(bizDto)) {
        if (!value) {
          emptyField = key;
          document.getElementById(key).focus();
          alert(`${filedNames[emptyField]}을/를 입력해주세요.`);
          return;
        }
      }

      const result = await BizNumberValidation.validate(bizDto);
      let data = result.data[0];
      console.log("html script result:" + result);

      let validationStatus = document.getElementById("validation-status");
      let statusIcon = document.getElementById("status-icon");
      let statusText = document.getElementById("status-text");
      let bizValidationBtn = document.getElementById("bizValidationBtn");
      let bizCheckedInput = document.getElementById("bizCheckedInput")
      if (data.valid === "01") {

        statusIcon.innerText = "verified";
        statusText.innerText = "사업자정보 인증을 완료했습니다.";
        const elements = [bNoEl, bNmEl, pNmEl, sDtEl];
        lockInputFields(elements);
        bizValidationBtn.disabled = true;
        bizCheckedInput.value = true;
      } else if (data.valid === "02") {
        alert("사업자 정보가 일치하지 않습니다.");
      }
    })

    // 아이디 중복체크 버튼
    let idCheckedBtn = document.getElementById("idCheckedBtn");
    let userLoginId = document.getElementById("userLoginId");
    let idCheckedInput = document.getElementById("idCheckedInput");

      idCheckedBtn.addEventListener('click', async () => {
        // 중복확인 비동기요청
        if (userLoginId.value.length < 6) {
          alert("아이디는 6글자 이상 입력해주세요.")
        } else {

          let checked = await axios.post("/api/auth/idChecked", {
            username: userLoginId.value
          })
          if (checked.data === true) {
            const elements = [userLoginId];
            lockInputFields(elements);
            const available = document.getElementById("available");
            available.removeAttribute("hidden");
            idCheckedBtn.disabled = true;
            idCheckedInput.value = true;
          } else {
            alert("이미 사용 중인 아이디입니다. 다른 아이디를 입력해주세요.");
            userLoginId.focus();
          }
        }
      })

  </script>
</th:block>

</html>
