<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          null,
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | 로그인</title>

<th:block th:fragment="content">
  <div class="fixed top-0 right-0 w-1/3 h-full bg-surface-container-low -z-10 opacity-50 skew-x-[-12deg] translate-x-1/2 pointer-events-none"></div>
  <div class="fixed bottom-0 left-0 w-64 h-64 bg-primary-container/5 rounded-full blur-[120px] -z-10 pointer-events-none"></div>

  <div class="min-h-[80vh] flex items-center justify-center p-6">
    <main class="w-full max-w-[480px] md:w-[480px] md:flex-none">

      <div class="mb-12 flex flex-col items-center">
        <span class="font-headline text-[10px] tracking-[0.3em] text-primary font-bold mb-4 uppercase">로그인</span>
        <h1 class="font-headline text-5xl font-black tracking-tighter text-on-surface">BEEDAN</h1>
      </div>

      <div class="bg-surface-container-lowest shadow-4px_20px_rgba_26_28_28_01 p-10 md:p-12 relative">
        <form th:action="@{/auth/signin}" method="post" class="space-y-8">

          <div class="space-y-2">
            <label class="block font-headline text-[10px] font-medium tracking-widest uppercase text-secondary"
                   for="username">
              아이디
            </label>
            <div class="relative">
              <input type="text" id="username" name="username"
                     class="bd-input bg-surface-container-high border-none focus:ring-1 focus:ring-primary transition-all duration-200"
                     required />
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-end">
              <label class="block font-headline text-[10px] font-medium tracking-widest uppercase text-secondary"
                     for="password">
                비밀번호
              </label>
            </div>
            <div class="relative">
              <input type="password" id="password" name="password"
                     class="bd-input bg-surface-container-high border-none focus:ring-1 focus:ring-primary transition-all duration-200"
                     placeholder="••••••" required />
            </div>
          </div>
          <div th:if="${errorMessage != null}" class="mb-6 p-4 border bg-error-container/10 border-error/20 break-words">
            <p class="text-[10px] font-bold tracking-widest text-error uppercase text-center break-words" th:text="${errorMessage.errorType}">
              인증 실패
            </p>
            <p class="text-[10px] text-error/80 text-center mt-1 break-words" th:text="${errorMessage.message}">
              아이디 또는 비밀번호가 일치하지 않습니다.
            </p>
          </div>
          <div th:if="${errorMessage == null && successMessage != null}" class="mb-6 p-4 border bg-success-container/10 border-success/20 break-words">
            <p class="text-[10px] font-bold tracking-widest text-success uppercase text-center break-words">
              변경 성공
            </p>
            <p class="text-[10px] text-success/80 text-center mt-1 break-words" th:text="${successMessage}">
              아이디 또는 비밀번호가 일치하지 않습니다.
            </p>
          </div>
          <div class="pt-4 space-y-6">
            <button type="submit" class="btn-primary w-full py-5 text-xs">
              로그인
            </button>

            <div class="flex flex-col gap-4 pt-4">
              <div class="flex justify-between items-center text-[10px] font-medium tracking-[0.2em] text-secondary uppercase">
                <button type="button"
                        onclick="openModal()"
                        class="hover:text-primary transition-colors duration-300 text-[10px] font-medium tracking-[0.2em] text-secondary uppercase text-left cursor-pointer">
                  아이디/비밀번호 찾기
                </button>
              </div>
            </div>
          </div>
        </form>

        <div class="mt-10">
          <div class="relative flex items-center mb-4 mt-4">
            <div class="flex-grow border-t border-secondary/20"></div>
            <span class="flex-none mx-4 text-[9px] font-bold tracking-[0.3em] text-secondary/50 uppercase">간편 로그인</span>
            <div class="flex-grow border-t border-secondary/20"></div>
          </div>

          <div class="flex justify-center">
            <a th:href="@{/oauth2/authorization/kakao}"
               class="flex items-center justify-center gap-3 w-full py-3 bg-[#FEE500] hover:bg-[#FDD835] text-[#191919] transition-all duration-200 shadow-sm group">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3C6.477 3 2 6.48 2 10.791c0 2.758 1.817 5.18 4.545 6.44l-1.16 4.254c-.052.193.064.394.258.446a.35.35 0 0 0 .216-.01l5.06-3.366C11.31 18.51 11.65 18.524 12 18.524c5.523 0 10-3.48 10-7.733S17.523 3 12 3z"/>
              </svg>
              <span class="text-[11px] font-bold tracking-wider uppercase">카카오로 시작하기</span>
            </a>
          </div>
        </div>
      </div>
      <div id="recoveryModal"
           class="fixed inset-0 z-[100] items-center justify-center hidden backdrop-blur-sm bg-black/60 transition-opacity duration-300"
           onclick="handleBackdropClick(event)">

        <div class="bg-surface-container-lowest border border-outline-variant border-t-4 border-t-primary w-[400px] shadow-2xl relative animate-in fade-in zoom-in duration-200"
             onclick="event.stopPropagation()">

          <button type="button" onclick="closeModal()" class="absolute top-4 right-4 text-secondary/40 hover:text-primary transition-colors">
            <span class="material-symbols-outlined text-xl">close</span>
          </button>

          <div class="p-8">
            <div class="flex flex-col items-center mb-8">
              <div class="w-14 h-14 bg-primary/10 flex items-center justify-center mb-4">
                <span class="material-symbols-outlined text-3xl text-primary">person_search</span>
              </div>
              <h3 class="font-headline font-black text-xl tracking-tight text-on-surface">계정 찾기</h3>
              <p class="text-[10px] text-secondary mt-2 tracking-widest">등록된 정보로 계정을 찾을 수 있습니다</p>
            </div>

            <div class="flex mb-8 bg-surface-container-high p-1 border border-outline-variant/30">
              <button type="button" onclick="switchTab('findId')" id="tab-findId"
                      class="flex-1 py-3 text-[10px] font-bold tracking-[0.2em] uppercase transition-all bg-surface-container-lowest text-primary shadow-sm">
                아이디 찾기
              </button>
              <button type="button" onclick="switchTab('findPw')" id="tab-findPw"
                      class="flex-1 py-3 text-[10px] font-bold tracking-[0.2em] uppercase transition-all text-secondary hover:text-primary">
                비밀번호 찾기
              </button>
            </div>

            <div id="form-findId" class="space-y-5">
              <div class="space-y-2">
                <label class="block text-[9px] font-bold tracking-widest text-secondary/80">이름</label>
                <input type="text" id="findIdName" class="w-full bg-surface-container-high border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary text-sm py-3 px-4 outline-none transition-all" placeholder="이름 입력">
              </div>
              <div class="space-y-2">
                <label class="block text-[9px] font-bold tracking-widest text-secondary/80">이메일</label>
                <input type="email" id="findIdEmail" class="w-full bg-surface-container-high border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary text-sm py-3 px-4 outline-none transition-all" placeholder="이메일 입력">
              </div>

              <div id="idResult" class="hidden p-4 bg-primary/5 border border-primary/20 text-center my-2">
                <p class="text-[9px] text-secondary tracking-widest mb-1">찾은 아이디</p>
                <p class="text-sm font-black text-primary tracking-widest" id="foundIdText"></p>
              </div>

              <button type="button" onclick="handleFindId()" class="w-full py-4 mt-2 bg-primary text-[#191919] font-headline font-black text-[11px] tracking-[0.2em] uppercase hover:bg-primary/90 transition-all shadow-md active:translate-y-[1px]">
                아이디 찾기
              </button>
            </div>

            <div id="form-findPw" class="hidden space-y-5">
              <div class="space-y-2">
                <label class="block text-[9px] font-bold tracking-widest text-secondary/80">아이디</label>
                <input type="text" id="findPwId" class="w-full bg-surface-container-high border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary text-sm py-3 px-4 outline-none transition-all" placeholder="아이디 입력">
              </div>
              <div class="space-y-2">
                <label class="block text-[9px] font-bold tracking-widest text-secondary/80">이메일</label>
                <input type="email" id="findPwEmail" class="w-full bg-surface-container-high border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary text-sm py-3 px-4 outline-none transition-all" placeholder="이메일 입력">
              </div>

              <div id="pwResult" class="hidden p-4 bg-primary/5 border border-primary/20 text-center my-2">
                <p class="text-[10px] text-primary font-black tracking-widest">재설정 링크가 발송되었습니다</p>
              </div>

              <button type="button" onclick="handleFindPw()" class="w-full py-4 mt-2 bg-primary text-[#191919] font-headline font-black text-[11px] tracking-[0.2em] uppercase hover:bg-primary/90 transition-all shadow-md active:translate-y-[1px]">
                비밀번호 재설정
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    /* 1. Modal Toggle 로직 */
    function openModal() {
      const modal = document.getElementById('recoveryModal');
      if (modal) {
        modal.classList.remove('hidden'); // 숨김 해제
        modal.classList.add('flex');      // 중앙 정렬 레이아웃 적용
        document.body.style.overflow = 'hidden'; // 배경 스크롤 방지
      }
    }

    /**
     * 모달 닫기: flex 제거 + hidden 추가
     */
    function closeModal() {
      const modal = document.getElementById('recoveryModal');
      if (modal) {
        modal.classList.remove('flex');   // 레이아웃 제거
        modal.classList.add('hidden');    // 확실하게 숨김
        document.body.style.overflow = ''; // 배경 스크롤 복구

        // 결과창 초기화
        document.getElementById('idResult')?.classList.add('hidden');
        document.getElementById('pwResult')?.classList.add('hidden');
      }
    }

    /* 2. 배경 클릭 핸들러 (e.target 활용) */
    function handleBackdropClick(e) {
      // 클릭된 대상이 정확히 배경(recoveryModal)일 때만 닫기
      if (e.target === e.currentTarget) {
        closeModal();
      }
    }

    /* 3. 탭 전환 (디자인 클래스 교체) */
    function switchTab(type) {
      const idForm = document.getElementById('form-findId');
      const pwForm = document.getElementById('form-findPw');
      const idTab = document.getElementById('tab-findId');
      const pwTab = document.getElementById('tab-findPw');

      const activeClasses = ['bg-surface-container-lowest', 'text-primary', 'shadow-sm'];
      const inactiveClasses = ['text-secondary'];

      if (type === 'findId') {
        idForm.classList.remove('hidden');
        pwForm.classList.add('hidden');

        idTab.classList.add(...activeClasses);
        idTab.classList.remove(...inactiveClasses);
        pwTab.classList.remove(...activeClasses);
        pwTab.classList.add(...inactiveClasses);
      } else {
        idForm.classList.add('hidden');
        pwForm.classList.remove('hidden');

        pwTab.classList.add(...activeClasses);
        pwTab.classList.remove(...inactiveClasses);
        idTab.classList.remove(...activeClasses);
        idTab.classList.add(...inactiveClasses);
      }
    }

    /* 4. 공통: ESC 키로 닫기 */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
  <script>
    /**
     * 1. 아이디 찾기 로직 (Axios)
     */
    async function handleFindId() {
      const name = document.getElementById('findIdName').value.trim();
      const email = document.getElementById('findIdEmail').value.trim();
      const resultDiv = document.getElementById('idResult');
      const resultText = document.getElementById('foundIdText');

      if (!name || !email) {
        alert('이름과 이메일을 모두 입력해 주세요.');
        return;
      }

      try {
        // Axios GET 요청
        const response = await axios.get('/api/auth/find-id', {
          params: { name, email } // 쿼리 스트링으로 자동 변환
        });

        // Axios는 응답 데이터를 response.data에 담습니다.
        if (response.data && response.data.loginId) {
          resultText.innerText = response.data.loginId;
          resultDiv.classList.remove('hidden');
        }
      } catch (error) {
        console.error('ID 찾기 실패:', error);
        const message = error.response?.data?.message || '일치하는 정보가 없습니다.';
        alert(message);
        resultDiv.classList.add('hidden');
      }
    }

    /**
     * 2. 비밀번호 찾기 로직 (Axios)
     */
    async function handleFindPw() {
      const loginId = document.getElementById('findPwId').value.trim();
      const email = document.getElementById('findPwEmail').value.trim();
      const resultDiv = document.getElementById('pwResult');

      if (!loginId || !email) {
        alert('아이디와 이메일을 모두 입력해 주세요.');
        return;
      }

      const csrfToken = document.querySelector('input[name="_csrf"]')?.value;

      try {
        // Axios POST 요청 (Form Data 형식)
        const params = new URLSearchParams();
        params.append('loginId', loginId);
        params.append('email', email);

        const response = await axios.post('/api/auth/passwd/reset/request', params, {
          headers: {
            'X-CSRF-TOKEN': csrfToken // 보안을 위한 CSRF 토큰 전송
          }
        });

        if (response.status === 200) {
          resultDiv.classList.remove('hidden');
          alert('비밀번호 재설정 링크가 발송되었습니다.');
          closeModal();
        }
      } catch (error) {
        console.error('PW 리셋 요청 실패:', error);
        alert('정보가 일치하지 않거나 메일 전송 중 오류가 발생했습니다.');
        resultDiv.classList.add('hidden');
      }
    }
  </script>
</th:block>
</html>
