<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          null,
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | 로그인</title>

<th:block th:fragment="content">
  <div class="fixed top-0 right-0 w-1/3 h-full bg-surface-container-low -z-10 opacity-50 skew-x-[-12deg] translate-x-1/2 pointer-events-none"></div>
  <div class="fixed bottom-0 left-0 w-64 h-64 bg-primary-container/5 rounded-full blur-[120px] -z-10 pointer-events-none"></div>

  <div class="min-h-[80vh] flex items-center justify-center p-6">
    <main class="w-full max-w-[480px]">

      <div class="mb-12 flex flex-col items-center">
        <span class="font-headline text-[10px] tracking-[0.3em] text-primary font-bold mb-4 uppercase">Identity Access</span>
        <h1 class="font-headline text-5xl font-black tracking-tighter text-on-surface">BEEDAN</h1>
      </div>

      <div class="bg-surface-container-lowest shadow-4px_20px_rgba_26_28_28_01 p-10 md:p-12 relative">
        <form th:action="@{/auth/signin}" method="post" class="space-y-8">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <div class="space-y-2">
            <label class="block font-headline text-[10px] font-medium tracking-widest uppercase text-secondary"
                   for="username">
              Login Identifier
            </label>
            <div class="relative">
              <input type="text" id="username" name="username"
                     class="bd-input bg-surface-container-high border-none focus:ring-1 focus:ring-primary transition-all duration-200"
                     required />
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-end">
              <label class="block font-headline text-[10px] font-medium tracking-widest uppercase text-secondary"
                     for="password">
                Password
              </label>
            </div>
            <div class="relative">
              <input type="password" id="password" name="password"
                     class="bd-input bg-surface-container-high border-none focus:ring-1 focus:ring-primary transition-all duration-200"
                     placeholder="••••••" required />
            </div>
          </div>
          <div th:if="${param.error}" class="mb-6 p-4 bg-error-container/10 border border-error/20 rounded-lg">
            <p class="text-[10px] font-bold tracking-widest text-error uppercase text-center">
              인증 실패
            </p>
            <p class="text-[10px] text-error/80 text-center mt-1" th:text="${param.message}">
              아이디 또는 비밀번호가 일치하지 않습니다.
            </p>
          </div>
          <div class="pt-4 space-y-6">
            <button type="submit" class="btn-primary w-full py-5 text-xs">
              Authorize Entry
            </button>

            <div class="flex flex-col gap-4 pt-4">
              <div class="flex justify-between items-center text-[10px] font-medium tracking-[0.2em] text-secondary uppercase">
                <a th:href="@{/auth/find}" class="hover:text-primary transition-colors duration-300">아이디/비밀번호 찾기</a>
              </div>
            </div>
          </div>
        </form>

        <div class="mt-10">
          <div class="relative flex items-center mb-4 mt-4">
            <div class="flex-grow border-t border-secondary/20"></div>
            <span class="flex-none mx-4 text-[9px] font-bold tracking-[0.3em] text-secondary/50 uppercase">Social Access</span>
            <div class="flex-grow border-t border-secondary/20"></div>
          </div>

          <div class="flex justify-center">
            <a th:href="@{/oauth2/authorization/kakao}"
               class="flex items-center justify-center gap-3 w-full py-3 bg-[#FEE500] hover:bg-[#FDD835] text-[#191919] transition-all duration-200 shadow-sm group">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3C6.477 3 2 6.48 2 10.791c0 2.758 1.817 5.18 4.545 6.44l-1.16 4.254c-.052.193.064.394.258.446a.35.35 0 0 0 .216-.01l5.06-3.366C11.31 18.51 11.65 18.524 12 18.524c5.523 0 10-3.48 10-7.733S17.523 3 12 3z"/>
              </svg>
              <span class="text-[11px] font-bold tracking-wider uppercase">Login with Kakao</span>
            </a>
          </div>
        </div>
      </div>

      </div>
    </main>
  </div>
</th:block>
</html>
