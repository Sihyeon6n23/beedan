<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('TRADE MANAGEMENT', 'Quotation Overview', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | 견적 목록</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{member/mypage/mypage-sidebar :: sidebar('quote', 'quote-list')}"></div>
</th:block>

<th:block th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/quote/quote-list.css}">

    <section class="quote-page quote-list-page">
        <!-- Header -->
        <header class="quote-shell quote-shell--header">
            <div class="quote-shell__heading">
                <span class="quote-kicker">Quotation Overview</span>
                <h2 class="quote-title">견적 목록</h2>
            </div>
            <div class="quote-shell__rule"><span></span></div>
        </header>

        <!-- Toolbar -->
        <section class="quote-shell quote-shell--toolbar" aria-label="견적 목록 필터">
            <div class="quote-toolbar">
                <div class="quote-toolbar__filters">
                    <div class="quote-filter-set" data-filter-group="status">
                        <a class="quote-filter is-active" href="#">전체</a>
                        <a class="quote-filter" href="#">제출완료</a>
                        <a class="quote-filter" href="#">승인</a>
                        <a class="quote-filter" href="#">거절</a>
                        <a class="quote-filter" href="#">만료</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- List -->
        <section class="quote-shell quote-shell--list">
            <div class="quote-list-head" aria-hidden="true">
                <div>견적 정보</div>
                <div>상태</div>
                <div>발행일</div>
                <div>금액</div>
            </div>

            <div class="quote-list-body">
                <th:block th:each="q : ${quotes}">
                    <a th:href="@{/quote/detail(quId=${q.quId})}"
                       class="quote-row"
                       th:classappend="${!q.quOpYn} ? ' quote-row--featured' : ''">
                        <div class="quote-row__primary">
                            <span th:if="${!q.quOpYn}" class="quote-row__unread"></span>
                            <span th:if="${q.quOpYn}" class="quote-row__unread quote-row__unread--empty"></span>
                            <div class="quote-row__text">
                                <h2>
                                    <span th:text="${q.quCd}">QU0000</span>
                                    <small th:text="${q.itemCount + '개 품목'}">0개 품목</small>
                                </h2>
                                <p th:text="${q.firstItemName != null ? q.firstItemName : '상품 정보 없음'}">상품명</p>
                            </div>
                        </div>
                        <div class="quote-row__status">
                            <span class="quote-badge"
                                  th:classappend="'quote-badge--' + ${q.quStt.toLowerCase()}"
                                  th:text="${q.quStt == 'TEMP_SAVE' ? '임시저장' :
                                             q.quStt == 'SUBMITTED' ? '제출완료' :
                                             q.quStt == 'APPROVED' ? '승인' :
                                             q.quStt == 'REJECTED' ? '거절' : '만료'}">상태</span>
                        </div>
                        <div class="quote-row__time">
                            <span th:text="${q.quCreDt != null ? #temporals.format(q.quCreDt, 'yyyy.MM.dd') : '-'}">2024.10.21</span>
                        </div>
                        <div class="quote-row__amount">
                            <span th:if="${q.totalAmount != null}"
                                  th:text="${#numbers.formatInteger(q.totalAmount, 3, 'COMMA') + '원'}">0원</span>
                            <span th:if="${q.totalAmount == null}" class="quote-row__amount--pending">산출 중</span>
                        </div>
                    </a>
                </th:block>

                <div class="quote-empty-state"
                     th:if="${#lists.isEmpty(quotes)}">
                    <strong>표시할 견적이 없습니다.</strong>
                    <p>아직 요청한 견적이 없습니다.</p>
                </div>
            </div>
        </section>

        <!-- Pagination -->
        <footer class="quote-shell quote-shell--pagination">
            <div class="quote-pagination">
                <span class="quote-page-button quote-page-button--wide is-disabled">Prev</span>
                <a class="quote-page-button is-current" href="#">01</a>
                <a class="quote-page-button" href="#">02</a>
                <a class="quote-page-button" href="#">03</a>
                <a class="quote-page-button quote-page-button--wide" href="#">Next</a>
            </div>
        </footer>
    </section>
</th:block>
</html>
