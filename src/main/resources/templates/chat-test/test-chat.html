<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>WebSocket STOMP 테스트</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f7f7f8;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 24px;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        .desc {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }

        .row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 180px;
            flex: 1;
        }

        label {
            font-size: 13px;
            font-weight: bold;
        }

        input, button {
            padding: 10px 12px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            cursor: pointer;
            border: none;
            background: #222;
            color: white;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .status {
            margin: 16px 0;
            padding: 10px 12px;
            border-radius: 8px;
            background: #f1f3f5;
            font-size: 14px;
        }

        .chat-box {
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fafafa;
            height: 400px;
            overflow-y: auto;
            padding: 16px;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px 12px;
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
        }

        .message .meta {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .message .content {
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .system {
            background: #eef6ff;
            border-color: #cfe2ff;
        }

        .my-message {
            background: #f5fff0;
            border-color: #d9f0c7;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>WebSocket + STOMP 테스트 페이지</h1>
    <div class="desc">
        브라우저 두 개를 열어서 sender 값만 다르게 넣고 같은 roomId로 테스트하면 된다.
    </div>

    <div class="row">
        <div class="field">
            <label for="sender">보내는 사람</label>
            <input type="text" id="sender" value="USER">
        </div>

        <div class="field">
            <label for="roomId">채팅방 번호</label>
            <input type="number" id="roomId" value="1">
        </div>
    </div>

    <div class="row">
        <button type="button" id="connectBtn" onclick="connect()">연결</button>
        <button type="button" id="disconnectBtn" onclick="disconnect()" disabled>연결 해제</button>
    </div>

    <div class="status" id="status">상태: 연결 전</div>

    <div class="row">
        <div class="field" style="flex: 1 1 100%;">
            <label for="message">메시지</label>
            <input type="text" id="message" placeholder="메시지를 입력하세요">
        </div>
    </div>

    <div class="row">
        <button type="button" id="sendBtn" onclick="sendMessage()" disabled>전송</button>
    </div>

    <div class="chat-box" id="chatBox"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs/bundles/stomp.umd.min.js"></script>
<script>
    // STOMP 연결 객체
    let stompClient = null;
    // 현재 구독 정보
    let currentSubscription = null;
    // 현재 연결 상태
    let connected = false;

    // 상태 표시
    function setStatus(text) {
        document.getElementById('status').innerText = '상태: ' + text;
    }

    // 시스템 메시지 출력
    function appendSystemMessage(text) {
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = 'message system';
        div.innerHTML = `
            <div class="meta">SYSTEM</div>
            <div class="content">${escapeHtml(text)}</div>
        `;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 채팅 메시지 출력
    function appendChatMessage(data, isMine = false) {
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = isMine ? 'message my-message' : 'message';

        const timeText = data.sentAt ? data.sentAt : new Date().toLocaleTimeString();

        div.innerHTML = `
            <div class="meta">
                sender: ${escapeHtml(data.sender || 'UNKNOWN')}
                | roomId: ${escapeHtml(String(data.roomId || ''))}
                | time: ${escapeHtml(timeText)}
            </div>
            <div class="content">${escapeHtml(data.content || '')}</div>
        `;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(str) {
        return String(str)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function connect() {
        // 중복 연결 검증
        if (connected) {
            appendSystemMessage('이미 연결되어 있습니다.');
            return;
        }

        // roomId 입력 검증
        const roomId = document.getElementById('roomId').value.trim();
        if (!roomId) {
            alert('roomId를 입력하세요.');
            return;
        }

        // STOMP 연결 객체 생성
        stompClient = new StompJs.Client({
            brokerURL: 'ws://localhost:8080/ws',
            reconnectDelay: 5000,
            debug: function (str) {
                console.log('[STOMP DEBUG]', str);
            },
            // 서버 연결 성공 시 실행되는 콜백 함수
            onConnect: function () {
                connected = true;
                setStatus('연결 성공');
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
                document.getElementById('sendBtn').disabled = false;

                appendSystemMessage('서버에 연결되었습니다.');

                // 구독(수신 가능 상태) 시작 (controller의 messagingTemplate.convertAndSend 코드와 동일해야 함)
                currentSubscription = stompClient.subscribe('/sub/chat/rooms/' + roomId, function (message) {
                    const body = JSON.parse(message.body); // JSON 객체로 변환
                    const mySender = document.getElementById('sender').value.trim();
                    const isMine = body.sender === mySender;
                    appendChatMessage(body, isMine);
                });

                appendSystemMessage('구독 완료: /sub/chat/rooms/' + roomId);
            },
            onStompError: function (frame) { // 메시징 규칙/처리 문제
                console.error('Broker error:', frame);
                setStatus('STOMP 에러');
                appendSystemMessage('STOMP 에러가 발생했습니다. 콘솔을 확인하세요.');
            },
            onWebSocketError: function (error) { // 연결 통로 문제
                console.error('WebSocket error:', error);
                setStatus('WebSocket 에러');
                appendSystemMessage('WebSocket 에러가 발생했습니다. 서버 설정을 확인하세요.');
            }
        });

        stompClient.activate(); // 실제 연결
    }

    function disconnect() { // 연결 종료 및 구독 해제
        if (!stompClient || !connected) {
            appendSystemMessage('연결된 상태가 아닙니다.');
            return;
        }

        if (currentSubscription) {
            currentSubscription.unsubscribe();
            currentSubscription = null;
        }

        stompClient.deactivate(); // 연결 종료
        stompClient = null;
        connected = false;

        setStatus('연결 해제');
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('disconnectBtn').disabled = true;
        document.getElementById('sendBtn').disabled = true;

        appendSystemMessage('연결이 해제되었습니다.');
    }

    function sendMessage() {
        // 연결이 안 된 상태는 publish를 하면 안되서 막아야함
        if (!stompClient || !connected) {
            alert('먼저 연결하세요.');
            return;
        }

        const sender = document.getElementById('sender').value.trim();
        const roomId = document.getElementById('roomId').value.trim();
        const content = document.getElementById('message').value.trim();

        if (!sender) {
            alert('sender를 입력하세요.');
            return;
        }

        if (!roomId) {
            alert('roomId를 입력하세요.');
            return;
        }

        if (!content) {
            alert('메시지를 입력하세요.');
            return;
        }

        const payload = {
            roomId: Number(roomId),
            sender: sender,
            content: content
        };

        // 메시지 전송
        stompClient.publish({
            destination: '/pub/chat/message',
            body: JSON.stringify(payload) // 문자열 변환
        });

        document.getElementById('message').value = '';
    }

    document.getElementById('message').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>
</body>
</html>
