<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('주문 목록', 'order', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | Order History</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{member/mypage/mypage-sidebar :: sidebar('Order', 'Order-list')}"></div>
</th:block>

<th:block th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/order/order.css}">
    <link rel="stylesheet" th:href="@{/css/chat/admin-chat.css}">

        <section class="admin-chat-page admin-chat-list-page">
            <header class="admin-chat-shell admin-chat-shell--header">
                <div class="admin-chat-shell__heading">
                    <span class="admin-chat-kicker">ORDER HISTORY</span>
                    <h2 class="admin-chat-title">주문 관리</h2>

                    <div class="admin-chat-shell__rule">
                        <span></span>
                    </div>
                </div>
            </header>

            <section class="admin-chat-shell admin-chat-shell--toolbar" aria-label="배송 목록 필터">
                <div class="admin-chat-toolbar">
                    <div class="admin-chat-toolbar__filters">
                        <div class="admin-chat-filter-set" data-filter-group="status">
                            <a class="admin-chat-filter is-active" href="#" data-status="ALL">전체</a>
                            <a class="admin-chat-filter" href="#" data-status="PREPARING">상품 준비중</a>
                            <a class="admin-chat-filter" href="#" data-status="SHIPPING">배송중</a>
                            <a class="admin-chat-filter" href="#" data-status="DELIVERED">배송 완료</a>
                        </div>
                    </div>
                </div>
            </section>

            <section class="admin-chat-shell admin-chat-shell--list">
                <div class="admin-chat-list-head" aria-hidden="true">
                    <div>주문 번호</div>
                    <div>주문 일자</div>
                    <div>수령인</div>
                    <div>수령 주소</div>
                    <div>총 금액</div>
                    <div>주문 상태</div>
                    <div>Actions</div>
                </div>

                <div class="admin-chat-list-body" id="require-list-body">
                </div>
            </section>

            <div class="table-responsive">
                <table class="order-table">
                    <thead>
                    <tr>
                        <th>주문번호</th>
                        <th>주문 일자</th>
                        <th>수령인</th>
                        <th>수령 주소</th>
                        <th>수량</th>
                        <th>총 금액</th>
                        <th>주문 상태</th>
                        <th class="text-right">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="6" style="text-align: center; padding: 3rem; color: #666;">
                            주문 내역이 존재하지 않습니다.
                        </td>
                    </tr>
                    <tr th:unless="${#lists.isEmpty(orders)}" th:each="order : ${orders}">
                        <td class="order-id" th:text="${order.ordBaseNo != null ? order.ordBaseNo : '#' + order.ordBaseId}">주문번호</td>
                        <td class="order-date" th:text="${#temporals.format(order.ordBaseCreDt, 'yyyy-MM-dd')}">주문일자</td>
                        <td class="order-summary" th:text="${order.ordBaseRcvNm} + '님'">수령인</td>
                        <td class="order-address" th:text="${order.ordBaseAdr + ' ' + order.ordBaseAdrDt}">수령 주소</td>
                        <td class="order-price">-</td>
                        <td class="order-amount">-</td>
                        <td>
                                <span class="badge"
                                      th:classappend="${order.ordBaseStt?.name() == 'PREPARING' ? 'badge-secondary' :
                                                      (order.ordBaseStt?.name() == 'DELIVERING' ? 'badge-yellow' :
                                                      (order.ordBaseStt?.name() == 'DELIVERED' ? 'badge-success' : 'badge-danger'))}"
                                      th:text="${order.ordBaseStt?.name() == 'PREPARING' ? '상품 준비중' :
                                               (order.ordBaseStt?.name() == 'DELIVERING' ? '배송중' :
                                               (order.ordBaseStt?.name() == 'DELIVERED' ? '배송완료' : '주문 취소'))}">
                                    상태
                                </span>
                        </td>
                        <td class="order-actions">
                            <div class="action-links" style="display: flex; gap: 10px; justify-content: flex-end;">
                                <a th:href="@{/order/detail(id=${order.ordBaseId})}" class="link-detail">상세내역</a>
                                <a href="javascript:void(0);" class="link-detail" th:onclick="|loadShipmentDetail('/api/shipments/' + ${order.ordBaseId})|">배송현황</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>


            <div id="orderTrackingModal" class="modal-overlay" style="display: none;">
                <div class="modal-container">
                    <header class="modal-header">
                        <div class="header-main">
                            <h2 class="modal-title">Shipment Tracking</h2>
                        </div>
                        <button class="btn-close" onclick="closeModal()">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </header>

                    <div class="modal-body">
                    </div>

                    <footer class="modal-footer">
                        <button class="btn-solid" onclick="closeModal()">CLOSE</button>
                    </footer>
                </div>
            </div>

            <script>
                const csrfToken = document.querySelector('meta[name="_csrf"]').content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

                function loadShipmentDetail(url) {
                const modal = document.getElementById('orderTrackingModal');
                const contentArea = modal.querySelector('.modal-body');

                // 1. 로딩 표시 (선택 사항이지만 추천)
                contentArea.innerHTML = '<div style="text-align:center; padding:20px;">정보를 불러오는 중입니다...</div>';

                // 2. 모달 먼저 띄우기
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';

                fetch(url)
                    .then(response => {
                        if (!response.ok) throw new Error("배송 정보를 찾을 수 없습니다.");
                        return response.text();
                    })
                    .then(html => {
                        contentArea.innerHTML = html;
                    })
                    .catch(err => {
                        console.error(err);
                        alert(err.message);
                        closeModal();
                    });
                }

                function closeModal() {
                    const modal = document.getElementById('orderTrackingModal');
                    if (modal) {
                        modal.style.display = 'none';
                        document.body.style.overflow = 'auto';
                    }
                }

                window.addEventListener('click', function(event) {
                    const modal = document.getElementById('orderTrackingModal');
                    if (event.target === modal) {
                        closeModal();
                    }
                });
            </script>
        </section>
</th:block>
</html>
