<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('주문 목록', 'order', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | Order History</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{member/mypage/mypage-sidebar :: sidebar('Order', 'Order-list')}"></div>
</th:block>

<th:block th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/chat/admin-chat.css}">
    <style>
        .order-management-list .admin-chat-list-head,
        .order-management-list .admin-chat-row {
            display: grid !important;
            grid-template-columns: minmax(120px, 1.2fr) minmax(200px, 2fr) minmax(180px, 1.3fr) minmax(90px, 0.9fr) minmax(110px, 1fr) !important;
            gap: 1rem;
            align-items: center;
        }

        .order-management-list .action-btns {
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .order-management-list .btn-detail {
            background-color: #e2e2e2;
            color: #1a1c1c;
            border: none;
            padding: 4px 8px;
            font-size: 0.55rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 45px;
            height: 24px;
            transition: all 0.2s ease;
        }
        .order-management-list .btn-detail:hover { background-color: #d1d1d1; }

        .order-management-list .btn-edit {
            background-color: #1a1c1c;
            color: #ffffff;
            border: none;
            padding: 4px 8px;
            font-size: 0.55rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 45px;
            height: 24px;
            transition: all 0.2s ease;
        }
        .order-management-list .btn-edit:hover { background-color: #333; }

        .order-management-list .admin-chat-row__amount {
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            padding-right: 10px;
        }
    </style>

    <section class="admin-chat-page admin-chat-list-page order-management-list">
        <header class="admin-chat-shell admin-chat-shell--header">
            <div class="admin-chat-shell__heading">
                <span class="admin-chat-kicker">ORDER HISTORY</span>
                <h2 class="admin-chat-title">주문 관리</h2>

                <div class="admin-chat-shell__rule">
                    <span></span>
                </div>
            </div>
        </header>

        <section class="admin-chat-shell admin-chat-shell--list">
            <div class="admin-chat-list-head" aria-hidden="true">
                <div>주문번호 / 상품정보</div>
                <div style="text-align: center;">배송지 주소</div>
                <div>결제 금액</div>
                <div style="text-align: center;">상태</div>
                <div style="text-align: center;">관리</div>
            </div>

            <div class="admin-chat-list-body">
                <div th:unless="${#lists.isEmpty(orders)}" th:each="order : ${orders}" class="admin-chat-row">

                    <div class="admin-chat-row__primary">
                        <span class="admin-chat-row__unread" th:classappend="${order.ordBaseStt?.name() == 'PREPARING' ? '' : 'admin-chat-row__unread--empty'}"></span>
                        <div class="admin-chat-row__text">
                            <h2 th:text="${order.ordBaseNo}">주문번호</h2>
                            <p th:text="${order.ordSummaryNm}">상품 정보</p>
                        </div>
                    </div>

                    <div class="admin-chat-row__address" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        <span th:text="${order.ordBaseAdr}">기본 배송지</span>
                    </div>

                    <div class="admin-chat-row__amount">
                        <strong th:text="${order.ordBaseTtAm != null ? #numbers.formatInteger(order.ordBaseTtAm, 3, 'COMMA') : 0} + '원'">금액</strong>
                    </div>

                    <div class="admin-chat-row__status">
                        <span class="admin-chat-badge"
                              th:classappend="${order.ordBaseStt?.name() == 'PREPARING' ? 'admin-chat-badge--open' : (order.ordBaseStt?.name() == 'DELIVERING' || order.ordBaseStt?.name() == 'DELIVERED' ? 'admin-chat-badge--ongoing' : 'admin-chat-badge--closed')}"
                              th:text="${order.ordBaseStt?.name() == 'PREPARING' ? '상품준비' : (order.ordBaseStt?.name() == 'DELIVERING' ? '배송중' : (order.ordBaseStt?.name() == 'DELIVERED' ? '배송완료' : '주문취소'))}">상태
                        </span>
                    </div>

                    <div class="action-btns">
                        <a class="btn-edit" th:href="@{/order/detail(id=${order.ordBaseId})}">상세보기</a>
                    </div>

                </div>
            </div>

            <footer class="admin-chat-shell admin-chat-shell--pagination">
                <p class="page-info">
                    Page [[${orders.number + 1}]] of [[${orders.totalPages}]] (Total [[${orders.totalElements}]] orders)
                </p>

                <div class="page-numbers">
                    <a th:href="@{/admin/order/list(page=${orders.number - 1})}"
                       th:classappend="${!orders.hasPrevious()} ? 'disabled'"
                       class="page-btn">이전</a>

                    <th:block th:with="start=${(orders.number/5)*5}, end=${(start + 4 < orders.totalPages) ? start + 4 : orders.totalPages - 1}">
                        <a th:each="page : ${#numbers.sequence(start, end)}"
                           th:href="@{/admin/order/list(page=${page})}"
                           th:text="${page + 1}"
                           th:classappend="${page == orders.number} ? 'active'"
                           class="page-number-btn"></a>
                    </th:block>

                    <a th:href="@{/admin/order/list(page=${orders.number + 1})}"
                       th:classappend="${!orders.hasNext()} ? 'disabled'"
                       class="page-btn">다음</a>
                </div>
            </footer>
        </section>

        <div id="orderTrackingModal" class="modal-overlay" style="display: none;">
            <div class="modal-container">
                <header class="modal-header">
                    <div class="header-main">
                        <h2 class="modal-title">Shipment Tracking</h2>
                    </div>
                    <button class="btn-close" onclick="closeModal()">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </header>

                <div class="modal-body">
                </div>

                <footer class="modal-footer">
                    <button class="btn-solid" onclick="closeModal()">CLOSE</button>
                </footer>
            </div>
        </div>

        <script>

        </script>
    </section>
</th:block>
</html>
