<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('주문 상세', 'order', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | Order Details</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{member/mypage/mypage-sidebar :: sidebar('Order', 'Order-Detail')}"></div>
</th:block>

<th:block th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/order/order.css}">

    <div class="order-page-container">

        <div th:if="${error}" style="background: #fee2e2; color: #b91c1c; padding: 16px; margin-bottom: 24px; font-weight: bold; text-align: center;">
            <span th:text="${error}"></span>
        </div>

        <div th:if="${message}" style="background: #dcfce7; color: #15803d; padding: 16px; margin-bottom: 24px; font-weight: bold; text-align: center;">
            <span th:text="${message}"></span>
        </div>

        <header class="hero-section">
            <div class="user-meta-bar" style="margin-bottom: 16px;">
                <span class="badge"
                      th:classappend="${order.ordBaseStt?.name() == 'PREPARING' ? 'badge-secondary' :
                                      (order.ordBaseStt?.name() == 'SHIPPING' ? 'badge-yellow' :
                                      (order.ordBaseStt?.name() == 'DELIVERED' ? 'badge-success' : 'badge-danger'))}"
                      th:text="${order.ordBaseStt?.name() == 'PREPARING' ? '상품 준비중' :
                               (order.ordBaseStt?.name() == 'SHIPPING' ? '배송중' :
                               (order.ordBaseStt?.name() == 'DELIVERED' ? '배송완료' : '주문 취소'))}">주문 상태
                </span>
                <span style="font-size: 12px; color: var(--text-muted); font-weight: bold;"
                      th:text="${#temporals.format(order.ordBaseCreDt, 'yyyy-MM-dd HH:mm')}">주문 생성일</span>
            </div>

            <h3 class="hero-title">주문 번호 <span th:text="${order.ordBaseNo != null ? order.ordBaseNo : '#' + order.ordBaseId}">주문번호 ex</span></h3>
        </header>

        <form id="updateForm" th:action="@{/order/update/{id}(id=${order.ordBaseId})}" method="post">
            <div class="detail-card">
                <h2 class="detail-section-title">Shipping Information</h2>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="input-group">
                        <label>수령자 이름</label>
                        <input type="text" name="ordBaseRcvNm" class="input-field" th:value="${order.ordBaseRcvNm}"
                               th:readonly="${order.ordBaseStt?.name() != 'PREPARING'}">
                    </div>
                    <div class="input-group">
                        <label>수령자 연락처</label>
                        <input type="text" class="input-field" placeholder="010-0000-0000"
                               th:readonly="${order.ordBaseStt?.name() != 'PREPARING'}">
                    </div>
                </div>

                <div class="input-group">
                    <label>기본 주소</label>
                    <input type="text" name="ordBaseAdr" class="input-field" th:value="${order.ordBaseAdr}"
                           th:readonly="${order.ordBaseStt?.name() != 'PREPARING'}">
                </div>

                <div class="input-group">
                    <label>상세 주소</label>
                    <input type="text" name="ordBaseAdrDt" class="input-field" th:value="${order.ordBaseAdrDt}"
                           th:readonly="${order.ordBaseStt?.name() != 'PREPARING'}">
                </div>


                <div class="input-group">
                    <label>주문 요청사항</label>
                    <input type="text" name="ordBaseMsg" class="input-field" th:value="${order.ordBaseMsg}"
                           th:readonly="${order.ordBaseStt?.name() != 'PREPARING'}">
                </div>

                <div class="input-group">
                    <label>총 결제금액</label>
                    <input type="text" readonly>
                </div>

                <div class="input-group">
                    <label>총 결제금액</label>
                    <input type="text" readonly>
                </div>

            </div>

            <div class="action-bar">
                <a th:href="@{/order/list}" class="btn-outline">목록으로 돌아가기</a>

                <div style="display: flex; gap: 16px;">
                    <button type="button" class="btn-danger" th:if="${order.ordBaseStt?.name() == 'PREPARING'}" onclick="cancelOrder()">주문 취소</button>
                    <button type="submit" class="btn-apply" th:if="${order.ordBaseStt?.name() == 'PREPARING'}">배송 정보 저장</button>
                </div>
            </div>
        </form>

        <form id="cancelForm" th:action="@{/order/cancel/{id}(id=${order.ordBaseId})}" method="post" style="display: none;">
        </form>

    </div>

    <script>
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        function cancelOrder() {
            if (confirm("정말로 이 주문을 취소하시겠습니까? (이 작업은 되돌릴 수 없습니다.)")) {
                document.getElementById('cancelForm').submit();
            }
        }
    </script>
</th:block>
</html>
