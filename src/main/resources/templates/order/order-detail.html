<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('주문 상세', 'order', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | Order Details</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{member/mypage/mypage-sidebar :: sidebar('Order', 'Order-Detail')}"></div>
</th:block>

<th:block th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/chat/admin-chat.css}">
    <style>
        .order-management-list .admin-chat-list-head,
        .order-management-list .admin-chat-row {
            display: grid !important;
            grid-template-columns: minmax(60px, 1.0fr) minmax(40px, 1.0fr) minmax(120px, 1.7fr) minmax(200px, 2fr) minmax(60px, 0.9fr) minmax(60px, 1fr) !important;
            gap: 1rem;
            align-items: center;
        }

        .order-management-list .action-btns {
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .order-management-list .btn-detail {
            background-color: #e2e2e2;
            color: #1a1c1c;
            border: none;
            padding: 4px 8px;
            font-size: 0.55rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 45px;
            height: 24px;
            transition: all 0.2s ease;
        }
        .order-management-list .btn-detail:hover { background-color: #d1d1d1; }

        .order-management-list .btn-edit {
            background-color: #1a1c1c;
            color: #ffffff;
            border: none;
            padding: 4px 8px;
            font-size: 0.55rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 45px;
            height: 24px;
            transition: all 0.2s ease;
        }
        .order-management-list .btn-edit:hover { background-color: #333; }

        .order-management-list .admin-chat-row__amount {
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            padding-right: 10px;
        }
    </style>

    <section class="admin-chat-page admin-chat-list-page order-management-list">
        <header class="admin-chat-shell admin-chat-shell--header">
            <div class="admin-chat-shell__heading">
                <span class="admin-chat-kicker">ORDER DETAIL</span>
                <h2 class="admin-chat-title">주문 상세</h2>

                <div class="admin-chat-shell__rule">
                    <span></span>
                </div>
            </div>
        </header>

            <section class="admin-chat-shell admin-chat-shell--list">
                <div class="admin-chat-list-head" aria-hidden="true">
                    <div>수령인</div>
                    <div>운송회사/운송장번호</div>
                    <div>배송지 주소</div>
                    <div>품목 수</div>
                    <div style="text-align: center;">배송 상태</div>
                    <div style="text-align: center;">관리</div>
                </div>

                <div class="admin-chat-list-body">
                    <th:block th:if="${#lists.size(order.shipmentResponses) == 1}">
                        <div th:with="ship=${order.shipmentResponses[0]}" class="admin-chat-row">
                            <div class="admin-chat-row__text">
                                <h2 th:text="${ship.shRcvNm}">수령자 이름</h2>
                            </div>

                            <div class="admin-chat-row__text">
                                <p th:text="${ship.shCarCd}">운송회사코드</p>
                                <p th:text="${ship.shTraNo}">운송장번호</p>
                            </div>

                            <div class="admin-chat-row__text">
                                <p th:text="${ship.shAdr}">기본 주소</p>
                                <p th:text="${ship.shAdrDt}">상세 주소</p>
                            </div>

                            <div class="admin-chat-row__text">
                                <p style="text-align: center;" th:each="item : ${ship.shipmentItems}" th:text="${item.ordItmNm} + ' (' + ${item.shQn} + '개)'">물품명 (수량)</p>
                            </div>

                            <div class="admin-chat-row__status">
                                <span class="admin-chat-badge"
                                                   th:classappend="${ship.shStt?.name() == 'PREPARING' ? 'admin-chat-badge--open' : (ship.shStt?.name() == 'DELIVERING' || ship.shStt?.name() == 'DELIVERED' ? 'admin-chat-badge--ongoing' : 'admin-chat-badge--closed')}"
                                                   th:text="${ship.shStt?.name() == 'PREPARING' ? '배송준비' : (ship.shStt?.name() == 'DELIVERING' ? '배송중' : (ship.shStt?.name() == 'DELIVERED' ? '배송완료' : '주문취소'))}">상태
                                </span>
                            </div>

                            <div class="action-btns">
                                <a class="btn-detail" th:classappend="${order.ordBaseStt.name() == 'PREPARING' ? 'btn-disabled' : ''}" th:onclick="|loadShipmentDetail('/api/shipments/list?ordId=${order.ordBaseId}')|">
                                    배송 현황
                                </a>

                                <button th:if="${order.ordBaseStt.name() == 'PREPARING'}" class="btn-edit" th:onclick="cancelOrder([[${order.ordBaseId}]])">주문 취소</button>
                            </div>

                        </div>
                    </th:block>

                    <th:block th:if="${#lists.size(order.shipmentResponses) > 1}">
                        <div th:each="ship, stat : ${order.shipmentResponses}" class="admin-chat-row">
                            <div class="admin-chat-row__text">
                                <h2 th:text="${ship.shRcvNm}">수령자 이름</h2>
                            </div>

                            <div class="admin-chat-row__text">
                                <p th:text="${ship.shCarCd}">운송회사코드</p>
                                <p th:text="${ship.shTraNo}">운송장번호</p>
                            </div>

                            <div class="admin-chat-row__text">
                                <p th:text="${ship.shAdr}">기본 주소</p>
                                <p th:text="${ship.shAdrDt}">상세 주소</p>
                            </div>

                            <div class="admin-chat-row__text">
                                <p style="text-align: center;" th:each="item : ${ship.shipmentItems}" th:text="${item.ordItmNm} + ' (' + ${item.shQn} + '개)'">물품명 (수량)</p>
                            </div>

                            <div class="admin-chat-row__status">
                                <span class="admin-chat-badge"
                                      th:classappend="${ship.shStt?.name() == 'PREPARING' ? 'admin-chat-badge--open' : (ship.shStt?.name() == 'DELIVERING' || ship.shStt?.name() == 'SHIPPING' ? 'admin-chat-badge--ongoing' : 'admin-chat-badge--closed')}"
                                      th:text="${ship.shStt?.name() == 'PREPARING' ? '배송준비' : (ship.shStt?.name() == 'DELIVERING' || ship.shStt?.name() == 'SHIPPING' ? '배송중' : (ship.shStt?.name() == 'DELIVERED' ? '배송완료' : '주문취소'))}">상태
                                </span>
                            </div>

                            <div class="action-btns">
                                <a class="btn-detail" th:classappend="${order.ordBaseStt.name() == 'PREPARING' ? 'btn-disabled' : ''}" th:onclick="|loadShipmentDetail('/api/shipments/list?ordId=${order.ordBaseId}')|">
                                    배송 현황
                                </a>

                                <button th:if="${order.ordBaseStt.name() == 'PREPARING'}" th:onclick="cancelOrder([[${order.ordBaseId}]])" class="btn-edit" type="button">주문 취소</button>
                            </div>
                        </div>
                    </th:block>

                    <th:block th:if="${#lists.isEmpty(order.shipmentResponses)}">
                        <div class="admin-chat-row">
                            <span style="display: block; width: 100%; text-align: center;">배송지 정보가 없습니다.</span>
                        </div>
                    </th:block>

                </div>

                <form th:id="'cancelForm-' + ${order.ordBaseId}" th:action="@{/order/cancel}"
                      method="post"
                      style="display: none;">
                    <input type="hidden" name="ordId" th:value="${order.ordBaseId}" />
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                </form>

                <footer class="admin-chat-shell admin-chat-shell--pagination">
                    <p class="page-info" id="page-info"></p>
                    <div class="page-numbers" id="page-numbers"></div>
                </footer>
            </section>

        <script th:inline="javascript">
            function cancelOrder(ordId) {
                if (!ordId) return;
                if (confirm("이 주문을 정말로 취소하시겠습니까?\n(모든 배송지의 발송이 취소됩니다.)")) {
                    const form = document.getElementById('cancelForm-' + ordId);
                    console.log(form);
                    if (form) form.submit();
                }
            }

            function loadShipmentDetail(url) {
                const modal = document.getElementById('orderTrackingModal');
                const contentArea = modal.querySelector('.modal-body');
                if (!modal || !contentArea) return;

                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';

                fetch(url)
                    .then(response => {
                        if (!response.ok) throw new Error("배송 정보를 찾을 수 없습니다.");
                        return response.text();
                    })
                    .then(html => {
                        contentArea.innerHTML = html;
                    })
                    .catch(err => {
                        console.error(err);
                        alert(err.message);
                        closeModal();
                    });
            }

            function closeModal() {
                const modal = document.getElementById('orderTrackingModal');
                if (modal) {
                    modal.style.display = 'none';
                    document.body.style.overflow = 'auto';
                }
            }

            window.addEventListener('click', function(event) {
                const modal = document.getElementById('orderTrackingModal');
                if (event.target === modal) {
                    closeModal();
                }
            });
        </script>
    </section>
</th:block>
</html>
