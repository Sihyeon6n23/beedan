<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"

      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('주문 상세', 'order', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | Order Details</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{member/mypage/mypage-sidebar :: sidebar('Order', 'Order-Detail')}"></div>
</th:block>

<th:block th:fragment="content">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" th:href="@{/css/chat/admin-chat.css}">
    <link rel="stylesheet" th:href="@{/css/order/order-detail.css}">

    <style>
        .order-management-list .admin-chat-list-head,
        .order-management-list .admin-chat-row {
            display: grid !important;
            grid-template-columns: minmax(70px, 1.8fr) minmax(40px, 0.8fr) minmax(220px, 3.2fr) minmax(60px, 0.6fr) minmax(60px, 0.9fr) !important;
            gap: 1rem;
            align-items: center;
        }

        .swiper-button-next, .swiper-button-prev {
            color: #333;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            top: 50%;
            transform: translateY(80%);
        }

        .swiper-button-next::after, .swiper-button-prev::after {
            font-size: 20px;
        }

        .swiper-button-next:hover, .swiper-button-prev:hover {
            background: rgba(255, 255, 255, 0);
        }
    </style>

    <section class="admin-chat-page admin-chat-list-page order-management-list">
        <header class="admin-chat-shell admin-chat-shell--header">
            <div class="admin-chat-shell__heading">
                <span class="admin-chat-kicker">ORDER DETAIL</span>
                <h2 class="admin-chat-title">주문 상세</h2>

                <div class="admin-chat-shell__rule">
                    <span></span>
                </div>

                <div class="btn-back-to-list">
                    <a th:href="@{/order/list}" class="btn-back-to-list">
                        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>목록으로
                    </a>
                </div>
            </div>
        </header>

            <section class="admin-chat-shell admin-chat-shell--list">
                <div class="admin-chat-list-head" aria-hidden="true">
                    <div>수령자</div>
                    <div>상품 정보</div>
                    <div></div>
                    <div style="text-align: center;">배송 상태</div>
                    <div style="text-align: center;">관리</div>
                </div>

                <div class="admin-chat-list-body">
                    <th:block th:if="${#lists.size(order.shipmentResponses) == 1}">
                        <div th:with="ship=${order.shipmentResponses[0]}" class="admin-chat-row">
                            <div class="admin-chat-row__text">
                                <h2 th:text="${ship.shRcvNm}">수령자 이름</h2>
                                <p th:text="${ship.shAdr}">기본 주소</p>
                                <p th:text="${ship.shAdrDt}">상세 주소</p>
                            </div>


                            <div class="swiper mySwiper">
                                <div class="swiper-wrapper">
                                    <div th:each="item : ${ship.shipmentItems}" class="swiper-slide" style="display: flex; align-items: center; justify-content: center;">

                                        <img th:src="${item.ordItmThumbUrl}" th:alt="${item.ordItmNm}" class="order-thumb-img" th:title="${item.ordItmNm}" style="max-width: 100%; max-height: 100%; object-fit: contain;">

                                    </div>
                                </div>
                                <div class="swiper-button-next"></div>
                                <div class="swiper-button-prev"></div>
                            </div>


                            <div class="admin-chat-row__text">
                                <p style="text-align: left;" th:each="item : ${ship.shipmentItems}" th:text="${item.ordItmNm} + ' (' + ${item.shQn} + '개)'">물품명 (수량)</p>
                            </div>

                            <div class="admin-chat-row__status">
                                <span class="admin-chat-badge"
                                                   th:classappend="${ship.shCanYn ? 'admin-chat-badge--closed' : (ship.shStt?.name() == 'PREPARING' ? 'admin-chat-badge--open' : (ship.shStt?.name() == 'DELIVERING' || ship.shStt?.name() == 'DELIVERED' ? 'admin-chat-badge--ongoing' : 'admin-chat-badge--closed'))}"
                                                   th:text="${ship.shCanYn ? '주문취소' : (ship.shStt?.name() == 'PREPARING' ? '배송준비' : (ship.shStt?.name() == 'DELIVERING' ? '배송중' : (ship.shStt?.name() == 'SHIPPING' ? '통관진행' : '배송완료')))}">상태
                                </span>
                            </div>

                            <div class="action-btns">
                                <button type="button" class="btn-detail" th:disabled="${order.ordBaseStt.name() == 'CANCELED'}" th:onclick="|openShipmentModal('${ship.shId}')|">
                                    배송 현황
                                </button>

                                <button th:if="${order.ordBaseStt.name() == 'PREPARING'}" class="btn-edit" th:onclick="cancelOrder([[${order.ordBaseId}]])">주문 취소</button>
                            </div>
                        </div>
                    </th:block>


                    <th:block th:if="${#lists.size(order.shipmentResponses) > 1}">
                        <div th:each="ship, stat : ${order.shipmentResponses}" class="admin-chat-row">
                            <div class="admin-chat-row__text">
                                <h2 th:text="${ship.shRcvNm}">수령자 이름</h2>
                                <p th:text="${ship.shAdr}">기본 주소</p>
                                <p th:text="${ship.shAdrDt}">상세 주소</p>
                            </div>

                            <div class="swiper mySwiper">
                                <div class="swiper-wrapper">
                                    <div th:each="item : ${ship.shipmentItems}" class="swiper-slide" style="display: flex; align-items: center; justify-content: center;">

                                        <img th:src="${item.ordItmThumbUrl}" th:alt="${item.ordItmNm}" class="order-thumb-img" th:title="${item.ordItmNm}" style="max-width: 100%; max-height: 100%; object-fit: contain;">

                                    </div>
                                </div>
                                <div class="swiper-button-next"></div>
                                <div class="swiper-button-prev"></div>
                            </div>

                            <div class="admin-chat-row__text">
                                <p style="text-align: left;" th:each="item : ${ship.shipmentItems}" th:text="${item.ordItmNm} + ' (' + ${item.shQn} + '개)'">물품명 (수량)</p>
                            </div>

                            <div class="admin-chat-row__status">
                                <span class="admin-chat-badge"
                                      th:classappend="${ship.shCanYn ? 'admin-chat-badge--closed' : (ship.shStt?.name() == 'PREPARING' ? 'admin-chat-badge--open' : (ship.shStt?.name() == 'DELIVERING' || ship.shStt?.name() == 'SHIPPING' ? 'admin-chat-badge--ongoing' : 'admin-chat-badge--closed'))}"
                                      th:text="${ship.shCanYn ? '주문취소' : (ship.shStt?.name() == 'PREPARING' ? '배송준비' : (ship.shStt?.name() == 'DELIVERING' || ship.shStt?.name() == 'SHIPPING' ? '배송중' : (ship.shStt?.name() == 'DELIVERED' ? '배송완료' : '주문취소')))}">상태
                                </span>
                            </div>

                            <div class="action-btns">
                                <button type="button" class="btn-detail" th:disabled="${order.ordBaseStt.name() == 'CANCELED'}" th:onclick="openShipmentModal([[${ship.shId}]])">
                                    배송 현황
                                </button>

                                <button th:if="${order.ordBaseStt.name() == 'PREPARING'}" th:onclick="cancelOrder([[${order.ordBaseId}]])" class="btn-edit" type="button">주문 취소</button>
                            </div>
                        </div>
                    </th:block>

                    <th:block th:if="${#lists.isEmpty(order.shipmentResponses)}">
                        <div class="admin-chat-row">
                            <span style="display: block; width: 100%; text-align: center;">배송지 정보가 없습니다.</span>
                        </div>
                    </th:block>

                </div>

                <form th:id="'cancelForm-' + ${order.ordBaseId}" th:action="@{/order/cancel}"
                      method="post"
                      style="display: none;">
                    <input type="hidden" name="ordId" th:value="${order.ordBaseId}" />
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                </form>

                <footer class="admin-chat-shell admin-chat-shell--pagination">
                    <p class="page-info" id="page-info"></p>
                    <div class="page-numbers" id="page-numbers"></div>
                </footer>
            </section>

            <div id="orderTrackingModal" class="modal-overlay" style="display: none;">
                <div class="modal-container">
                    <header class="modal-header">
                        <div class="header-main">
                            <h2 class="modal-title">Shipment Tracking</h2>
                        </div>
                        <button class="btn-close" onclick="closeModal()">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </header>

                    <div class="modal-body">
                    </div>

                    <footer class="modal-footer">
                        <button class="btn-solid" onclick="closeModal()">CLOSE</button>
                    </footer>
                </div>
            </div>

        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
        <script th:src="@{/js/order/order-detail.js}"></script>
    </section>
</th:block>
</html>
