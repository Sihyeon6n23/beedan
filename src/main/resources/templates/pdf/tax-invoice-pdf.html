<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style>
        @page { size: A4; margin: 40px 50px; }
        body { font-family: 'NotoSansKR', sans-serif; font-size: 10px; color: #1a1a1a; line-height: 1.6; }
        h1 { font-size: 24px; font-weight: 800; text-align: center; margin: 0 0 6px 0; }
        .subtitle { text-align: center; font-size: 10px; color: #737373; margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        th, td { border: 1px solid #999; padding: 6px 10px; font-size: 9px; }
        th { background: #f0f0f0; font-weight: 700; text-align: center; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .section-title { font-size: 11px; font-weight: 700; margin: 20px 0 8px 0; padding-bottom: 4px; border-bottom: 2px solid #333; }
        .total-row td { font-weight: 800; font-size: 11px; background: #f9f9f9; }
        .info-table th { width: 100px; text-align: left; background: #f5f5f5; }
        .info-table td { text-align: left; }
        .stamp { text-align: right; margin-top: 30px; font-size: 9px; color: #737373; }
    </style>
</head>
<body>

<h1>세 금 계 산 서</h1>
<div class="subtitle">TAX INVOICE</div>

<!-- 공급자 / 공급받는자 -->
<table>
    <tr>
        <th colspan="2" style="background:#e0e0e0;">공급자</th>
        <th colspan="2" style="background:#e0e0e0;">공급받는자</th>
    </tr>
    <tr>
        <th style="width:80px;">상호</th>
        <td>BEEDAN</td>
        <th style="width:80px;">상호</th>
        <td th:text="${member != null and member.memBizTtl != null ? member.memBizTtl : '-'}">-</td>
    </tr>
    <tr>
        <th>사업자번호</th>
        <td>000-00-00000</td>
        <th>사업자번호</th>
        <td th:text="${member != null and member.memBizNo != null ? member.memBizNo : '-'}">-</td>
    </tr>
    <tr>
        <th>대표자</th>
        <td>BEEDAN</td>
        <th>대표자</th>
        <td th:text="${member != null and member.memNm != null ? member.memNm : '-'}">-</td>
    </tr>
    <tr>
        <th>주소</th>
        <td>서울특별시</td>
        <th>주소</th>
        <td th:text="${member != null and member.memBizAdr != null ? member.memBizAdr : '-'}">-</td>
    </tr>
</table>

<!-- 거래 정보 -->
<div class="section-title">거래 정보</div>
<table class="info-table">
    <tr>
        <th>견적 번호</th>
        <td th:text="${quoteBase.quCd}">QU0000</td>
        <th>거래 ID</th>
        <td th:text="${payment != null and payment.pyPgNm != null ? payment.pyPgNm : '-'}">-</td>
    </tr>
    <tr>
        <th>결제일</th>
        <td th:text="${payment != null and payment.pyPdAt != null ? #temporals.format(payment.pyPdAt, 'yyyy년 MM월 dd일 HH:mm') : '-'}">-</td>
        <th>결제 수단</th>
        <td th:text="${payment != null and payment.pyMt != null ? (payment.pyMt.name() == 'CARD' ? '법인카드' : '무통장입금') : '-'}">-</td>
    </tr>
</table>

<!-- 품목 -->
<div class="section-title">품목 내역</div>
<table>
    <thead>
        <tr>
            <th class="text-center" style="width:30px;">No.</th>
            <th>품목명</th>
            <th class="text-center" style="width:50px;">수량</th>
            <th class="text-right" style="width:100px;">공급가액</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="detail, idx : ${details}">
            <td class="text-center" th:text="${idx.count}">1</td>
            <td th:text="${detail.stNm}">상품명</td>
            <td class="text-center" th:text="${detail.quDtQn}">0</td>
            <td class="text-right" th:text="${detail.quDtPr != null ? '₩' + #numbers.formatInteger(detail.quDtPr, 3, 'COMMA') : '-'}">₩0</td>
        </tr>
    </tbody>
</table>

<!-- 금액 -->
<div class="section-title">금액 명세</div>
<table>
    <tr>
        <th>품목 대금</th>
        <td class="text-right" th:text="${'₩' + #numbers.formatInteger(itemTotalKrw, 3, 'COMMA')}">₩0</td>
    </tr>
    <tr>
        <th>물류 비용</th>
        <td class="text-right" th:text="${'₩' + #numbers.formatInteger(intShipFeeOnly.add(domesticFee), 3, 'COMMA')}">₩0</td>
    </tr>
    <tr>
        <th>큐레이션 수수료</th>
        <td class="text-right" th:text="${'₩' + #numbers.formatInteger(serviceFeeAm, 3, 'COMMA')}">₩0</td>
    </tr>
    <tr>
        <th>관세 및 부가세</th>
        <td class="text-right" th:text="${'₩' + #numbers.formatInteger(totalDutyVat, 3, 'COMMA')}">₩0</td>
    </tr>
    <tr class="total-row">
        <td style="text-align:center; font-weight:800;">합계</td>
        <td class="text-right" th:text="${'₩' + #numbers.formatInteger(calculatedTotal, 3, 'COMMA')}">₩0</td>
    </tr>
</table>

<div class="stamp">
    <p>위 금액을 청구합니다.</p>
    <p th:text="${payment != null and payment.pyPdAt != null ? #temporals.format(payment.pyPdAt, 'yyyy년 MM월 dd일') : ''}"></p>
    <p>BEEDAN (인)</p>
</div>

</body>
</html>
