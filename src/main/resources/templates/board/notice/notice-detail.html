<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('COMMUNICATIONS', 'Notice Management', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | 공지사항 상세</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{member/mypage/mypage-sidebar :: sidebar('notice','notice-list')}"></div>
</th:block>

<th:block th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/board/inquiry.css}">

    <section class="inquiry-page inquiry-detail-page">
        <header class="inquiry-shell inquiry-shell--header">
            <div class="inquiry-shell__heading">
                <span class="inquiry-kicker">Notice Detail</span>
                <h2 class="inquiry-title">공지사항 상세</h2>
            </div>
            <div class="inquiry-shell__rule"><span></span></div>
        </header>

        <article class="inquiry-detail-article">
            <div class="inquiry-detail-article__utility">
                <a class="inquiry-detail-back" th:href="@{/notice/list}">
                    <span class="material-symbols-outlined">arrow_back</span>
                    <span>목록으로</span>
                </a>
            </div>

            <div class="inquiry-detail-article__head">
                <div class="inquiry-detail-article__title-row">
                    <h3 class="inquiry-detail-article__title" th:text="${notice.brdTtl}">제목</h3>
                    <span th:if="${notice.brdFixYn}" class="inquiry-badge inquiry-badge--received">중요공지</span>
                </div>
                <div class="inquiry-detail-article__meta">
                    <span th:text="${#authorization.expression('hasAnyRole(''ADMIN'', ''ROOT'')')} ? ${notice.memNm} : '관리자'">작성자</span>
                    <span th:text="${#temporals.format(notice.brdCreDt, 'yyyy.MM.dd HH:mm')}">날짜</span>
                    <span>조회수 <em th:text="${notice.brdVstCnt}" style="font-style: normal; font-weight: 600;">0</em></span>
                </div>
            </div>

            <div class="inquiry-detail-article__body">
                <div class="inquiry-detail-article__content" th:utext="${notice.brdCon}">내용</div>

                <div th:replace="~{fragments/file/file-list :: display(${fileList})}"></div>
            </div>

            <div class="inquiry-detail-article__footer" th:if="${canModify}">
                <div class="inquiry-detail-actions">
                    <a th:href="@{/notice/edit(id=${notice.brdId})}" class="inquiry-detail-action inquiry-detail-action--primary">공지 수정</a>
                    <form th:action="@{/notice/delete}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                        <input type="hidden" name="brdId" th:value="${notice.brdId}">
                        <button type="submit" class="inquiry-detail-action">공지 삭제</button>
                    </form>
                </div>
            </div>

            <nav class="inquiry-detail-nav mt-12 border-t border-zinc-200">
                <div class="flex items-center p-4 border-b border-zinc-100 group" th:if="${notice.prevNotice != null}">
                    <span class="text-zinc-400 text-xs w-20 flex-shrink-0 font-bold uppercase tracking-wider">Prev</span>
                    <a th:href="@{/notice/detail(id=${notice.prevNotice.id})}"
                       class="text-sm text-secondary hover:text-primary transition-colors truncate"
                       th:text="${notice.prevNotice.title}">이전 공지사항 제목입니다.</a>
                </div>

                <div class="flex items-center p-4 border-b border-zinc-100 group" th:if="${notice.nextNotice != null}">
                    <span class="text-zinc-400 text-xs w-20 flex-shrink-0 font-bold uppercase tracking-wider">Next</span>
                    <a th:href="@{/notice/detail(id=${notice.nextNotice.id})}"
                       class="text-sm text-secondary hover:text-primary transition-colors truncate"
                       th:text="${notice.nextNotice.title}">다음 공지사항 제목입니다.</a>
                </div>
            </nav>
        </article>
    </section>
</th:block>
</html>
