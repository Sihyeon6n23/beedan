<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          null,
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | 공지사항</title>

<th:block th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/board/notice.css}">
    <link rel="stylesheet" th:href="@{/css/board/board-module.css}">

    <section class="inquiry-page inquiry-list-page"
             th:with="currentListUrl=@{/notice/list(
             page=${response.pagination.page},
             size=${response.pagination.size},
             keyword=${searchDto.keyword},
             searchType=${searchDto.searchType}
         )}">
        <header class="inquiry-shell inquiry-shell--header">
            <div class="inquiry-shell__heading">
                <span class="inquiry-kicker">Notice Board</span>
                <h2 class="inquiry-title">공지사항</h2>
            </div>
            <div class="inquiry-shell__rule"><span></span></div>
        </header>

        <section class="inquiry-shell inquiry-shell--toolbar">
            <div class="inquiry-toolbar">
                <div class="inquiry-toolbar__actions" style="margin-left: auto; display: flex; gap: 0.75rem; align-items: center;">

                    <div th:replace="~{fragments/board/board-module :: searchBar(${boardUri}, ${searchDto}, ${searchTypes})}"></div>

                    <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''ROOT'')')}"
                       th:href="@{/notice/write}" class="inquiry-action-link">
                        <span class="material-symbols-outlined">edit_square</span>
                        <span>공지 작성</span>
                    </a>
                </div>
            </div>
        </section>

        <section class="inquiry-shell inquiry-shell--list">
            <div class="inquiry-list-head" aria-hidden="true">
                <div>번호</div>
                <div>구분</div>
                <div>제목</div>
                <div>첨부</div>
                <div>작성자</div>
                <div>조회수</div>
                <div>등록일</div>
            </div>

            <div class="inquiry-list-body">
                <a th:each="fixed : ${response.fixedBoards}"
                   th:href="@{/notice/detail(id=${fixed.brdId}, returnUrl=${currentListUrl})}"
                   class="inquiry-row">
                    <div class="inquiry-row__no" style="color: #ef4444; font-weight: bold;">-</div>
                    <div class="inquiry-row__top"><span class="inquiry-badge inquiry-badge--received">TOP</span></div>
                    <div class="inquiry-row__primary">
                        <h2 th:text="${fixed.brdTtl}">고정 공지 제목</h2>
                    </div>
                    <div class="inquiry-row__file">
                        <span th:if="${fixed.fileYn}" class="material-symbols-outlined" style="font-size: 18px; color: #94a3b8;">
                            attach_file
                        </span>
                    </div>
                    <div class="inquiry-row__writer">
                        <span th:text="${#authorization.expression('hasAnyRole(''ADMIN'', ''ROOT'')')} ? ${fixed.memNm} : '관리자'">작성자</span>
                    </div>
                    <div class="inquiry-row__hit">
                        <span th:text="${fixed.brdHit}">0</span>
                    </div>
                    <div class="inquiry-row__time">
                        <span th:text="${#temporals.format(fixed.brdCreDt, 'yyyy.MM.dd')}">날짜</span>
                    </div>
                </a>

                <a th:each="board, iterStat : ${response.pagination.content}"
                   th:href="@{/notice/detail(id=${board.brdId}, returnUrl=${currentListUrl})}"
                   class="inquiry-row">
                    <div class="inquiry-row__no" th:text="${response.pagination.totalElements - (response.pagination.page * response.pagination.size) - iterStat.index}">1</div>
                    <div class="inquiry-row__top" style="color: #94a3b8; font-size: 0.85rem;">일반</div>
                    <div class="inquiry-row__primary">
                        <h2 th:text="${board.brdTtl}">일반 공지 제목</h2>
                    </div>
                    <div class="inquiry-row__file">
                        <span th:if="${board.fileYn}" class="material-symbols-outlined" style="font-size: 18px; color: #94a3b8;">
                            attach_file
                        </span>
                    </div>
                    <div class="inquiry-row__writer">
                        <span th:text="${#authorization.expression('hasAnyRole(''ADMIN'', ''ROOT'')')} ? ${board.memNm} : '관리자'">작성자</span>
                    </div>
                    <div class="inquiry-row__hit">
                        <span th:text="${board.brdHit}">0</span>
                    </div>
                    <div class="inquiry-row__time">
                        <span th:text="${#temporals.format(board.brdCreDt, 'yyyy.MM.dd')}">날짜</span>
                    </div>
                </a>
                <th:block th:with="totalCount=${#lists.size(response.fixedBoards) + #lists.size(response.pagination.content)}">
                    <th:block th:if="${totalCount < 10}"
                              th:each="spacer : ${#numbers.sequence(1, 10 - totalCount)}">
                        <div class="inquiry-row-spacer" aria-hidden="true" style="min-height: 2.68rem; border-bottom: 1px solid #f1f5f9;"></div>
                    </th:block>
                </th:block>
                <div class="inquiry-empty-state" th:if="${#lists.isEmpty(response.pagination.content)}">
                    <strong>표시할 내용이 없습니다.</strong>
                    <p>등록된 공지사항이 없습니다.</p>
                </div>
            </div>
        </section>

        <div th:replace="~{fragments/board/board-module :: pagination(${response.pagination}, '/notice/list', ${searchDto})}"></div>
    </section>
</th:block>
</html>
