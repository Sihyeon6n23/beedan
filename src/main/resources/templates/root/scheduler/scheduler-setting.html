<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('SCHEDULER', 'setting', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | Scheduler Setting</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{root/root-sidebar :: sidebar('scheduler', '')}"></div>
</th:block>

<th:block th:fragment="content">
    <div class="flex-grow mx-auto px-6 py-12 max-w-5xl">
        <div class="mb-12 flex items-baseline gap-4">
            <h1 class="text-5xl font-black tracking-tighter text-on-surface uppercase">스케쥴러 설정</h1>
            <span class="text-sm font-medium text-primary tracking-widest uppercase">(Scheduler Settings)</span>
        </div>

        <div class="bg-surface-container-lowest shadow-sm border-l-8 border-primary-container p-10 space-y-12">

            <form id="policyForm" th:action="@{/root/scheduler/save}" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-12">
                <!-- 자동 크롤링 설정 -->
                <section class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">schedule</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">1. 자동 크롤링</h2>
                    </div>

                    <!-- ON/OFF 라디오 -->
                    <div class="flex items-center gap-8 py-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="autoCrawlingEnabled" value="true"
                                   th:checked="${setting.autoCrawlingEnabled}" ...>
                            <span class="text-sm font-bold">ON</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="autoCrawlingEnabled" value="false"
                                   th:checked="${!setting.autoCrawlingEnabled}" ...>
                            <span class="text-sm font-bold">OFF</span>
                        </label>
                    </div>

                    <!-- 시작 일시 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">시작 일시</label>
                        <input type="datetime-local" name="autoCrawlingStartDt"
                               th:value="${setting.autoCrawlingStartDt}" ...>
                    </div>

                    <!-- 주기 selectbox -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">크롤링 주기</label>
                        <select name="autoCrawlingInterval" ...>
                            <option value="6" th:selected="${setting.autoCrawlingInterval == '6'}">6시간</option>
                            <option value="12" th:selected="${setting.autoCrawlingInterval == '12'}">12시간</option>
                            <option value="24" th:selected="${setting.autoCrawlingInterval == '24'}">1일</option>
                            <option value="72" th:selected="${setting.autoCrawlingInterval == '72'}">3일</option>
                            <option value="168" th:selected="${setting.autoCrawlingInterval == '168'}">7일</option>
                            <option value="720" th:selected="${setting.autoCrawlingInterval == '720'}">30일</option>
                        </select>
                    </div>

                    <!-- 마지막 크롤링 시간 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">마지막 크롤링 시간</label>
                        <input type="text" readonly
                               th:value="${setting.lastCrawlingRunTime != null
                                   ? #temporals.format(#temporals.createDateTime(setting.lastCrawlingRunTime), 'yyyy년 MM월 dd일 HH:mm')
                                   : '실행 기록 없음'}"
                               class="w-full bg-zinc-100 border-none p-3 text-sm text-zinc-500 cursor-not-allowed">
                    </div>
                </section>

                <!-- 2. 환율 갱신 -->
                <section class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">currency_exchange</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">2. 환율 갱신</h2>
                    </div>

                    <!-- ON/OFF 라디오 -->
                    <div class="flex items-center gap-8 py-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="exchangeRateEnabled" value="true"
                                   th:checked="${setting.exchangeRateEnabled}">
                            <span class="text-sm font-bold">ON</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="exchangeRateEnabled" value="false"
                                   th:checked="${!setting.exchangeRateEnabled}">
                            <span class="text-sm font-bold">OFF</span>
                        </label>
                    </div>

                    <!-- 시작 일시 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">시작 일시</label>
                        <input type="datetime-local" name="exchangeRateStartDt"
                               th:value="${setting.exchangeRateStartDt}"
                               class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all">
                    </div>

                    <!-- 주기 selectbox -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">갱신 주기</label>
                        <select name="exchangeRateInterval"
                                class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all">
                            <option value="1" th:selected="${setting.exchangeRateInterval == '1'}">1시간</option>
                            <option value="3" th:selected="${setting.exchangeRateInterval == '3'}">3시간</option>
                            <option value="6" th:selected="${setting.exchangeRateInterval == '6'}">6시간</option>
                            <option value="12" th:selected="${setting.exchangeRateInterval == '12'}">12시간</option>
                            <option value="24" th:selected="${setting.exchangeRateInterval == '24'}">1일</option>
                        </select>
                    </div>

                    <!-- 마지막 갱신 시간 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">마지막 환율 갱신 시간</label>
                        <input type="text" readonly
                               th:value="${setting.lastExchangeRateRunTime != null
                                   ? #temporals.format(#temporals.createDateTime(setting.lastExchangeRateRunTime), 'yyyy년 MM월 dd일 HH:mm')
                                   : '실행 기록 없음'}"
                               class="w-full bg-zinc-100 border-none p-3 text-sm text-zinc-500 cursor-not-allowed">
                    </div>
                </section>

                <!-- 3. 고객 등급 재산정 -->
                <section class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">star</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">3. 고객 등급 재산정</h2>
                    </div>

                    <div class="flex items-center gap-8 py-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="gradeResolveEnabled" value="true"
                                   th:checked="${setting.gradeResolveEnabled}">
                            <span class="text-sm font-bold">ON</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="gradeResolveEnabled" value="false"
                                   th:checked="${!setting.gradeResolveEnabled}">
                            <span class="text-sm font-bold">OFF</span>
                        </label>
                    </div>

                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">시작 일시</label>
                        <input type="datetime-local" name="gradeResolveStartDt"
                               th:value="${setting.gradeResolveStartDt}"
                               class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all">
                    </div>

                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">재산정 주기</label>
                        <select name="gradeResolveInterval"
                                class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all">
                            <option value="6" th:selected="${setting.gradeResolveInterval == '6'}">6시간</option>
                            <option value="12" th:selected="${setting.gradeResolveInterval == '12'}">12시간</option>
                            <option value="24" th:selected="${setting.gradeResolveInterval == '24'}">1일</option>
                            <option value="168" th:selected="${setting.gradeResolveInterval == '168'}">7일</option>
                            <option value="720" th:selected="${setting.gradeResolveInterval == '720'}">30일</option>
                        </select>
                    </div>

                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">마지막 재산정 시간</label>
                        <input type="text" readonly
                               th:value="${setting.lastGradeResolveRunTime != null
                                   ? #temporals.format(#temporals.createDateTime(setting.lastGradeResolveRunTime), 'yyyy년 MM월 dd일 HH:mm')
                                   : '실행 기록 없음'}"
                               class="w-full bg-zinc-100 border-none p-3 text-sm text-zinc-500 cursor-not-allowed">
                    </div>
                </section>

                <!-- 4. 채팅방 자동 종료 -->
                <section class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">forum</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">4. 채팅방 자동 종료</h2>
                    </div>

                    <!-- ON/OFF 라디오 -->
                    <div class="flex items-center gap-8 py-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="chatAutoCloseEnabled" value="true"
                                   th:checked="${setting.chatAutoCloseEnabled}">
                            <span class="text-sm font-bold">ON</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="chatAutoCloseEnabled" value="false"
                                   th:checked="${!setting.chatAutoCloseEnabled}">
                            <span class="text-sm font-bold">OFF</span>
                        </label>
                    </div>

                    <!-- 시작 일시 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">시작 일시</label>
                        <input type="datetime-local" name="chatAutoCloseStartDt"
                               th:value="${setting.chatAutoCloseStartDt}"
                               class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all">
                    </div>

                    <!-- 실행 주기 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">자동 종료 기준</label>
                        <select name="chatAutoCloseInterval"
                                class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all">
                            <option value="1" th:selected="${setting.chatAutoCloseInterval == '1'}">1시간 무응답</option>
                            <option value="3" th:selected="${setting.chatAutoCloseInterval == '3'}">3시간 무응답</option>
                            <option value="6" th:selected="${setting.chatAutoCloseInterval == '6'}">6시간 무응답</option>
                            <option value="12" th:selected="${setting.chatAutoCloseInterval == '12'}">12시간 무응답</option>
                            <option value="24" th:selected="${setting.chatAutoCloseInterval == '24'}">1일 무응답</option>
                            <option value="48" th:selected="${setting.chatAutoCloseInterval == '48'}">2일 무응답</option>
                            <option value="72" th:selected="${setting.chatAutoCloseInterval == '72'}">3일 무응답</option>
                        </select>
                    </div>

                    <!-- 마지막 실행 시각 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">마지막 자동 종료 실행 시각</label>
                        <input type="text" readonly
                               th:value="${setting.lastChatAutoCloseRunTime != null ? #temporals.format(#temporals.createDateTime(setting.lastChatAutoCloseRunTime), 'yyyy년 MM월 dd일 HH:mm') : '실행 기록 없음'}"
                               class="w-full bg-zinc-100 border-none p-3 text-sm text-zinc-500 cursor-not-allowed">
                    </div>
                </section>


                <!-- 5. 전시용 전월 인기 상품 갱신 -->
                <section class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">trending_up</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">4. 인기 상품 전시 갱신</h2>
                    </div>

                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">매월 갱신일</label>
                        <select name="popularStockUpdateDay"
                                class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all">
                            <option value="1" th:selected="${setting.popularStockUpdateDay == '1'}">1일</option>
                            <option value="5" th:selected="${setting.popularStockUpdateDay == '5'}">5일</option>
                            <option value="10" th:selected="${setting.popularStockUpdateDay == '10'}">10일</option>
                            <option value="15" th:selected="${setting.popularStockUpdateDay == '15'}">15일</option>
                            <option value="20" th:selected="${setting.popularStockUpdateDay == '20'}">20일</option>
                            <option value="25" th:selected="${setting.popularStockUpdateDay == '25'}">25일</option>
                        </select>
                    </div>

                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">마지막 갱신 시간</label>
                        <input type="text" readonly
                               th:value="${setting.lastPopularStockUpdateTime != null
                                   ? #temporals.format(#temporals.createDateTime(setting.lastPopularStockUpdateTime), 'yyyy년 MM월 dd일 HH:mm')
                                   : '실행 기록 없음'}"
                               class="w-full bg-zinc-100 border-none p-3 text-sm text-zinc-500 cursor-not-allowed">
                    </div>

                    <button type="button" id="refreshPopularBtn"
                            onclick="refreshDisplay('popular')"
                            class="w-full flex items-center justify-center gap-2 bg-primary-container text-on-primary-container py-3 text-sm font-bold uppercase tracking-wide hover:brightness-95 transition-all">
                        <span class="material-symbols-outlined text-base">refresh</span>
                        즉시 갱신
                    </button>
                </section>

                <!-- 5. 전시용 신규 상품 갱신 -->
                <section class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">new_releases</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">4. 신규 상품 전시 갱신</h2>
                    </div>

                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">시작 일시</label>
                        <input type="datetime-local" name="newStockUpdateStartDt"
                               th:value="${setting.newStockUpdateStartDt}"
                               class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all">
                    </div>

                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">갱신 주기</label>
                        <select name="newStockUpdateInterval"
                                class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all">
                            <option value="6" th:selected="${setting.newStockUpdateInterval == '6'}">6시간</option>
                            <option value="12" th:selected="${setting.newStockUpdateInterval == '12'}">12시간</option>
                            <option value="24" th:selected="${setting.newStockUpdateInterval == '24'}">1일</option>
                            <option value="48" th:selected="${setting.newStockUpdateInterval == '24'}">2일</option>
                            <option value="168" th:selected="${setting.newStockUpdateInterval == '168'}">7일</option>
                        </select>
                    </div>

                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">마지막 갱신 시간</label>
                        <input type="text" readonly
                               th:value="${setting.lastNewStockUpdateTime != null
                                   ? #temporals.format(#temporals.createDateTime(setting.lastNewStockUpdateTime), 'yyyy년 MM월 dd일 HH:mm')
                                   : '실행 기록 없음'}"
                               class="w-full bg-zinc-100 border-none p-3 text-sm text-zinc-500 cursor-not-allowed">
                    </div>

                    <button type="button" id="refreshNewBtn"
                            onclick="refreshDisplay('new')"
                            class="w-full flex items-center justify-center gap-2 bg-primary-container text-on-primary-container py-3 text-sm font-bold uppercase tracking-wide hover:brightness-95 transition-all">
                        <span class="material-symbols-outlined text-base">refresh</span>
                        즉시 갱신
                    </button>
                </section>

                <!-- 6. 통관 물품 갱신 주기 설정 -->
                <section class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">schedule</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">5. 통관 물품 갱신</h2>
                    </div>

                    <!-- ON/OFF 라디오 -->
                    <div class="flex items-center gap-8 py-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="unipassEnabled" value="true" th:checked="${setting.unipassEnabled}">
                            <span class="text-sm font-bold">ON</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="unipassEnabled" value="false"
                                   th:checked="${!setting.unipassEnabled}">
                            <span class="text-sm font-bold">OFF</span>
                        </label>
                    </div>

                    <!-- 시작 일시 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">시작 일시</label>
                        <input type="datetime-local" name="unipassStartDt"
                               th:value="${setting.unipassStartDt}"
                               class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all">
                    </div>

                    <!-- 주기 selectbox -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">갱신 주기</label>
                        <select name="unipassInterval"
                                class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all">
                            <option value="1" th:selected="${setting.unipassInterval == '1'}">1시간</option>
                            <option value="3" th:selected="${setting.unipassInterval == '3'}">3시간</option>
                            <option value="6" th:selected="${setting.unipassInterval == '6'}">6시간</option>
                            <option value="12" th:selected="${setting.unipassInterval == '12'}">12시간</option>
                            <option value="24" th:selected="${setting.unipassInterval == '24'}">1일</option>
                        </select>
                    </div>

                    <!-- 마지막 갱신 시간 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">마지막 통관 갱신 시간</label>
                        <input type="text" readonly
                               th:value="${setting.lastUnipassRunTime != null
                                   ? #temporals.format(#temporals.createDateTime(setting.lastUnipassRunTime), 'yyyy년 MM월 dd일 HH:mm')
                                   : '실행 기록 없음'}"
                               class="w-full bg-zinc-100 border-none p-3 text-sm text-zinc-500 cursor-not-allowed">
                    </div>

                    <button type="button" id="refreshShipmentBtn" onclick="triggerSync()" class="w-full flex items-center justify-center gap-2 bg-primary-container text-on-primary-container py-3 text-sm font-bold uppercase tracking-wide hover:brightness-95 transition-all">
                        <span class="material-symbols-outlined text-base">refresh</span>즉시 갱신
                    </button>
                </section>

                <!-- 7. 배송 상태 동기화 -->
                <section class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">local_shipping</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">6. 배송 상태 동기화</h2>
                    </div>

                    <!-- ON/OFF 라디오 -->
                    <div class="flex items-center gap-8 py-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="shipmentSyncEnabled" value="true" th:checked="${setting.shipmentSyncEnabled}">
                            <span class="text-sm font-bold">ON</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="shipmentSyncEnabled" value="false"
                                   th:checked="${!setting.shipmentSyncEnabled}">
                            <span class="text-sm font-bold">OFF</span>
                        </label>
                    </div>

                    <!-- 시작 일시 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">시작 일시</label>
                        <input type="datetime-local" name="shipmentSyncStartDt"
                               th:value="${setting.shipmentSyncStartDt}"
                               class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all">
                    </div>

                    <!-- 주기 selectbox -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">동기화 주기</label>
                        <select name="shipmentSyncInterval"
                                class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all">
                            <option value="1" th:selected="${setting.shipmentSyncInterval == '1'}">1시간</option>
                            <option value="3" th:selected="${setting.shipmentSyncInterval == '3'}">3시간</option>
                            <option value="6" th:selected="${setting.shipmentSyncInterval == '6'}">6시간</option>
                            <option value="12" th:selected="${setting.shipmentSyncInterval == '12'}">12시간</option>
                            <option value="24" th:selected="${setting.shipmentSyncInterval == '24'}">1일</option>
                        </select>
                    </div>

                    <!-- 마지막 동기화 시간 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">마지막 배송 동기화 시간</label>
                        <input type="text" readonly
                               th:value="${setting.lastShipmentSyncRunTime != null
                                   ? #temporals.format(#temporals.createDateTime(setting.lastShipmentSyncRunTime), 'yyyy년 MM월 dd일 HH:mm')
                                   : '실행 기록 없음'}"
                               class="w-full bg-zinc-100 border-none p-3 text-sm text-zinc-500 cursor-not-allowed">
                    </div>

                    <button type="button" id="refreshShipmentSyncBtn"
                            onclick="refreshShipmentSync()"
                            class="w-full flex items-center justify-center gap-2 bg-primary-container text-on-primary-container py-3 text-sm font-bold uppercase tracking-wide hover:brightness-95 transition-all">
                        <span class="material-symbols-outlined text-base">sync</span>
                        즉시 동기화
                    </button>
                </section>
            </form>

            <div class="pt-8 border-t border-zinc-100 flex justify-end">
                <button type="submit" form="policyForm" class="btn-primary px-8 py-4 text-sm gap-2 flex items-center">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
                    설정 저장
                </button>
            </div>

        </div>
    </div>

    <script th:inline="javascript">
        function refreshDisplay(type) {
            const btn = document.getElementById(type === 'popular' ? 'refreshPopularBtn' : 'refreshNewBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined text-base animate-spin">refresh</span> 갱신 중...';

            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content || '';
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';

            fetch(`/root/scheduler/refresh/${type}`, {
                method: 'POST',
                headers: { [csrfHeader]: csrfToken }
            })
                .then(res => {
                    if (!res.ok) throw new Error('갱신 실패');
                    location.reload();
                })
                .catch(err => {
                    alert('갱신에 실패했습니다.');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const policyForm = document.getElementById('policyForm');

            // 1. 숫자 전용 필드 검증
            const numberInputs = policyForm.querySelectorAll('input[type="number"]');
            numberInputs.forEach(input => {
                input.addEventListener('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '');
                });
            });

            // 2. 파일 확장자 필드 검증 (name 값 카멜케이스 수정)
            const fileInput = policyForm.querySelector('input[name="fileUploadAllowList"]');
            if (fileInput) {
                fileInput.addEventListener('input', function() {
                    const regex = /[^a-zA-Z0-9,\s]/g;
                    if (regex.test(this.value)) {
                        this.value = this.value.replace(regex, '');
                    }
                });

                fileInput.addEventListener('blur', function() {
                    this.value = this.value.split(',')
                        .map(ext => ext.trim())
                        .filter(ext => ext !== '')
                        .join(', ');
                });
            }

            // 3. 저장 전 최종 확인 (name 값 카멜케이스 수정)
            policyForm.addEventListener('submit', function(e) {
                if (fileInput && fileInput.value.trim() === '') {
                    const isEnabledRadio = policyForm.querySelector('input[name="isFileUploadAllowListEnabled"]:checked');
                    if (isEnabledRadio && isEnabledRadio.value === 'true') {
                        alert('화이트리스트 기능을 사용하려면 최소 하나 이상의 확장자를 입력해야 합니다.');
                        e.preventDefault();
                    }
                }
            });

            // 4. ON/OFF 상태에 따른 입력창 제어 함수
            function updateInputStatus(section) {
              const radioOn = section.querySelector('input[type="radio"][value="true"]');
              const editableFields = section.querySelectorAll(
                  'input[type="number"], input[type="text"]:not([readonly]), input[type="datetime-local"], select'
              );

              if (!editableFields.length) return;

              const enableField = (field) => {
                  if (field.tagName === 'SELECT') {
                      field.disabled = false;
                  } else {
                      field.readOnly = false;
                  }

                  field.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-zinc-100');
                  field.classList.add('bg-surface-container-high');
                  field.classList.add('focus:bg-surface-container-lowest', 'focus:border-l-4', 'focus:border-primary', 'transition-all');
              };

              const disableField = (field) => {
                  if (field.tagName === 'SELECT') {
                      field.disabled = true;
                  } else {
                      field.readOnly = true;
                  }

                  field.classList.add('opacity-50', 'cursor-not-allowed', 'bg-zinc-100');
                  field.classList.remove('bg-surface-container-high');
                  field.classList.remove('focus:bg-surface-container-lowest', 'focus:border-l-4', 'focus:border-primary');

                  if (document.activeElement === field) {
                      field.blur();
                  }
            };

              editableFields.forEach(field => {
                  if (radioOn && radioOn.checked) {
                      enableField(field);
                  } else {
                      disableField(field);
                  }
              });
            }

            // 이벤트 바인딩 및 초기화
            const sections = policyForm.querySelectorAll('section');
            sections.forEach(section => {
                const radios = section.querySelectorAll('input[type="radio"]');
                radios.forEach(radio => {
                    radio.addEventListener('change', () => updateInputStatus(section));
                });
                updateInputStatus(section);
            });
        });

        function triggerSync() {
            const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

            if(!confirm("현재 SHIPPING 상태인 모든 물품의 통관 정보를 즉시 업데이트하시겠습니까?")) return;

            fetch('/api/admin/member/shipment/sync-unipass', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        [csrfHeader]: csrfToken
                    }
                })
                .then(res => {
                    if (!res.ok) throw new Error('네트워크 응답에 문제가 발생했습니다.');
                    return res.text();
                })
                .then(data => {
                    alert(data);
                    location.reload();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("동기화 중 오류가 발생했습니다.");
                });
        }

        function refreshShipmentSync() {
            const btn = document.getElementById('refreshShipmentSyncBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined text-base animate-spin">sync</span> 동기화 중...';

            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content || '';
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';

            fetch('/api/admin/member/shipment/sync-shipment', {
                method: 'POST',
                headers: { [csrfHeader]: csrfToken }
            })
                .then(res => {
                    if (!res.ok) throw new Error('동기화 실패');
                    return res.text();
                })
                .then(data => {
                    alert(data);
                    location.reload();
                })
                .catch(err => {
                    alert('동기화에 실패했습니다.');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                });
        }
    </script>
</th:block>
</html>
