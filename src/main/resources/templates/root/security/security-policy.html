<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('SECURITY', 'policy', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | Security Policy</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{root/root-sidebar :: sidebar('security', 'chat-list')}"></div>
</th:block>

<th:block th:fragment="content">
    <div class="flex-grow mx-auto px-6 py-12 max-w-5xl">
        <div class="mb-12 flex items-baseline gap-4">
            <h1 class="text-5xl font-black tracking-tighter text-on-surface uppercase">보안 정책 설정</h1>
            <span class="text-sm font-medium text-primary tracking-widest uppercase">(Security Policy Settings)</span>
        </div>

        <div class="bg-surface-container-lowest shadow-sm border-l-8 border-primary-container p-10 space-y-12">
            <form id="policyForm" th:action="@{/root/security/save}" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-12">

                <section class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">login</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">1. 로그인 시도 제한</h2>
                    </div>
                    <div class="flex items-center gap-8 py-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="isLoginFailureLimitEnabled" value="true"
                                   th:checked="${policy.isLoginFailureLimitEnabled}" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary">
                            <span class="text-sm font-bold">ON</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="isLoginFailureLimitEnabled" value="false"
                                   th:checked="${!policy.isLoginFailureLimitEnabled}" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary">
                            <span class="text-sm font-bold">OFF</span>
                        </label>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">최대 시도 횟수</label>
                        <input type="number" name="maxLoginFailureCount" th:value="${policy.maxLoginFailureCount}"
                               class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all" placeholder="5">
                    </div>
                </section>

                <section class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">lock_person</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">2. 계정 잠금 설정</h2>
                    </div>
                    <div class="flex items-center gap-8 py-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="isAccountLockEnabled" value="true"
                                   th:checked="${policy.isAccountLockEnabled}" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary">
                            <span class="text-sm font-bold">ON</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="isAccountLockEnabled" value="false"
                                   th:checked="${!policy.isAccountLockEnabled}" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary">
                            <span class="text-sm font-bold">OFF</span>
                        </label>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">잠금 시간 (분)</label>
                        <input type="number" name="accountLockDurationMinutes" th:value="${policy.accountLockDurationMinutes}"
                               class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all" placeholder="30">
                    </div>
                </section>

                <section class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">timer</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">3. 세션 타임아웃</h2>
                    </div>
                    <div class="flex items-center gap-8 py-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="isSessionTimeoutEnabled" value="true"
                                   th:checked="${policy.isSessionTimeoutEnabled}" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary">
                            <span class="text-sm font-bold">ON</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="isSessionTimeoutEnabled" value="false"
                                   th:checked="${!policy.isSessionTimeoutEnabled}" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary">
                            <span class="text-sm font-bold">OFF</span>
                        </label>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">자동 로그아웃 시간 (분)</label>
                        <input type="number" name="sessionTimeoutMinutes" th:value="${policy.sessionTimeoutMinutes}"
                               class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all" placeholder="60">
                    </div>
                </section>

                <section class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">upload_file</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">4. 파일 업로드 화이트리스트</h2>
                    </div>
                    <div class="flex items-center gap-8 py-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="isFileUploadAllowListEnabled" value="true"
                                   th:checked="${policy.isFileUploadAllowListEnabled}" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary">
                            <span class="text-sm font-bold">ON</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="isFileUploadAllowListEnabled" value="false"
                                   th:checked="${!policy.isFileUploadAllowListEnabled}" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary">
                            <span class="text-sm font-bold">OFF</span>
                        </label>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">허용 확장자</label>
                        <input type="text" name="fileUploadAllowList" th:value="${#strings.listJoin(policy.fileUploadAllowList, ', ')}"
                               class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all" placeholder="pdf, jpg, png, xlsx">
                    </div>
                </section>

                <section class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">database</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">5. 로그 보관 기간</h2>
                    </div>
                    <div class="flex items-center gap-8 py-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="isAuditLogEnabled" value="true"
                                   th:checked="${policy.isAuditLogEnabled}" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary">
                            <span class="text-sm font-bold">ON</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="isAuditLogEnabled" value="false"
                                   th:checked="${!policy.isAuditLogEnabled}" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary">
                            <span class="text-sm font-bold">OFF</span>
                        </label>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">보관 기간 (일)</label>
                        <input type="number" name="logRetentionDays" th:value="${policy.logRetentionDays}"
                               class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all" placeholder="90">
                    </div>
                </section>

                <section class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">group_off</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">6. 중복 로그인 방지</h2>
                    </div>
                    <div class="flex items-center gap-8 py-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="isConcurrentLoginPrevented" value="true"
                                   th:checked="${policy.isConcurrentLoginPrevented}" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary">
                            <span class="text-sm font-bold">ON</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="isConcurrentLoginPrevented" value="false"
                                   th:checked="${!policy.isConcurrentLoginPrevented}" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary">
                            <span class="text-sm font-bold">OFF</span>
                        </label>
                    </div>
                </section>

                <section class="space-y-4" style="grid-column: 1 / -1;">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary">password</span>
                        <h2 class="text-xl font-bold tracking-tight uppercase">7. 비밀번호 변경 주기</h2>
                    </div>
                    <div class="flex items-center gap-8 py-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="isPasswordExpiryEnabled" value="true"
                                   th:checked="${policy.isPasswordExpiryEnabled}" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary">
                            <span class="text-sm font-bold">ON</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="isPasswordExpiryEnabled" value="false"
                                   th:checked="${!policy.isPasswordExpiryEnabled}" class="w-5 h-5 text-primary border-outline-variant focus:ring-primary">
                            <span class="text-sm font-bold">OFF</span>
                        </label>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-xs font-bold text-zinc-500 uppercase">변경 주기 (일)</label>
                        <input type="number" name="passwordExpiryDays" th:value="${policy.passwordExpiryDays}"
                               class="w-full bg-surface-container-high border-none p-3 text-sm focus:bg-surface-container-lowest focus:border-l-4 focus:border-primary transition-all" placeholder="90">
                    </div>
                </section>
            </form>

            <div class="pt-8 border-t border-zinc-100 flex justify-end">
                <button type="submit" form="policyForm" class="btn-primary px-8 py-4 text-sm gap-2 flex items-center">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
                    설정 저장
                </button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const policyForm = document.getElementById('policyForm');

            // 1. 숫자 전용 필드 검증
            const numberInputs = policyForm.querySelectorAll('input[type="number"]');
            numberInputs.forEach(input => {
                input.addEventListener('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '');
                });
            });

            // 2. 파일 확장자 필드 검증 (name 값 카멜케이스 수정)
            const fileInput = policyForm.querySelector('input[name="fileUploadAllowList"]');
            if (fileInput) {
                fileInput.addEventListener('input', function() {
                    const regex = /[^a-zA-Z0-9,\s]/g;
                    if (regex.test(this.value)) {
                        this.value = this.value.replace(regex, '');
                    }
                });

                fileInput.addEventListener('blur', function() {
                    this.value = this.value.split(',')
                        .map(ext => ext.trim())
                        .filter(ext => ext !== '')
                        .join(', ');
                });
            }

            // 3. 저장 전 최종 확인 (name 값 카멜케이스 수정)
            policyForm.addEventListener('submit', function(e) {
                if (fileInput && fileInput.value.trim() === '') {
                    const isEnabledRadio = policyForm.querySelector('input[name="isFileUploadAllowListEnabled"]:checked');
                    if (isEnabledRadio && isEnabledRadio.value === 'true') {
                        alert('화이트리스트 기능을 사용하려면 최소 하나 이상의 확장자를 입력해야 합니다.');
                        e.preventDefault();
                    }
                }
            });

            // 4. ON/OFF 상태에 따른 입력창 제어 함수
            function updateInputStatus(section) {
                const radioOn = section.querySelector('input[type="radio"][value="true"]');
                const targetInput = section.querySelector('input[type="number"], input[type="text"]');

                if (!targetInput) return;

                const focusClasses = ['focus:border-l-4', 'focus:border-primary', 'focus:bg-surface-container-lowest', 'focus:outline-none'];

                if (radioOn && radioOn.checked) {
                    targetInput.readOnly = false;
                    targetInput.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-zinc-100');
                    targetInput.classList.add('bg-surface-container-high');
                    focusClasses.forEach(cls => targetInput.classList.add(cls));
                } else {
                    targetInput.readOnly = true;
                    targetInput.classList.add('opacity-50', 'cursor-not-allowed', 'bg-zinc-100');
                    targetInput.classList.remove('bg-surface-container-high');
                    focusClasses.forEach(cls => targetInput.classList.remove(cls));
                    if (document.activeElement === targetInput) targetInput.blur();
                }
            }

            // 이벤트 바인딩 및 초기화
            const sections = policyForm.querySelectorAll('section');
            sections.forEach(section => {
                const radios = section.querySelectorAll('input[type="radio"]');
                radios.forEach(radio => {
                    radio.addEventListener('change', () => updateInputStatus(section));
                });
                updateInputStatus(section);
            });
        });
    </script>
</th:block>
</html>
