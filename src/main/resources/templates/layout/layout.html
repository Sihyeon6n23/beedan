<!DOCTYPE html>
<html th:fragment="layout(title, sidebar, content)" xmlns:th="http://www.thymeleaf.org" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">BEEDAN | Architectural Curation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-background flex flex-col min-h-screen">
<header th:replace="~{fragments/header :: headerFragment}"></header>

<div class="flex flex-grow w-full pt-16">
    <div th:if="${sidebar}" class="flex-shrink-0">
        <aside th:replace="${sidebar}"></aside>
    </div>

    <div th:classappend="${sidebar} ? 'md:pl-32' : 'mx-auto'">
        <main th:replace="${content}"></main>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footerFragment}" class="w-full"></footer>
<!--<th:block th:if="${session.loginMember != null and session.loginMember.memAut != null and session.loginMember.memAut.name() == 'USER'}">-->
    <div th:replace="~{fragments/chat/member-widget :: memberChatWidget}"></div>
<!--</th:block>-->

<script>
    document.addEventListener('DOMContentLoaded', function() {
    const notiIcon = document.getElementById('notiIcon'); // 헤더의 종 아이콘 ID
    const notiDropdown = document.getElementById('notificationDropdown');

    // 종 아이콘 클릭 시 토글
    notiIcon.addEventListener('click', function(e) {
        e.stopPropagation();
        notiDropdown.classList.toggle('hidden');
    });

    // 화면 다른 곳 클릭 시 닫기
    document.addEventListener('click', function(e) {
        if (!notiDropdown.contains(e.target) && e.target !== notiIcon) {
            notiDropdown.classList.add('hidden');
        }
    });
});
</script>
</body>
</html>
