<!DOCTYPE html>
<html th:fragment="layout(title, sidebar, content)"
      class="h-full"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <link rel="icon" type="image/png" th:href="@{/image/logo.png}">
    <title th:replace="${title}">BEEDAN | Architectural Curation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/chat/admin-chat.css}">
    <link rel="stylesheet" th:href="@{/css/notification/notification.css}">
</head>
<body class="bg-background flex flex-col min-h-screen">
  <header th:replace="~{fragments/header :: headerFragment}"></header>

  <div class="app-layout flex flex-grow w-full pt-16" th:classappend="${sidebar} ? ' app-layout--with-sidebar' : ''">
    <div th:if="${sidebar}" class="app-layout__sidebar flex-shrink-0">
        <aside th:replace="${sidebar}"></aside>
    </div>

    <div class="app-layout__content" th:classappend="${sidebar} ? '' : 'w-full flex-1 max-w-[1220px] mx-auto'">
        <main th:replace="${content}"></main>
    </div>

  </div>

  <footer th:replace="~{fragments/footer :: footerFragment}" class="w-full"></footer>

  <th:block sec:authorize="isAnonymous() or hasRole('USER')">
    <div th:replace="~{fragments/chat/member-widget :: memberChatWidget}"></div>
  </th:block>

<script defer th:src="@{/js/notification/notification.js}"></script>
<script defer th:src="@{/js/tracking/page-tracking.js}"></script>
</body>
</html>
