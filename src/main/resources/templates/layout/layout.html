<!DOCTYPE html>
<html th:fragment="layout(title, sidebar, content)"
      xmlns:th="http://www.thymeleaf.org" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">BEEDAN | Architectural Curation</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-background flex flex-col min-h-screen">

<header th:replace="~{fragments/header :: headerFragment}"></header>

<div class="flex flex-grow w-full pt-16">

    <aside th:if="${sidebar}"
           class="hidden md:block fixed left-0 top-16 h-[calc(100vh-64px)] w-64 border-r border-stone-100 bg-stone-50 z-40 overflow-y-auto">
        <div th:replace="~{fragments/sidebar :: frame(${sidebar})}"></div>
    </aside>

    <div th:classappend="${sidebar} ? 'md:pl-64' : 'pl-0'" class="flex flex-col flex-grow w-full transition-all duration-300">

        <main class="flex-grow w-full">
            <div th:replace="${content}"></div>
        </main>

        <footer th:replace="~{fragments/footer :: footerFragment}" class="w-full"></footer>

    </div>

</div>
</body>
</html>
