<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('ADMIN', 'MEMBER MANAGEMENT', ~{::sidebar})},
          ~{::content}
      )}">
<head>
    <title>BEEDAN | Member Management</title>
</head>
<body>

<th:block th:fragment="sidebar">
    <div th:replace="~{admin/admin-sidebar :: sidebar('member', 'member-list')}"></div>
</th:block>

<th:block th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/chat/admin-chat.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin-member-list.css}">
    <style>
        .admin-chat-list-head,
        .admin-chat-row {
            display: grid !important;
            grid-template-columns: minmax(80px, 0.9fr) minmax(120px, 2fr) minmax(80px, 1.0fr) minmax(100px, 0.9fr) minmax(90px, 1fr) !important;
            gap: 1rem;
            align-items: center;
        }

        .action-btns {
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .btn-detail {
            background-color: #e2e2e2;
            color: #1a1c1c;
            border: none;
            padding: 4px 8px;
            font-size: 0.55rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 45px;
            height: 24px;
            transition: all 0.2s ease;
        }
        .btn-detail:hover { background-color: #d1d1d1; }
        .btn-edit {
            background-color: #1a1c1c;
            color: #ffffff;
            border: none;
            padding: 4px 8px;
            font-size: 0.55rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 45px;
            height: 24px;
            transition: all 0.2s ease;
        }
        .btn-edit:hover { background-color: #333; }

        .btn-search {
            background-color: var(--accent-gold);
            color: var(--primary-gold);
            padding: 0.75rem 1.5rem;
            border: none;
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-search:hover {
            background-color: #facc15;
        }

        .date-input-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .date-input-wrapper input[type="date"] {
            background-color: var(--bg-input);
            border: none;
            outline: none;
            padding: 0.75rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
        }

        .date-input-wrapper span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .btn-reset {
            background-color: var(--bg-input);
            color: var(--text-main);
            padding: 0.75rem 1.5rem;
            border: none;
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-reset:hover {
            background-color: #d1d1d1;
        }
    </style>

            <section class="admin-chat-page admin-chat-list-page member-management-list">
                <header class="admin-chat-shell admin-chat-shell--header">
                    <div class="admin-chat-shell__heading">
                        <span class="admin-chat-kicker">MEMBER LIST</span>
                        <h2 class="admin-chat-title">회원 관리</h2>
                        <div class="admin-chat-shell__rule">
                            <span></span>
                        </div>
                    </div>
                </header>

                <section class="admin-chat-shell admin-chat-shell--toolbar" aria-label="요청 목록 필터">
                    <div class="admin-chat-toolbar flex justify-between items-center">
                        <!-- 좌측: 상태 필터 -->
                        <div class="admin-chat-toolbar__filters">
                            <div class="admin-chat-filter-set" data-filter-group="status">
                                <a class="admin-chat-filter is-active" href="#" data-status="ALL">전체</a>
                                <a class="admin-chat-filter" href="#" data-status="ACTIVE">활성</a>
                                <a class="admin-chat-filter" href="#" data-status="LOCK">잠금</a>
                            </div>
                        </div>

                        <!-- 우측: 검색 영역 -->
                        <div class="flex items-center gap-4">
                            <div class="search-input-wrapper flex items-center gap-2 border-b border-outline-variant pb-2">
                                <input id="search-input" type="text" placeholder="회원 이름, 상호명, 대표명 검색"
                                       class="bg-transparent border-none text-xs font-bold tracking-widest focus:ring-0 outline-none w-64" />
                                <span class="material-symbols-outlined text-sm text-neutral-400">search</span>
                            </div>
                            <button class="btn-search" onclick="searchMembers()">검색</button>
                            <button class="btn-reset" onclick="resetSearch()">초기화</button>
                        </div>
                    </div>
                </section>

                <section class="admin-chat-shell admin-chat-shell--list">
                    <div class="admin-chat-list-head" aria-hidden="true">
                        <div style="text-align: center;">아이디 / 이름</div>
                        <div style="text-align: center;">상호명 / 대표명</div>
                        <div style="text-align: center;">상태</div>
                        <div style="text-align: center;">가입일</div>
                        <div style="text-align: center;">관리</div>
                    </div>

                    <div class="admin-chat-list-body" id="memberListBody"></div>

                    <footer class="admin-chat-shell admin-chat-shell--pagination" id="paginationArea"></footer>
                </section>
            </section>


            <div id="memberDetailModal" class="modal-overlay hidden">
                <div class="modal-container">
                    <div class="modal-top-line"></div>

                    <header class="modal-header">
                        <div class="header-info">
                            <div class="meta-row">
                                <span class="member-id"></span>
                                <span class="dot-divider"></span>
                                <span class="join-date"></span>
                            </div>
                            <h2 class="member-nm">name</h2>
                        </div>
                        <button class="btn-close-modal" onclick="closeMemberModal()">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </header>

                    <div id="modalContentArea" class="modal-body">

                        <section class="modal-col col-order">
                            <div class="col-header">
                                <h3>주문 목록</h3>
                                <span class="material-symbols-outlined">receipt_long</span>
                            </div>
                            <div class="col-content"></div>
                            <div class="col-footer">
                                <button class="btn-outline-yellow">전체 주문 목록 조회</button>
                            </div>
                        </section>

                        <section class="modal-col col-shipping">
                            <div class="col-header bg-gray">
                                <h3>배송 목록</h3>
                                <span class="material-symbols-outlined">local_shipping</span>
                            </div>
                            <div class="col-content"></div>
                            <div class="col-footer">
                                <button class="btn-solid-black">전체 배송 목록 조회</button>
                            </div>
                        </section>

                        <section class="modal-col col-inquiry">
                            <div class="col-header">
                                <h3>문의 목록</h3>
                                <span class="material-symbols-outlined">support_agent</span>
                            </div>
                            <div class="col-content"></div>
                            <div class="col-footer">
                                <button class="btn-solid-yellow">전체 문의 내역 조회</button>
                            </div>
                        </section>

                    </div>
                </div>
            </div>
    <script th:src="@{/js/admin/member/admin-member-list.js}"></script>
</th:block>
</body>
</html>
