<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('ADMIN', 'Category Management', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | 카테고리 목록</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{admin/admin-sidebar :: sidebar('stock', 'category-list')}"></div>
</th:block>

<th:block th:fragment="content">
<link rel="stylesheet" th:href="@{/css/chat/admin-chat.css}"/>
<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />

<section class="admin-chat-page admin-chat-list-page" style="max-width:1280px;">
    <!-- 헤더 -->
    <header class="admin-chat-shell admin-chat-shell--header">
        <div class="admin-chat-shell__heading">
            <span class="admin-chat-kicker">Category Management</span>
            <h2 class="admin-chat-title">카테고리 목록</h2>
        </div>
        <div class="admin-chat-shell__rule"><span></span></div>
    </header>

    <!-- 필터 -->
    <section style="display:flex; gap:12px; margin-bottom:20px; align-items:center;">
        <div style="flex:1; display:flex; align-items:center; background:#e8e8e8; padding:8px 16px;">
            <input type="text" id="catSearch" placeholder="카테고리명 검색"
                   style="flex:1; border:none; background:transparent; outline:none; font-size:13px;">
            <span class="material-symbols-outlined" style="color:#78716c; font-size:20px;">search</span>
        </div>
        <select id="catFilter" style="padding:8px 16px; border:1px solid #e7e5e4; font-size:13px; font-weight:700;">
            <option value="all">전체</option>
            <option value="unmapped">미매핑</option>
            <option value="mapped">매핑 완료</option>
        </select>
    </section>

    <!-- 테이블 -->
    <div style="overflow-x:auto; background:#fff; border:1px solid #e7e5e4;">
        <table style="width:100%; border-collapse:collapse; table-layout:fixed;">
            <thead>
            <tr style="background:#f3f3f3;">
                <th style="width:60px; padding:12px 14px; text-align:center; font-size:11px; font-weight:700; color:#78716c; text-transform:uppercase; letter-spacing:0.08em; border-bottom:1px solid #e7e5e4;">ID</th>
                <th style="width:160px; padding:12px 14px; text-align:left; font-size:11px; font-weight:700; color:#78716c; text-transform:uppercase; letter-spacing:0.08em; border-bottom:1px solid #e7e5e4;">카테고리명</th>
                <th style="width:80px; padding:12px 14px; text-align:center; font-size:11px; font-weight:700; color:#78716c; text-transform:uppercase; letter-spacing:0.08em; border-bottom:1px solid #e7e5e4;">상태</th>
                <th style="width:140px; padding:12px 14px; text-align:left; font-size:11px; font-weight:700; color:#78716c; text-transform:uppercase; letter-spacing:0.08em; border-bottom:1px solid #e7e5e4;">HS 코드</th>
                <th style="padding:12px 14px; text-align:left; font-size:11px; font-weight:700; color:#78716c; text-transform:uppercase; letter-spacing:0.08em; border-bottom:1px solid #e7e5e4;">HS 품명</th>
                <th style="width:80px; padding:12px 14px; text-align:center; font-size:11px; font-weight:700; color:#78716c; text-transform:uppercase; letter-spacing:0.08em; border-bottom:1px solid #e7e5e4;">관세율</th>
                <th style="width:120px; padding:12px 14px; text-align:center; font-size:11px; font-weight:700; color:#78716c; text-transform:uppercase; letter-spacing:0.08em; border-bottom:1px solid #e7e5e4;">관리</th>
            </tr>
            </thead>
            <tbody id="catTbody">
            <th:block th:each="c : ${categories}">
                <tr class="cat-row"
                    th:data-cat-id="${c.catId}"
                    th:data-cat-nm="${c.catNm}"
                    th:data-mapped="${c.hasMapped}"
                    style="border-bottom:1px solid #e7e5e4;">
                    <td style="padding:14px; text-align:center; font-size:12px; color:#a3a3a3;" th:text="${c.catId}">1</td>
                    <td style="padding:14px; font-size:14px; font-weight:700; color:#1a1c1c;" th:text="${c.catNm}">Category</td>
                    <td style="padding:14px; text-align:center;">
                        <span th:if="${c.hasMapped}"
                              style="display:inline-block; padding:3px 10px; font-size:10px; font-weight:800; letter-spacing:0.08em; background:#e8f5e9; color:#2e7d32;">매핑</span>
                        <span th:unless="${c.hasMapped}"
                              style="display:inline-block; padding:3px 10px; font-size:10px; font-weight:800; letter-spacing:0.08em; background:#fff3e0; color:#e65100;">미매핑</span>
                    </td>
                    <td style="padding:14px; font-size:13px; font-family:'Noto Serif KR',serif; color:#4d4732;"
                        th:text="${c.hsCode != null ? c.hsCode.hsCd : '-'}">-</td>
                    <td style="padding:14px; font-size:13px; color:#4d4732;"
                        th:text="${c.hsCode != null ? c.hsCode.hsNm : '-'}">-</td>
                    <td style="padding:14px; text-align:center; font-size:13px; font-weight:700; color:#1a1c1c;"
                        th:text="${c.hsCode != null ? #numbers.formatDecimal(c.hsCode.hsDuRa * 100, 1, 'COMMA', 1, 'POINT') + '%' : '-'}">-</td>
                    <td style="padding:14px; text-align:center;">
                        <button type="button" class="btn-edit-hs"
                                th:data-cat-id="${c.catId}" th:data-cat-nm="${c.catNm}"
                                th:data-hs-cd="${c.hsCode != null ? c.hsCode.hsCd : ''}"
                                th:data-hs-nm="${c.hsCode != null ? c.hsCode.hsNm : ''}"
                                th:data-hs-du-ra="${c.hsCode != null ? c.hsCode.hsDuRa : ''}"
                                th:data-hs-des="${c.hsCode != null && c.hsCode.des != null ? c.hsCode.des : ''}"
                                style="padding:6px 14px; background:#ffd700; color:#705d00; border:none; cursor:pointer; font-size:11px; font-weight:800; letter-spacing:0.08em;"
                                th:text="${c.hasMapped ? '수정' : '+ HS'}"></button>
                        <button th:if="${c.hasMapped}" type="button" class="btn-delete-hs"
                                th:data-cat-id="${c.catId}"
                                style="padding:6px 10px; background:none; border:none; color:#c53030; cursor:pointer; font-size:11px; font-weight:700; margin-left:4px;">삭제</button>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>
    </div>

    <p style="text-align:center; padding:20px; color:#a3a3a3; font-size:12px;"
       th:text="'총 ' + ${categories.size()} + '개 카테고리'"></p>
</section>

<!-- HS 코드 모달 -->
<div id="hsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:9999; align-items:center; justify-content:center; backdrop-filter:blur(4px);"
     onclick="if(event.target===this){ this.style.display='none'; document.body.style.overflow=''; }">
    <div style="background:#fff; border:1px solid #e0ddd6; width:460px; padding:40px; outline:2px solid #ffd700; outline-offset:-2px;">
        <h3 style="font-family:'Manrope',sans-serif; font-weight:800; font-size:16px; color:#1a1c1c; margin:0 0 6px;">HS 코드 매핑</h3>
        <p id="hsModalCat" style="font-size:13px; color:#78716c; margin:0 0 24px;">카테고리: -</p>
        <div style="display:flex; flex-direction:column; gap:12px;">
            <input type="text" id="hmHsCd" placeholder="HS 코드 * (예: 6201.90-0000)" style="padding:10px 12px; border:1px solid #e7e5e4; font-size:13px; font-family:'Noto Serif KR',serif;">
            <input type="text" id="hmHsNm" placeholder="HS 품명 * (예: 남성용 오버코트)" style="padding:10px 12px; border:1px solid #e7e5e4; font-size:13px;">
            <div style="display:flex; gap:8px; align-items:center;">
                <input type="number" id="hmHsDuRa" placeholder="관세율 *" step="0.01" min="0" max="1"
                       style="flex:1; padding:10px 12px; border:1px solid #e7e5e4; font-size:13px;">
                <span style="font-size:12px; color:#78716c; white-space:nowrap;">소수점 (예: 0.08 = 8%)</span>
            </div>
            <input type="text" id="hmDes" placeholder="설명 (선택)" style="padding:10px 12px; border:1px solid #e7e5e4; font-size:13px;">
        </div>
        <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:24px;">
            <button type="button" onclick="document.getElementById('hsModal').style.display='none'; document.body.style.overflow='';"
                    style="padding:10px 24px; border:1px solid #e0ddd6; background:#fff; cursor:pointer; font-size:12px; font-weight:700;">취소</button>
            <button type="button" id="btnHsSubmit"
                    style="padding:10px 28px; background:#ffd700; color:#705d00; border:none; cursor:pointer; font-size:12px; font-weight:800;">저장</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    var csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
    var currentCatId = null;

    // 검색 + 필터
    var searchInput = document.getElementById('catSearch');
    var filterSelect = document.getElementById('catFilter');

    function applyFilter() {
        var keyword = searchInput.value.trim().toLowerCase();
        var filter = filterSelect.value;
        document.querySelectorAll('.cat-row').forEach(function (row) {
            var name = (row.dataset.catNm || '').toLowerCase();
            var mapped = row.dataset.mapped === 'true';
            var matchSearch = !keyword || name.includes(keyword);
            var matchFilter = filter === 'all' || (filter === 'mapped' && mapped) || (filter === 'unmapped' && !mapped);
            row.style.display = (matchSearch && matchFilter) ? '' : 'none';
        });
    }
    searchInput.addEventListener('input', applyFilter);
    filterSelect.addEventListener('change', applyFilter);

    // 모달 열기
    document.querySelectorAll('.btn-edit-hs').forEach(function (btn) {
        btn.addEventListener('click', function () {
            currentCatId = btn.dataset.catId;
            document.getElementById('hsModalCat').textContent = '카테고리: ' + btn.dataset.catNm;
            document.getElementById('hmHsCd').value = btn.dataset.hsCd || '';
            document.getElementById('hmHsNm').value = btn.dataset.hsNm || '';
            document.getElementById('hmHsDuRa').value = btn.dataset.hsDuRa || '';
            document.getElementById('hmDes').value = btn.dataset.hsDes || '';
            document.getElementById('hsModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        });
    });

    // 저장
    document.getElementById('btnHsSubmit').addEventListener('click', function () {
        var hsCd = document.getElementById('hmHsCd').value.trim();
        var hsNm = document.getElementById('hmHsNm').value.trim();
        var hsDuRa = document.getElementById('hmHsDuRa').value.trim();
        if (!hsCd || !hsNm || !hsDuRa) { alert('HS 코드, 품명, 관세율은 필수입니다.'); return; }

        var headers = { 'Content-Type': 'application/json' };
        headers[csrfHeader] = csrfToken;

        fetch('/admin/category/' + currentCatId + '/hscode', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({ hsCd: hsCd, hsNm: hsNm, hsDuRa: hsDuRa, des: document.getElementById('hmDes').value.trim() || null })
        })
        .then(function (res) { return res.json(); })
        .then(function (data) {
            if (data.status === 'ok') { location.reload(); }
            else { alert('실패: ' + (data.message || '')); }
        });
    });

    // 삭제
    document.querySelectorAll('.btn-delete-hs').forEach(function (btn) {
        btn.addEventListener('click', function () {
            if (!confirm('이 HS 코드를 삭제하시겠습니까?')) return;
            var headers = {};
            headers[csrfHeader] = csrfToken;

            fetch('/admin/category/' + btn.dataset.catId + '/hscode', {
                method: 'DELETE',
                headers: headers
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.status === 'ok') { location.reload(); }
                else { alert('삭제 실패: ' + (data.message || '')); }
            });
        });
    });
});
</script>
</th:block>
</html>
