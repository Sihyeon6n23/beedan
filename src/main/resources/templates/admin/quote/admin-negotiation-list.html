<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('ADMIN', 'Negotiation Management', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | 관리자 협상 목록</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{admin/admin-sidebar :: sidebar('quote', 'negotiation-list')}"></div>
</th:block>

<th:block th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/admin/admin-negotiation-list.css}">

    <section class="admin-ng-container">
        <!-- Header -->
        <header class="ang-header">
            <div class="ang-header__title">
                <span class="ang-kicker">Negotiation Management</span>
                <h1 class="ang-title">협상 목록</h1>
                <p class="ang-desc">모든 회원의 협상 현황을 조회하고 관리합니다.</p>
            </div>
        </header>

        <!-- Filter & Search -->
        <section class="ang-toolbar">
            <div class="ang-search-wrapper">
                <input type="text" placeholder="협상명, 회원명으로 검색">
                <span class="material-symbols-outlined">search</span>
            </div>
            <div class="ang-filter-set">
                <button class="ang-filter is-active">전체</button>
                <button class="ang-filter">진행중</button>
                <button class="ang-filter">종료</button>
            </div>
        </section>

        <!-- Table -->
        <div class="ang-table-wrapper">
            <table class="ang-table">
                <thead>
                <tr>
                    <th class="col-check"><input type="checkbox"></th>
                    <th class="col-ng-id">협상 ID</th>
                    <th class="col-ng-name">협상명</th>
                    <th class="col-member">회원명</th>
                    <th class="col-quote-count">견적 수</th>
                    <th class="col-status">상태</th>
                    <th class="col-start-date">시작일</th>
                    <th class="col-end-date">종료일</th>
                    <th class="col-action">관리</th>
                </tr>
                </thead>
                <tbody>
                <th:block th:each="ng : ${negotiations}">
                    <tr>
                        <td class="col-check"><input type="checkbox"></td>
                        <td class="col-ng-id" th:text="${ng.ngNm}">NG-2026-A01</td>
                        <td class="col-ng-name">
                            <span class="ng-name-text" th:text="${ng.ngNm}">협상명</span>
                        </td>
                        <td class="col-member">
                            <span class="member-name" th:text="${ng.memNm}">회원명</span>
                            <span class="member-company" th:text="${ng.memBizTtl}">회사명</span>
                        </td>
                        <td class="col-quote-count" th:text="${ng.quoteCount}">0</td>
                        <td class="col-status">
                            <span class="ang-badge"
                                  th:classappend="${ng.ongoing} ? ' ang-badge--ongoing' : ' ang-badge--closed'"
                                  th:text="${ng.ongoing} ? '진행중' : '종료'">상태</span>
                        </td>
                        <td class="col-start-date"
                            th:text="${ng.ngCreDt != null ? #temporals.format(ng.ngCreDt, 'yyyy.MM.dd') : '-'}">2026.03.10</td>
                        <td class="col-end-date"
                            th:classappend="${ng.ngEndDt == null} ? ' ang-date--empty' : ''"
                            th:text="${ng.ngEndDt != null ? #temporals.format(ng.ngEndDt, 'yyyy.MM.dd') : '—'}">—</td>
                        <td class="col-action">
                            <div class="ang-action-group">
                                <a th:href="@{/admin/negotiation/detail(ngId=${ng.ngId})}" class="ang-btn-view">VIEW</a>
                            </div>
                        </td>
                    </tr>
                </th:block>
                <tr th:if="${#lists.isEmpty(negotiations)}">
                    <td colspan="9" style="text-align:center; padding:3rem; color:#78716c;">
                        표시할 협상이 없습니다.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <footer class="ang-pagination-wrapper">
            <p class="ang-page-info"
               th:text="'총 ' + ${negotiations.size()} + ' 건'">총 0 건</p>
            <div class="ang-page-numbers">
                <button class="ang-page-btn active">1</button>
            </div>
        </footer>
    </section>
</th:block>
</html>
