<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('Payment', 'Payment Check', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | 결제</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{member/mypage/mypage-sidebar :: sidebar('quote', 'payment-list')}"></div>
</th:block>

<th:block th:fragment="content">
<link rel="stylesheet" th:href="@{/css/payment/payment-check.css}">
<link rel="stylesheet" th:href="@{/css/quote/roadToPayment.css}">
<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />
<script src="https://js.tosspayments.com/v1"></script>
<div class="page">

    <!-- 페이지 타이틀 -->
    <div class="page-title">
        <h1 class="title-heading">결제</h1>
        <div class="title-sub">
            <span class="title-bar"></span>
            <span class="title-label">보안 법인 결제</span>
        </div>
    </div>

    <!-- 진행 상태 타임라인 -->
    <div th:replace="~{fragments/quoteAndPayment/roadToPayment :: timeline(${activeStep})}"></div>

    <!-- 메인 컨텐츠 -->
    <div class="main-content">

        <!-- 01. 결제 수단 선택 -->
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">01. 결제 수단 선택</h2>
                <span class="section-sub">계정 유형 선택</span>
            </div>
            <div class="payment-methods">
                <div class="method-card method-card--active" id="method-bank" onclick="selectMethod('bank')">
                    <div class="method-card__top">
                        <span class="method-icon">🏦</span>
                        <span class="method-check" id="check-bank">✔</span>
                    </div>
                    <div class="method-card__bottom">
                        <p class="method-name">무통장 입금</p>
                        <p class="method-desc">익월 말 결제 / 표준 B2B 거래 규약</p>
                    </div>
                </div>
                <div class="method-card" id="method-card" onclick="selectMethod('card')">
                    <div class="method-card__top">
                        <span class="method-icon">💳</span>
                        <span class="method-check hidden" id="check-card">✔</span>
                    </div>
                    <div class="method-card__bottom">
                        <p class="method-name">법인카드 결제</p>
                        <p class="method-desc">실시간 승인</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 02. 결제 정보 등록 -->
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">02. 결제 정보 등록</h2>
                <span class="section-sub">법인 정보</span>
            </div>
            <div class="form-grid">
                <div class="form-group form-group--full">
                    <label class="form-label">법인/상호명</label>
                    <input class="form-input" type="text" readonly
                           th:value="${member != null and member.memBizTtl != null ? member.memBizTtl : ''}" />
                </div>
                <div class="form-group form-group--full">
                    <label class="form-label">사업장 소재지</label>
                    <input class="form-input" type="text" readonly
                           th:value="${member != null and member.memBizAdr != null ? member.memBizAdr : ''}" />
                </div>
                <div class="form-group">
                    <label class="form-label">사업자등록번호</label>
                    <input class="form-input" type="text" readonly
                           th:value="${member != null and member.memBizNo != null ? member.memBizNo : ''}" />
                </div>
                <div class="form-group">
                    <label class="form-label">담당자명</label>
                    <input class="form-input" type="text" readonly
                           th:value="${member != null and member.memNm != null ? member.memNm : ''}" />
                </div>
                <div class="form-group form-group--full">
                    <label class="form-label">견적 번호</label>
                    <input class="form-input" type="text" readonly
                           th:value="${quoteBase.quCd}" />
                </div>
            </div>
        </section>

        <!-- 03. 등록 정보 확인 -->
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">03. 등록 정보 확인</h2>
            </div>
            <div class="summary-box">

                <!-- 주문 항목 -->
                <div class="summary-items">
                    <div class="summary-item">
                        <div class="summary-item__info">
                            <p class="summary-item__name" th:text="${negotiation.ngNm + ' ' + quoteBase.quCd}">견적명</p>
                            <p class="summary-item__desc" th:text="${details.size() + '개 품목'}">0개 품목</p>
                        </div>
                        <span class="summary-item__price"
                              th:text="${itemTotalKrw != null ? '₩' + #numbers.formatInteger(itemTotalKrw, 1, 'COMMA') : '-'}">₩0</span>
                    </div>
                    <div class="summary-item" th:if="${intShipFeeOnly != null}">
                        <div class="summary-item__info">
                            <p class="summary-item__name">물류 비용</p>
                            <p class="summary-item__desc">국제 운임 + 국내 배송</p>
                        </div>
                        <span class="summary-item__price"
                              th:text="'₩' + ${#numbers.formatInteger(intShipFeeOnly.add(quoteInfo.quInfoDomShiFe != null ? quoteInfo.quInfoDomShiFe : 0), 1, 'COMMA')}">₩0</span>
                    </div>
                    <div class="summary-item" th:if="${quoteInfo != null and quoteInfo.quInfoSrvFeAm != null}">
                        <div class="summary-item__info">
                            <p class="summary-item__name">큐레이션 수수료</p>
                            <p class="summary-item__desc">구매 대행 서비스</p>
                        </div>
                        <span class="summary-item__price"
                              th:text="'₩' + ${#numbers.formatInteger(quoteInfo.quInfoSrvFeAm, 1, 'COMMA')}">₩0</span>
                    </div>
                </div>

                <!-- 금액 합계 -->
                <div class="summary-totals">
                    <div class="summary-row" th:if="${totalDutyVat != null}">
                        <span class="summary-row__label">관세 + 부가세</span>
                        <span class="summary-row__value"
                              th:text="'₩' + ${#numbers.formatInteger(totalDutyVat, 1, 'COMMA')}">₩0</span>
                    </div>
                    <div class="summary-row summary-row--total">
                        <span class="summary-row__label">최종 금액</span>
                        <span class="summary-row__value summary-row__value--total"
                              th:text="${calculatedTotal != null and calculatedTotal.longValue() > 0 ? '₩' + #numbers.formatInteger(calculatedTotal, 1, 'COMMA') : '산출 중'}">₩0</span>
                    </div>
                </div>

                <!-- 결제 버튼 -->
                <div class="summary-actions">
                    <button class="btn-primary" id="btnPay">결제 승인 →</button>
                    <p class="summary-terms">
                        결제 승인 시, BEEDAN의 B2B 마스터 서비스 이용약관 및 Net-30 정산 약관에 동의하는 것으로 간주됩니다.
                    </p>
                </div>

            </div>
        </section>

    </div><!-- /main-content -->

</div><!-- /page -->

<script th:inline="javascript">
    var quId = /*[[${quId}]]*/ 0;
    var quCd = /*[[${quoteBase.quCd}]]*/ '';
    var ngNm = /*[[${negotiation.ngNm}]]*/ '';
    var totalAmount = /*[[${calculatedTotal != null ? calculatedTotal : 0}]]*/ 0;
    var memberName = /*[[${member != null && member.memNm != null ? member.memNm : ''}]]*/ '';

    function selectMethod(type) {
        document.getElementById('method-bank').classList.remove('method-card--active');
        document.getElementById('method-card').classList.remove('method-card--active');
        document.getElementById('check-bank').classList.add('hidden');
        document.getElementById('check-card').classList.add('hidden');

        document.getElementById('method-' + type).classList.add('method-card--active');
        document.getElementById('check-' + type).classList.remove('hidden');
    }

    // 토스페이먼츠 초기화
    var clientKey = 'test_ck_yL0qZ4G1VOjz59D71a9k3oWb2MQY';
    var tossPayments = TossPayments(clientKey);

    // 결제 버튼 클릭 이벤트
    document.getElementById('btnPay').addEventListener('click', async function () {
        var selectedMethod = document.querySelector('.method-card--active').id;
        var orderName = ngNm + ' ' + quCd;
        var orderId = 'ORDER-' + quId + '-' + Date.now();
        var amount = parseInt(totalAmount) || 0;

        if (amount <= 0) {
            alert('결제 금액이 올바르지 않습니다.');
            return;
        }

        if (selectedMethod === 'method-bank') {
            await tossPayments.requestPayment('가상계좌', {
                amount: amount,
                orderId: orderId,
                orderName: orderName,
                customerName: memberName,
                bank: '국민',
                successUrl: window.location.origin + '/payment/success?quId=' + quId + '&method=VIRTUAL_ACCOUNT',
                failUrl: window.location.origin + '/payment/fail?quId=' + quId,
            });
        } else {
            await tossPayments.requestPayment('카드', {
                amount: amount,
                orderId: orderId,
                orderName: orderName,
                customerName: memberName,
                successUrl: window.location.origin + '/payment/success?quId=' + quId + '&method=CARD',
                failUrl: window.location.origin + '/payment/fail?quId=' + quId,
            });
        }
    });
</script>
</th:block>
</html>
