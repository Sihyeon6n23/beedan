<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('TRADE MANAGEMENT', 'Payment History', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | 결제 내역</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{member/mypage/mypage-sidebar :: sidebar('quote', 'payment-list')}"></div>
</th:block>

<th:block th:fragment="content">
<link rel="stylesheet" th:href="@{/css/quote/negotiation-list.css}">
<style>
    .payment-grid .ng-list-head,
    .payment-grid .ng-row {
        grid-template-columns: minmax(0, 3fr) minmax(100px, 1.2fr) minmax(80px, 1fr) minmax(80px, 1fr) minmax(110px, 1.1fr);
    }
</style>

<section class="ng-page ng-list-page payment-grid">
    <!-- Header -->
    <header class="ng-shell ng-shell--header">
        <div class="ng-shell__heading">
            <span class="ng-kicker">Payment History</span>
            <h2 class="ng-title">결제 내역</h2>
        </div>
        <div class="ng-shell__rule"><span></span></div>
    </header>

    <!-- List -->
    <section class="ng-shell ng-shell--list">
        <div class="ng-list-head">
            <div>결제 정보</div>
            <div>금액</div>
            <div>결제 수단</div>
            <div>상태</div>
            <div>결제일</div>
        </div>

        <div class="ng-list-body">
            <th:block th:each="item : ${payments}">
                <a th:href="@{/payment/quote-detail(quId=${item.payment.quId})}"
                   class="ng-row">
                    <div class="ng-row__primary">
                        <div class="ng-row__text">
                            <h2 th:text="${item.ngNm + ' ' + item.quCd}">협상명 QU0001</h2>
                        </div>
                    </div>
                    <div class="ng-row__status" style="font-weight:700;">
                        <span th:text="${item.payment.pyTtAm != null ? '₩' + #numbers.formatInteger(item.payment.pyTtAm, 3, 'COMMA') : '-'}">₩0</span>
                    </div>
                    <div class="ng-row__status">
                        <span th:text="${item.payment.pyMt != null ? (item.payment.pyMt.name() == 'CARD' ? '법인카드' : '무통장입금') : '-'}">-</span>
                    </div>
                    <div class="ng-row__status">
                        <span class="ng-badge"
                              th:classappend="${item.payment.pyStt.name() == 'PAID' ? ' ng-badge--ongoing' : ' ng-badge--closed'}"
                              th:text="${item.payment.pyStt.name() == 'PAID' ? '결제완료' :
                                         item.payment.pyStt.name() == 'CANCELLED' ? '취소됨' :
                                         item.payment.pyStt.name() == 'FAILED' ? '실패' : '대기'}">상태</span>
                    </div>
                    <div class="ng-row__time">
                        <span th:text="${item.payment.pyPdAt != null ? #temporals.format(item.payment.pyPdAt, 'yyyy.MM.dd HH:mm') : '-'}">-</span>
                    </div>
                </a>
            </th:block>

            <div class="ng-empty-state" th:if="${#lists.isEmpty(payments)}">
                <strong>결제 내역이 없습니다.</strong>
                <p>아직 결제한 견적이 없습니다.</p>
            </div>
        </div>
    </section>
</section>

</th:block>
</html>
