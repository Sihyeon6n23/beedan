<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          ~{::title},
          ~{fragments/sidebar :: frame('배송지 정보 관리', 'Receiver Address Management', ~{::sidebar})},
          ~{::content}
      )}">

<title th:fragment="title">BEEDAN | 배송지 정보 관리</title>

<th:block th:fragment="sidebar">
    <div th:replace="~{member/mypage/mypage-sidebar :: sidebar('Receiver', 'Insert receiver Info')}"></div>
</th:block>

<th:block th:fragment="content">
    <main class="noti-page-container">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-extrabold text-[var(--pub-text-main)] tracking-tight">배송지 목록</h1>
                <p class="text-sm text-[var(--pub-text-sub)] mt-2 font-medium">다양한 배송지를 등록하여 편하게 사용하세요</p>
            </div>

            <button type="button" id="searchPostCode" class="btn-secondary px-4 whitespace-nowrap" onclick="openModal()">배송지 추가</button>
        </header>

        <section class="bg-[var(--pub-bg-card)] rounded-2xl border border-[var(--pub-border)] shadow-sm overflow-hidden">
            <div id="notiPageContent">
                <ul class="data-list-container">

                </ul>
            </div>
        </section>

        <div id="addReceiverModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden" style="display: none;">
            <div class="bg-white p-6 rounded-lg w-96">
                <h2 class="text-xl font-bold mb-4">배송지 추가</h2>
                <form id="addReceiverForm">
                    <div class="mb-4">
                        <label class="block text-sm font-medium">이름</label>
                        <input type="text" id="rcNm" class="w-full p-2 border rounded" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium">전화번호</label>
                        <input type="text" id="rcPhn" class="w-full p-2 border rounded" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium">주소</label>
                        <input type="text" id="postcode" placeholder="우편번호" class="w-full p-2 border rounded mb-2" readonly>
                        <input type="text" id="baseAddress" placeholder="기본주소" class="w-full p-2 border rounded mb-2" readonly>
                        <input type="text" id="detailAddress" placeholder="상세주소" class="w-full p-2 border rounded mb-2">
                        <button type="button" onclick="execDaumPostcode()" class="btn-secondary px-4">주소 검색</button>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium">메시지</label>
                        <textarea id="rcMsg" class="w-full p-2 border rounded"></textarea>
                    </div>
                    <div class="flex justify-end">
                        <button type="button" onclick="closeModal()" class="btn-secondary mr-2">취소</button>
                        <button type="button" onclick="addReceiver()" class="btn-primary">저장</button>
                    </div>
                </form>
            </div>
        </div>

        <script th:src="@{/js/postcode/postcode.js}"></script>
        <script th:src="@{/js/receiver/receiver.js}"></script>
    </main>
</th:block>
</html>
