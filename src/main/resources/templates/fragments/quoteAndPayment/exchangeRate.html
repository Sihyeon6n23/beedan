<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>

<div th:fragment="exchangeRateCard(rates, activeIndex)" class="exchange-rate-section">

    <!-- 각 환율 슬라이드 -->
    <div th:each="rate, stat : ${rates}"
         th:class="'er-slide' + (${stat.index == activeIndex} ? ' er-slide--active' : '')"
         th:data-index="${stat.index}">

        <div class="er-slide-left">
            <span class="er-slide-value">
                1 <span th:text="${rate.erCr}">JPY</span>
                =
                <span class="er-rate-number" th:text="${#numbers.formatDecimal(rate.erRa, 1, 'COMMA', 2, 'POINT')}">9.14</span>
                KRW
            </span>
        </div>

        <div class="er-slide-right">
            <span class="er-fetched-label">기준 시간</span>
            <span class="er-fetched-value"
                  th:text="${#temporals.format(rate.erFDt, 'yyyy.MM.dd — HH:mm:ss')} + ' KST'">2024.05.24 — 14:32:01 KST</span>
        </div>

    </div>

    <!-- 통화 선택 셀렉트 박스 -->
    <select class="er-select" id="erCurrencySelect">
        <option th:each="rate, stat : ${rates}"
                th:value="${stat.index}"
                th:text="${rate.erCr + ' / ' + rate.erBa}"
                th:selected="${stat.index == activeIndex}">JPY / KRW</option>
    </select>

    <script th:inline="none">
        document.addEventListener('DOMContentLoaded', function () {
            var section = document.querySelector('.exchange-rate-section');
            if (!section) return;

            var slides = section.querySelectorAll('.er-slide');
            var select = document.getElementById('erCurrencySelect');
            if (!select) return;

            select.addEventListener('change', function () {
                var index = parseInt(this.value);
                slides.forEach(function (s) { s.classList.remove('er-slide--active'); });
                if (slides[index]) slides[index].classList.add('er-slide--active');
            });
        });
    </script>

</div>

</body>
</html>
