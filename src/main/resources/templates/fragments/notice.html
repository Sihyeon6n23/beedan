<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="notificationDropdown" id="notificationDropdown" class="notification-wrapper hidden">
    <div class="notification-container">
        <header class="noti-header">
            <h3>Notifications</h3>
            <button class="btn-mark-read">Mark all as read</button>
        </header>

        <div class="noti-list custom-scrollbar">
            <article class="noti-item unread">
            </article>
        </div>

        <footer class="noti-footer">
            <button class="btn-view-all">
                <a th:href="@{/notification/list}">View All Notifications</a>
            </button>
        </footer>
    </div>
</div>
</html>
