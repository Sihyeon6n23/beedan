<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<header th:fragment="headerFragment"
        class="header_final-1 fixed top-0 left-0 w-full z-50 h-16 bg-white border-b border-stone-100">

    <div class="w-full h-full px-6 md:px-12 flex items-center justify-between">

        <div class="flex items-center gap-2 cursor-pointer flex-1" onclick="location.href='/'">
            <img th:src="@{/image/logo.png}" class="h-8 w-auto" alt="logo" />
            <p class="text-xl font-bold tracking-tight text-stone-900">BEEDAN</p>
        </div>

        <nav class="hidden md:flex items-center justify-center gap-12 flex-1">
            <a th:href="@{/stock/list}" class="text-sm font-bold text-stone-600 hover:text-primary transition-colors no-underline">STOCK</a>
            <a th:href="@{/notice/list}" class="text-sm font-bold text-stone-600 hover:text-primary transition-colors no-underline">NOTICE</a>
            <a th:href="@{/about}" class="text-sm font-bold text-stone-600 hover:text-primary transition-colors no-underline">ABOUT</a>
            <th:if sec:authorize="hasRole('USER')">
            <a th:href="@{/mypage}" class="text-sm font-bold text-stone-600 hover:text-primary transition-colors no-underline">MY PAGE</a>
            </th:if>
        </nav>

        <div class="flex items-center justify-end gap-6 flex-1">
            <div sec:authorize="hasRole('ROOT')">
                <a th:href="@{/root/main}">
                    <span class="material-symbols-outlined">settings_suggest</span>
                </a>
            </div>

            <div sec:authorize="hasAnyRole('ADMIN', 'ROOT')">
                <a th:href="@{/admin/main}">
                    <span class="material-symbols-outlined">admin_panel_settings</span>
                </a>
            </div>
            <div class="button">
                <th:block sec:authorize="isAnonymous()">
                    <div class="flex items-center gap-4">
                        <a th:href="@{/auth/signup}" class="text-xs font-bold no-underline text-stone-900">SIGNUP</a>
                        <a th:href="@{/auth/signin}" class="text-xs font-bold no-underline text-stone-900">LOGIN</a>
                    </div>
                </th:block>
                <th:block>
                    <form sec:authorize="isAuthenticated()" method="post" action="/auth/signout">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="text-xs font-bold no-underline text-stone-900">LOGOUT</button>
                    </form>
                </th:block>
            </div>

            <div id="notiIcon" sec:authorize="hasRole('USER')" class="relative flex items-center cursor-pointer">
                <span class="material-symbols-outlined">notifications</span>

                <span id="unreadBadge"
                      th:with="count=${session.unreadCount}"
                      th:classappend="${count != null and count > 0} ? 'flex' : 'hidden'"
                      th:style="${count != null and count > 0} ? 'display: flex !important;' : 'display: none !important;'"
                      class="absolute -top-2 -right-2 min-w-[16px] h-4 px-1 bg-primary text-white text-[10px] font-bold items-center justify-center rounded-full border border-white">
                        [[${count > 6 ? '6+' : (count > 0 ? count : '')}]]
                </span>

                <div th:replace="~{notification/notification :: notificationDropdown}"></div>
            </div>

            <div id="wishlistIcon" sec:authorize="hasRole('USER')" class="relative flex items-center cursor-pointer hover:opacity-70 transition-opacity text-stone-900">
                <a th:href="@{/wishlist}" class="flex items-center">
                    <span class="material-symbols-outlined leading-none">favorite</span>
                </a>
            </div>
            <div id="cartIcon" sec:authorize="hasRole('USER')" class="relative flex items-center cursor-pointer hover:opacity-70 transition-opacity text-stone-900">
                <a th:href="@{/cart}" class="flex items-center">
                    <span class="material-symbols-outlined leading-none">shopping_cart</span>
                </a>
            </div>
        </div>

    </div>
</header>
</html>
