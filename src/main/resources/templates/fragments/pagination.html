<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="paging(boardPage)">
  <nav th:if="${boardPage.totalPages > 0}" aria-label="Page navigation">
    <ul class="inquiry-pagination-list" style="display: flex; justify-content: center; list-style: none; gap: 10px;">

      <li th:classappend="${boardPage.first} ? 'disabled'">
        <a th:href="@{/notice/list(page=${boardPage.number})}" aria-label="Previous">
          <span aria-hidden="true">&laquo;</span>
        </a>
      </li>

      <li th:each="page : ${#numbers.sequence(
                    T(java.lang.Math).max(1, boardPage.number - 4),
                    T(java.lang.Math).min(boardPage.totalPages, boardPage.number + 6))}"
          th:classappend="${page == boardPage.number + 1} ? 'active'">
        <a th:href="@{/notice/list(page=${page})}" th:text="${page}"
           th:style="${page == boardPage.number + 1} ? 'font-weight: bold; color: red;' : ''">1</a>
      </li>

      <li th:classappend="${boardPage.last} ? 'disabled'">
        <a th:href="@{/notice/list(page=${boardPage.number + 2})}" aria-label="Next">
          <span aria-hidden="true">&raquo;</span>
        </a>
      </li>
    </ul>
  </nav>
</div>
</html>
