<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="closeConfirmModal">
    <section class="admin-chat-modal is-hidden" data-modal="close" aria-hidden="true">
        <div class="admin-chat-modal__backdrop" data-modal-close></div>
        <div class="admin-chat-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="close-chat-modal-title">
            <div class="admin-chat-modal__header">
                <div class="admin-chat-modal__accent"></div>
                <div class="admin-chat-modal__icon admin-chat-modal__icon--framed">
                    <span class="material-symbols-outlined">person_pin</span>
                </div>
            </div>

            <div class="admin-chat-modal__body">
                <h2 id="close-chat-modal-title" class="admin-chat-modal__title">상담 종료 확인</h2>
                <div class="admin-chat-modal__content-stack admin-chat-modal__content-stack--dense">
                    <p class="admin-chat-modal__lead">이 상담을 종료하시겠습니까?</p>
                    <p class="admin-chat-modal__description">종료 처리 후에는 상담 상태가 종료됨으로 변경되며,<br>추가 답변은 보낼 수 없습니다.</p>
                </div>
            </div>

            <div class="admin-chat-modal__actions">
                <button type="button" class="btn-primary" data-modal-confirm-close>상담 종료</button>
                <button type="button" class="admin-chat-surface-button" data-modal-close>취소</button>
            </div>

            <div class="admin-chat-modal__meta">
                <span>System Auth Required</span>
                <span>REF: CMD_CLOSE_01</span>
            </div>
        </div>
    </section>
</th:block>
</html>
